# E008 hello screen (spec #34), against the local stack. Elements are found by id: the Android testTag and the iOS
# accessibilityIdentifier, the same on both apps (hello.greeting, hello.loading, hello.error, hello.retry).
# HELLO_TITLE, set by scripts/maestro.sh: hello.title from packages/i18n in the device language.
appId: ${APP_ID}
name: "AC1/AC2: greeting from the database"
env:
  # The Android application id and the iOS bundle id.
  APP_ID: nl.trainerhub.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: hello\.greeting
    timeout: 20000
- assertVisible:
    id: hello\.greeting
    text: ${HELLO_TITLE}
