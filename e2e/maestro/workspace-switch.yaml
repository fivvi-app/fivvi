# F012 native workspace switch (spec #423, AC6 and AC7), against the local stack: Sarah (the seeded trainer@example.com) is
# Trainer of John's Gym and Owner of Sarah Personal Training. She signs in and the app opens John's Gym (first by name,
# nothing remembered after clearState), shows its name and its clients; in Profiel → Mijn werkruimtes she taps Sarah
# Personal Training, the app returns to the first tab, whose header shows that name, and Klanten holds none of John's
# Gym's clients (Sarah Personal Training has no seeded clients: its empty state). Closing the app and opening it again
# opens Sarah Personal Training; so does a sign-out and sign-in on the same device (the last workspace is kept on the
# device, not on the account). The flow changes no data in the database, so it can run any number of times. It reopens
# the app (launchApp, no clearState) where it needs the first tab again: the back button of a pushed screen has no id
# the two apps share, and Maestro's `back` is Android only.
# The sign-in is the shared sub-flow. Elements are found by id: the Android testTag and the iOS accessibilityIdentifier,
# the same on both apps (the row ids end in the workspace's slug). The check on a row is its selected state.
appId: ${APP_ID}
name: AC6 AC7 Profiel switches workspace and the app reopens the last one
env:
  # The Android application id and the iOS bundle id.
  APP_ID: app.fivvi.pro
  # Sarah: seeded (packages/database/src/seed.ts).
  EMAIL: trainer@example.com
---
- launchApp:
    clearState: true
- runFlow:
    file: shared/sign-in.yaml
# Nothing is remembered yet: the first workspace by name, with its clients.
- extendedWaitUntil:
    visible:
      id: home\.workspaceName
      text: John's Gym
    timeout: 20000
- tapOn:
    id: home\.openClients
- extendedWaitUntil:
    visible: .*Anna de Vries.*
    timeout: 20000
- launchApp
# AC6: Profiel lists both workspaces with the check on John's Gym.
- extendedWaitUntil:
    visible:
      id: home\.openProfile
    timeout: 20000
- tapOn:
    id: home\.openProfile
- extendedWaitUntil:
    visible:
      id: profile\.workspace\.johns-gym
      selected: true
    timeout: 20000
- assertVisible:
    id: profile\.workspace\.sarah-personal-training
    selected: false
# Tapping Sarah Personal Training returns to the first tab, which shows its name.
- tapOn:
    id: profile\.workspace\.sarah-personal-training
- extendedWaitUntil:
    visible:
      id: home\.workspaceName
      text: Sarah Personal Training
    timeout: 20000
- assertNotVisible:
    id: profile\.workspacesTitle
# Klanten shows only the clients of Sarah Personal Training.
- tapOn:
    id: home\.openClients
- extendedWaitUntil:
    visible:
      id: clients\.empty
    timeout: 20000
- assertNotVisible: .*Anna de Vries.*
# AC7: closing the app and opening it again opens Sarah Personal Training (no clearState: the session and the preference
# stay).
- launchApp
- extendedWaitUntil:
    visible:
      id: home\.workspaceName
      text: Sarah Personal Training
    timeout: 20000
# AC6: the check moved.
- tapOn:
    id: home\.openProfile
- extendedWaitUntil:
    visible:
      id: profile\.workspace\.sarah-personal-training
      selected: true
    timeout: 20000
- assertVisible:
    id: profile\.workspace\.johns-gym
    selected: false
- launchApp
# AC7: also after a sign-out and sign-in on this device.
- extendedWaitUntil:
    visible:
      id: home\.signOut
    timeout: 20000
- tapOn:
    id: home\.signOut
- runFlow:
    file: shared/sign-in.yaml
- extendedWaitUntil:
    visible:
      id: home\.workspaceName
      text: Sarah Personal Training
    timeout: 20000
