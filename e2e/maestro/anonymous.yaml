# F001 native sign-in, AC13 (spec #168): the anonymous app opens on TM-01 and reaches no signed-in screen. Elements are
# found by id: the Android testTag and the iOS accessibilityIdentifier, the same on both apps (signIn.email, signIn.send).
# SIGN_IN_SEND_CODE, set by scripts/maestro.sh: signIn.sendCode from packages/i18n in the device language. It has no
# default here: a flow's own env default would win over the value maestro.sh passes. The E008 hello screen sits behind
# sign-in and is tested by the sign-in flow (#216).
appId: ${APP_ID}
name: AC13 anonymous app opens on sign-in
env:
  # The Android application id and the iOS bundle id.
  APP_ID: app.fivvi.pro
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: signIn\.email
    timeout: 20000
- assertVisible:
    id: signIn\.send
# Its own step: on Android the button's text is a child node of the one with the id.
- assertVisible:
    text: ${SIGN_IN_SEND_CODE}
- assertNotVisible:
    id: hello\.greeting
- assertNotVisible:
    id: home\.signedInAs
