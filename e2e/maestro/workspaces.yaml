# F002 native home (spec #170, AC10), against the local stack: an account that has no workspace but may create one (an
# address of the sign-up allowlist, which the maestro stack sets to @example.com) is told to set one up on the web, in
# the device language. The sign-in is the shared sub-flow; the signed-in home answers from GET /api/v1/me. Elements are
# found by id: the Android testTag and the iOS accessibilityIdentifier, the same on both apps. The button opens the
# system browser, which leaves the app, so the flow shows it and does not tap it.
# HOME_SET_UP_ON_WEB, set by scripts/maestro.sh: home.setUpOnWeb from packages/i18n in the device language. It has no
# default here: a flow's own env default would win over the value maestro.sh passes.
appId: ${APP_ID}
name: AC10 no workspace shows set up on the web
env:
  # The Android application id and the iOS bundle id.
  APP_ID: app.fivvi.pro
  # An allowlisted address the seed doesn't give a workspace: signing in creates its account (F001).
  EMAIL: newcomer@example.com
---
- launchApp:
    clearState: true
- runFlow:
    file: shared/sign-in.yaml
- extendedWaitUntil:
    visible:
      id: home\.setUpOnWeb
    timeout: 20000
- assertVisible:
    id: home\.setUpOnWeb
    text: ${HOME_SET_UP_ON_WEB}
- assertVisible:
    id: home\.openWeb
- assertNotVisible:
    id: home\.workspaceName
- assertNotVisible:
    id: home\.noAccess
