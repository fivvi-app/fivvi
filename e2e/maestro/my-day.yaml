# F013 native Vandaag and Agenda (spec #457, AC1 and AC4 of TD-01, AC6 of TD-04), against the local stack: Sarah (the seeded trainer@example.com, a
# Trainer of John's Gym, which opens first, and the Owner of Sarah Personal Training) plans a session with Anna from + (the
# form's own first start is the next full hour, so no clock is read), reopens the app, which opens on its first tab, Vandaag,
# with the large title and the day of the personal scope (AC1), and then turns the current workspace to Sarah Personal Training
# in Profiel. The next item on Vandaag is the first item of the day that has not ended: the planned session, or the weekly
# class "Kracht" (John's Gym, Tue and Thu 18:00-19:00) while it is in progress. Either opens in its own workspace, John's
# Gym, while the current one stays Sarah Personal Training (AC4). The sign-in is the shared sub-flow, which ends on the
# home tab. Elements are found by id: the Android testTag and the iOS accessibilityIdentifier, the same on both apps
# (tab.*, today.*, home.*, newSession.*, session.*). Texts differ by language, so the flow checks what both languages share
# (the workspace's name) and the ids. The two platform tickets (iOS #524, Android #525) run this one flow. Past 23:00 the
# planned session is tomorrow's, so Vandaag may have no item to open: the flow then ends after AC1.
# AC6 (TD-04, Agenda; iOS #526, Android #527): the second tab opens Agenda, with the week strip and its line ("Week 43 · ..."),
# which is the week of the real clock, so no session or date is asserted; Maand | Month shows the month grid with the month's
# name, and Dag | Day the strip again. The ids both apps give it: calendar.title, calendar.weekLine, calendar.grid,
# calendar.monthTitle, calendar.failed (never visible); the three views are found by their words in both languages.
appId: ${APP_ID}
name: AC1 AC4 AC6 Vandaag shows the day across workspaces and opens an item in its own workspace, and Agenda opens
env:
  # The Android application id and the iOS bundle id.
  APP_ID: app.fivvi.pro
  # Sarah: seeded, a Trainer of John's Gym and the Owner of Sarah Personal Training (packages/database/src/seed.ts).
  EMAIL: trainer@example.com
---
- launchApp:
    clearState: true
- runFlow:
    file: shared/sign-in.yaml
# Something to see today: a session with Anna in John's Gym (PS-04, as in private-session.yaml).
- extendedWaitUntil:
    visible:
      id: home\.openClients
    timeout: 20000
- tapOn:
    id: home\.new
- tapOn:
    id: home\.newPrivateSession
- extendedWaitUntil:
    visible:
      id: newSession\.save
    timeout: 20000
- tapOn:
    id: newSession\.client
- extendedWaitUntil:
    visible:
      id: clientPicker\.search
    timeout: 20000
- tapOn:
    id: clientPicker\.search
- inputText: Anna
- extendedWaitUntil:
    visible: .*Anna de Vries.*
    timeout: 20000
- tapOn: .*Anna de Vries.*
- extendedWaitUntil:
    visible:
      id: newSession\.clientName
      text: Anna de Vries
    timeout: 20000
- tapOn:
    id: newSession\.save
# PS-07 (F023): an earlier run's session, or one of Sarah's seeded week, may sit in that hour; keep this one anyway.
- extendedWaitUntil:
    visible:
      id: (session\.title|newSession\.doubleBooking\.saveAnyway)
    timeout: 20000
- runFlow:
    when:
      visible:
        id: newSession\.doubleBooking\.saveAnyway
    commands:
      - tapOn:
          id: newSession\.doubleBooking\.saveAnyway
- extendedWaitUntil:
    visible:
      id: session\.title
    timeout: 20000
# AC1: the app opens on Vandaag (the app is reopened, the sign-in stays): the large title and the day, one of the two states
# a day has (a next item, or nothing today), never the failed state.
- launchApp
- extendedWaitUntil:
    visible:
      id: today\.title
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: (today\.next\.open|today\.empty)
    timeout: 20000
- assertNotVisible:
    id: today\.failed
- assertVisible:
    id: tab\.calendar
- assertVisible:
    id: tab\.home
# AC6: Agenda (TD-04): the week first, then the month grid, then the day with the strip again; never the failed state.
- tapOn:
    id: tab\.calendar
- extendedWaitUntil:
    visible:
      id: calendar\.title
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: calendar\.weekLine
    timeout: 20000
- assertNotVisible:
    id: calendar\.failed
- tapOn:
    text: (Maand|Month)
- extendedWaitUntil:
    visible:
      id: calendar\.grid
    timeout: 20000
- assertVisible:
    id: calendar\.monthTitle
- assertNotVisible:
    id: calendar\.failed
- tapOn:
    text: (Dag|Day)
- extendedWaitUntil:
    visible:
      id: calendar\.weekLine
    timeout: 20000
- assertNotVisible:
    id: calendar\.failed
- tapOn:
    id: tab\.today
- extendedWaitUntil:
    visible:
      id: today\.title
    timeout: 20000
# AC4: the current workspace is turned to Sarah Personal Training (Profiel, on the home tab).
- tapOn:
    id: tab\.home
- extendedWaitUntil:
    visible:
      id: home\.openProfile
    timeout: 20000
- tapOn:
    id: home\.openProfile
- extendedWaitUntil:
    visible:
      id: profile\.workspace\.sarah-personal-training
    timeout: 20000
- tapOn:
    id: profile\.workspace\.sarah-personal-training
- extendedWaitUntil:
    visible:
      id: home\.workspaceName
      text: Sarah Personal Training
    timeout: 20000
- tapOn:
    id: tab\.today
- extendedWaitUntil:
    visible:
      id: today\.title
    timeout: 20000
# Past 23:00 in Amsterdam the planned session is tomorrow's and Vandaag may have no item to open, so AC4 is skipped then, and
# only then: the host's UTC hour, 21 or later, is that time in summer and a little early in winter (the clock the flow reads
# is the host's, which the emulator's time follows). Before that Vandaag has an item to open, the planned session or the class
# in progress, so each check below fails the flow when it doesn't hold, and none of them is a branch that can pass by not
# looking.
- evalScript: ${output.lateInTheDay = new Date().getUTCHours() >= 21}
- runFlow:
    when:
      true: ${!output.lateInTheDay}
    commands:
      - extendedWaitUntil:
          visible:
            id: today\.next\.open
          timeout: 20000
      - tapOn:
          id: today\.next\.open
      # The item in its own workspace, not the current Sarah Personal Training: TD-02 of the planned session, which names
      # John's Gym, or TD-03 of the class in progress, which opens only in the workspace of the class (John's Gym).
      - extendedWaitUntil:
          visible:
            id: (session\.title|classDate\.title)
          timeout: 20000
      - runFlow:
          when:
            visible:
              id: session\.title
          commands:
            - assertVisible:
                id: session\.workspace
                text: John's Gym
      # TD-03 shows its title also while loading, after a failed load and without permission, so the title alone proves
      # nothing: the booked line exists only once the class is loaded (in the workspace of the class, John's Gym), and
      # neither the error nor the no-permission message may show.
      - runFlow:
          when:
            visible:
              id: classDate\.title
          commands:
            - extendedWaitUntil:
                visible:
                  id: classDate\.booked
                timeout: 20000
            - assertNotVisible:
                id: classDate\.error
            - assertNotVisible:
                id: classDate\.noPermission
      # Reopened (the back button of a pushed screen has no id the two apps share): the current workspace is the one chosen.
      - launchApp
      - extendedWaitUntil:
          visible:
            id: today\.title
          timeout: 20000
      - tapOn:
          id: tab\.home
      - extendedWaitUntil:
          visible:
            id: home\.workspaceName
            text: Sarah Personal Training
          timeout: 20000
