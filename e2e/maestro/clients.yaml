# F006 native Klanten (spec #174, AC1 and AC12), against the local stack: John (the seeded owner@example.com) opens
# Klanten of John's Gym, sees the seeded synthetic clients (AC15), searches by part of a name, adds a client with only a
# name and an email address (AC1: the profile opens and the language for emails is the workspace default, named), is
# offered Anna instead of a second client when he adds her address (AC3), and edits the new client in the overview (AC7).
# The sign-in is the shared sub-flow. Elements are found by id: the Android testTag and the iOS accessibilityIdentifier, the same on both apps
# (clients.*, clients.add.*, clientProfile.*, clientProfile.edit.*; the row ids end in the client's ID, so rows are found
# by their text). Text is matched where the Text carries the id; a button's label sits on a child in the Compose tree, so
# buttons are found by id alone. The language line is checked by what both languages share, "Nederlands" or "Dutch":
# scripts/maestro.sh passes no client texts, and the exact wording is proven in the Compose tests in both languages.
# The run adds clients to the seeded database in each locale, and every client needs an email address that is new to the
# workspace (the same one answers 409, AC3), so the flow adds an address of its own for each run: the time is in it.
appId: ${APP_ID}
name: AC1 AC12 Klanten list, search, add, profile and edit
env:
  # The Android application id and the iOS bundle id.
  APP_ID: app.fivvi.pro
  # John: seeded, the Owner of John's Gym (packages/database/src/seed.ts).
  EMAIL: owner@example.com
---
- launchApp:
    clearState: true
- runFlow:
    file: shared/sign-in.yaml
# AC12: Klanten lists the clients of the workspace, as the web does.
- extendedWaitUntil:
    visible:
      id: home\.openClients
    timeout: 20000
- tapOn:
    id: home\.openClients
- extendedWaitUntil:
    visible:
      id: clients\.list
    timeout: 20000
- extendedWaitUntil:
    visible: .*Anna de Vries.*
    timeout: 20000
- assertVisible: .*Mark Jansen.*
- assertVisible: .*Sophie Bakker.*
# AC6 and AC12: the search finds part of a name (case does not matter).
- tapOn:
    id: clients\.search
- inputText: VRIE
- extendedWaitUntil:
    notVisible: .*Sophie Bakker.*
    timeout: 20000
- assertVisible: .*Anna de Vries.*
- assertNotVisible: .*Mark Jansen.*
- eraseText: 4
- extendedWaitUntil:
    visible: .*Sophie Bakker.*
    timeout: 20000
# The keyboard of the search field would cover the primary action.
- hideKeyboard
# AC1: a name and an email address are needed; the profile opens, and the language for emails is the workspace default
# (named).
- evalScript: ${output.carlaEmail = 'carla.' + Date.now() + '@example.com'}
- tapOn:
    id: clients\.add
- extendedWaitUntil:
    visible:
      id: clients\.add\.name
    timeout: 20000
- tapOn:
    id: clients\.add\.name
- inputText: Carla Bos
- tapOn:
    id: clients\.add\.email
- inputText: ${output.carlaEmail}
- tapOn:
    id: clients\.add\.submit
- extendedWaitUntil:
    visible:
      id: clientProfile\.title
      text: Carla Bos
    timeout: 20000
- assertVisible:
    id: clientProfile\.name
    text: Carla Bos
- assertVisible:
    id: clientProfile\.email
    text: ${output.carlaEmail}
- assertVisible:
    id: clientProfile\.language
    text: .*(Nederlands|Dutch).*
# AC7: the overview edits the name and shows the change.
- tapOn:
    id: clientProfile\.edit
- extendedWaitUntil:
    visible:
      id: clientProfile\.edit\.name
    timeout: 20000
- tapOn:
    id: clientProfile\.edit\.name
- eraseText: 20
- inputText: Carla Bos-Smit
- tapOn:
    id: clientProfile\.edit\.save
- extendedWaitUntil:
    visible:
      id: clientProfile\.title
      text: Carla Bos-Smit
    timeout: 20000
# AC3: the address of Anna offers Anna instead of a second client.
- tapOn:
    id: clientProfile\.back
- extendedWaitUntil:
    visible:
      id: clients\.add
    timeout: 20000
- tapOn:
    id: clients\.add
- extendedWaitUntil:
    visible:
      id: clients\.add\.name
    timeout: 20000
- tapOn:
    id: clients\.add\.name
- inputText: Anna
- tapOn:
    id: clients\.add\.email
- inputText: Anna@Example.com
- tapOn:
    id: clients\.add\.submit
- extendedWaitUntil:
    visible:
      id: clients\.add\.duplicate
    timeout: 20000
- tapOn:
    id: clients\.add\.openExisting
- extendedWaitUntil:
    visible:
      id: clientProfile\.title
      text: Anna de Vries
    timeout: 20000
- assertVisible:
    id: clientProfile\.email
    text: anna@example.com
