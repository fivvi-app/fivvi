# F006 native Klanten (spec #174, AC1 and AC12), against the local stack: Sarah (the seeded trainer@example.com) is
# Trainer of John's Gym, whose seeded clients are Anna de Vries (anna@example.com, English), Mark Jansen (no email address)
# and Sophie Bakker. The flow lists and searches them, opens Anna's overview, adds a client with a name only (AC1), then
# renames that client under Bewerken. Clients can't be deleted (F006), and the database lives for both locales' runs, so
# the flow adds a client of its own name (a timestamp) and changes only that one; Anna's data stays as seeded. Elements
# are found by id, the Android testTag and the iOS accessibilityIdentifier, the same on both apps; a list row has the
# id clients.row and the client's name and email address as its text, so the flow finds it by that text. The search field
# is found by its placeholder. There is no `back` on iOS, so the flow reopens the app (the session stays) between its
# two parts.
# CLIENTS_SEARCH_PLACEHOLDER and CLIENT_LOCALE_DEFAULT and CLIENT_LOCALE_EN, set by scripts/maestro.sh: clients.searchPlaceholder,
# clients.addDialog.localeDefault with the name of the workspace's default language (Dutch: John's Gym follows nl-NL),
# and clients.addDialog.localeEn, from packages/i18n in the device language. They have no default here: a flow's own env
# default would win over the value maestro.sh passes.
appId: ${APP_ID}
name: AC1_AC12 Klanten lists, searches, adds with a name only and edits
env:
  # The Android application id and the iOS bundle id.
  APP_ID: app.fivvi.pro
  # Sarah: seeded (packages/database/src/seed.ts).
  EMAIL: trainer@example.com
---
- launchApp:
    clearState: true
- runFlow:
    file: shared/sign-in.yaml
# AC12: the list and the search show the clients of the workspace.
- tapOn:
    id: home\.openClients
- extendedWaitUntil:
    visible:
      text: Anna de Vries.*
    timeout: 20000
- assertVisible:
    text: Mark Jansen.*
- assertVisible:
    text: Sophie Bakker.*
- tapOn: ${CLIENTS_SEARCH_PLACEHOLDER}
- inputText: vrie
- extendedWaitUntil:
    notVisible:
      text: Mark Jansen.*
    timeout: 20000
- assertVisible:
    text: Anna de Vries.*
- assertNotVisible:
    text: Sophie Bakker.*
# AC12: the overview shows the same fields.
- tapOn:
    text: Anna de Vries.*
- extendedWaitUntil:
    visible:
      id: clientProfile\.name
    timeout: 20000
- assertVisible:
    id: clientProfile\.name
    text: Anna de Vries
- assertVisible:
    id: clientProfile\.email
    text: anna@example.com
- assertVisible:
    id: clientProfile\.locale
    text: ${CLIENT_LOCALE_EN}
# AC1: a name alone adds a client; the profile opens and the language for emails follows the workspace's default.
- launchApp
- extendedWaitUntil:
    visible:
      id: home\.openClients
    timeout: 20000
- evalScript: ${output.clientName = 'Eva ' + Date.now()}
- tapOn:
    id: home\.openClients
- extendedWaitUntil:
    visible:
      id: clients\.new
    timeout: 20000
- tapOn:
    id: clients\.new
- extendedWaitUntil:
    visible:
      id: clientForm\.name
    timeout: 20000
- tapOn:
    id: clientForm\.name
- inputText: ${output.clientName}
- hideKeyboard
- tapOn:
    id: clientForm\.submit
- extendedWaitUntil:
    visible:
      id: clientProfile\.added
    timeout: 20000
- assertVisible:
    id: clientProfile\.name
    text: ${output.clientName}
- assertVisible:
    id: clientProfile\.locale
    text: ${CLIENT_LOCALE_DEFAULT}
# AC12: the overview edits the same fields.
- tapOn:
    id: clientProfile\.edit
- extendedWaitUntil:
    visible:
      id: clientForm\.name
    timeout: 20000
- tapOn:
    id: clientForm\.name
- eraseText: 200
- inputText: ${output.clientName} Jansen
- hideKeyboard
- tapOn:
    id: clientForm\.submit
- extendedWaitUntil:
    visible:
      id: clientProfile\.saved
    timeout: 20000
- assertVisible:
    id: clientProfile\.name
    text: ${output.clientName} Jansen
