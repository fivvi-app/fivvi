org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# API base URL per build type (spec #34). Debug: the local web server, seen from the emulator as 10.0.2.2. Override it
# for a preview or a phone on the LAN: ./gradlew installDebug -Ptrainerhub.apiBaseUrl=https://<preview>/api/
trainerhub.apiBaseUrl=http://10.0.2.2:3000/api/
# Release: the production URL (HTTPS only). Empty until the owner sets the production domain; a release build fails
# until then.
trainerhub.releaseApiBaseUrl=
# Sentry DSN per build type (E009, OBSERVABILITY.md §1 "Android"). Empty means no crash reporting. Debug stays empty
# unless you set it for a test: ./gradlew installDebug -Ptrainerhub.sentryDsn=https://<key>@<org>.ingest.de.sentry.io/<id>
# Release: the DSN of the Sentry project `android`, set by the owner (#47).
trainerhub.sentryDsn=
trainerhub.releaseSentryDsn=
