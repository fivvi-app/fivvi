# SwiftLint for the iOS app (E008). scripts/test-ios.sh (`pnpm test:ios`, CI) runs it with --strict.
included:
  - FivviPro
  - FivviProTests
  - FivviProUITests
excluded:
  - .build
  - lint

line_length:
  warning: 120
  ignores_comments: true

custom_rules:
  # No hard-coded user-facing text (AGENTS.md, ADR-008): it comes from packages/i18n through the generated catalog.
  # Fixture: lint/fixtures/LiteralText.swift.
  no_literal_text:
    name: No literal text
    message: User-facing text comes from the string catalog (packages/i18n), not a string literal
    regex: '\b(Text|Button|Label|Toggle|TextField|SecureField|Link)\s*\(\s*(verbatim:\s*)?"|\.(navigationTitle|accessibilityLabel|accessibilityHint|accessibilityValue)\s*\(\s*"'
    excluded_match_kinds:
      - comment
      - comment.mark
      - comment.url
      - doccomment
      - doccomment.field
    severity: error
  # No hard-coded colours (ADR-015, #57): app code takes every colour from the design tokens (`Tokens.Colors`), which
  # follow light and dark mode. Rejects colour initialisers, colour literals, system colours (`Color.red`, `UIColor
  # .systemBackground`, `.background`) and their shorthand as an argument, value or result (`.foregroundStyle(.blue)`,
  # `colors: [.red]`, `on ? .red : …`, `return .red`). `Color.clear`, `.tint` and materials are allowed.
  # Tests may resolve token colours, so they're excluded. Fixture: lint/fixtures/ColourLiteral.swift.
  no_colour_literal:
    name: No colour literal
    message: Colours come from the design tokens (Tokens.Colors in FivviDesignTokens), not a literal or system colour
    excluded: '/FivviPro(UI)?Tests/'
    regex: '#colorLiteral\s*\(|\b(Color|UIColor|CGColor)\s*(\.\s*init\s*)?\(|\.init\s*\(\s*(red|hue|white|uiColor|cgColor|\.sRGB|\.sRGBLinear|\.displayP3)\b|\b(Color|UIColor)\s*\.\s*(?!clear\b)[a-z]\w*|([(\[,:?{]|(?<![=!<>])=|\breturn)\s*\.(black|blue|brown|cyan|gray|green|indigo|mint|orange|pink|purple|red|teal|white|yellow|primary|secondary|tertiary|quaternary|quinary|separator|background|foreground|selection|accentColor)\b'
    excluded_match_kinds:
      - comment
      - comment.mark
      - comment.url
      - doccomment
      - doccomment.field
      - string
    severity: error
  # No imitation of Liquid Glass (E020 AC8, ADR-029): the tab bar, navigation buttons, sheets and alerts are the system's
  # components, and a floating surface takes the system's `glassEffect`. A blur view, a material or a bar fill behind a bar, sheet or
  # control, or a bar's appearance proxy is a copy of the glass, which would not follow the system. Fixture:
  # lint/fixtures/GlassImitation.swift.
  no_glass_imitation:
    name: No glass imitation
    message: Liquid Glass comes from the system's components, glassEffect and the .glass button styles, not a copy of it
    regex: '\bUIVisualEffectView\b|\bUIBlurEffect\b|\bUI(Bar|TabBar|NavigationBar|Toolbar)(Appearance)?\b|\bUI(BarButtonItem|TabBarItem)(Appearance\b|\s*\.\s*appearance\b)|\.(ultraThin|thin|regular|thick|ultraThick)Material\b|\bMaterial\s*\.\s*(ultraThin|thin|regular|thick|ultraThick|bar)\b|\.(background|presentationBackground|fill|containerBackground|backgroundStyle)\s*\(\s*\.bar\b|\.(toolbarBackground|toolbarBackgroundVisibility)\s*\('
    excluded_match_kinds:
      - comment
      - comment.mark
      - comment.url
      - doccomment
      - doccomment.field
      - string
    severity: error
  # Only the Observability module talks to Sentry (E009, OBSERVABILITY.md §1 "iOS"), like Biome's noRestrictedImports for
  # @sentry/* in TypeScript: it starts the SDK and owns the scrubber. Its tests build Sentry events.
  # Fixture: lint/fixtures/DirectSentry.swift.
  no_direct_sentry:
    name: No direct Sentry
    message: Only FivviPro/Observability/ talks to Sentry (sentry-cocoa); report through ErrorReporting
    excluded: '/FivviPro/Observability/|/FivviProTests/(Support/)?Observability\w*\.swift$'
    regex: '\bimport\s+(@\w+\s+)*((struct|class|enum|protocol|typealias|func|let|var)\s+)?Sentry\w*\b|\bSentrySDK\b'
    excluded_match_kinds:
      - comment
      - comment.mark
      - comment.url
      - doccomment
      - doccomment.field
      - string
    severity: error
