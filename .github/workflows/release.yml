# The release lanes of E017 (docs/engineering/RELEASE.md): started by hand on main, approved by the owner in the GitHub
# environment `release`, which holds every signing key and API key. Nothing else reaches those secrets: pull-request
# workflows, forks and this workflow's own test jobs can't read them, and no job here runs on pull_request_target.
#
# Shape of a run: `prepare` (refuses anything but a first attempt on main, fixes the build number every platform of the
# run shares), then the native suites of both platforms in jobs without secrets (`ios-tests`, `android-tests`; both
# locales), then the job in the `release` environment, which waits for the owner's approval and only then signs, uploads
# and sends the crash symbols to Sentry. Every release job needs both test jobs, so when either platform's suite fails
# nothing is uploaded for any platform. A platform can be released alone (the inputs); the suites of both always run.
# Every step is a command of scripts/release*.sh (tested in scripts/test/release.test.mjs and release-android.test.mjs).
# The `ios` and `android` jobs each wait for the owner's approval of the environment and run side by side.

# A secret is passed to the one step that needs it, as an environment variable of that step, and no step prints one.

name: Release

on:
  workflow_dispatch:
    inputs:
      ios:
        description: 'Release the iOS app to TestFlight'
        type: boolean
        default: true
      android:
        description: 'Release the Android app (build the signed App Bundle, send the R8 mapping to Sentry)'
        type: boolean
        default: true
      publish-android:
        description: 'Publish the Android bundle to Play internal testing (off: only keep it as an artifact of the run, for the first upload by hand)'
        type: boolean
        default: true

# One run at a time, and a run that is running or approved is never cancelled. (GitHub keeps one pending run per group: a
# third run started while one runs and one waits replaces the waiting one.)
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  TZ: UTC

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build-number: ${{ steps.number.outputs.build-number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Refuses a ref other than main and a re-run. The environment `release` only deploys from main as well (its
      # deployment branch policy, .github/environments/release.json), which holds even for a workflow file changed on a
      # branch.
      - name: Refuse a run outside main
        run: scripts/release.sh guard

      # The run number plus a fixed offset: the same number for every platform of this run, higher than any earlier run.
      - id: number
        name: Build number
        run: |
          number="$(scripts/release.sh build-number)"
          echo "build-number=$number" >>"$GITHUB_OUTPUT"
          echo "Build number $number" >>"$GITHUB_STEP_SUMMARY"

  ios-tests:
    name: iOS tests
    needs: prepare
    # The native suite on this commit in nl and en (TESTING.md §7), as `pnpm test:ios` runs it. No secret here, and no
    # approval needed: the owner is asked to approve only a run whose tests passed. The image and Xcode are pinned, like in
    # ci.yml.
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Refuse a run outside main
        run: scripts/release.sh guard

      - name: SwiftLint, build and tests (nl and en)
        run: scripts/release.sh tests ios

      # Only on failure: artifact storage counts against the free quota.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-release-test-results
          path: |
            apps/ios/.build/TestResults-*.xcresult
            apps/ios/.build/build-for-testing.log
          retention-days: 7
          if-no-files-found: ignore

  android-tests:
    name: Android tests
    needs: prepare
    # The native suites of the platform that is not being released, as `pnpm test:android` and `pnpm test:maestro` run them
    # (TESTING.md §7.2): ktlint, build, unit tests and Compose UI tests on an emulator, then the Maestro flows in nl-NL and
    # en. Set up like the `android` job of ci.yml, which has the reasons for each step. No secret here. Every release job
    # waits for this job, so a failing Android suite uploads no build of any platform.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse a run outside main
        run: scripts/release.sh guard

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm || true
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo '::error::/dev/kvm is not usable by the runner user'
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Restore only: reuses the web build of the latest "Checks (Linux)" run on main when nothing changed.
      - name: Restore turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo/cache
            apps/web/.next/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Android SDK packages, emulator and Maestro
        run: scripts/android.sh setup

      - id: avd
        name: Emulator cache key
        run: echo "key=$(scripts/android.sh avd-key)" >> "$GITHUB_OUTPUT"

      # The key and the version are ci.yml's, so this job reads the AVD snapshot that main's runs saved.
      - name: Cache the emulator
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.android/avd
          key: avd-v2-${{ runner.os }}-${{ steps.avd.outputs.key }}

      - name: Boot the emulator
        timeout-minutes: 10
        env:
          AVD_SNAPSHOT: '1'
          EMULATOR_BOOT_TIMEOUT: '480'
        run: scripts/android.sh emulator

      - name: ktlint, build, unit tests, Compose UI tests and the Maestro flows (nl-NL and en)
        timeout-minutes: 35
        run: scripts/release.sh tests android

      # The emulator must not be running when the cache of it is saved.
      - name: Stop the emulator
        if: always()
        run: scripts/android.sh stop

      # Only on failure: artifact storage counts against the free quota.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release-test-results
          path: |
            apps/android/app/build/reports/
            apps/android/app/build/outputs/androidTest-results/
            apps/android/build/emulator.log*
            e2e/maestro/build/
          retention-days: 7
          if-no-files-found: ignore

  ios:
    name: iOS release
    needs: [prepare, ios-tests, android-tests]
    if: inputs.ios
    # Waits here for the owner's approval; nothing below runs, and no secret is readable, before it. Only the jobs of this
    # environment read secrets.
    environment: release
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      RELEASE_BUILD_NUMBER: ${{ needs.prepare.outputs.build-number }}
      # The sentry-cli that pnpm-lock.yaml pins (@sentry/cli, a dependency of @fivvi/observability).
      SENTRY_CLI: ${{ github.workspace }}/packages/observability/node_modules/.bin/sentry-cli
    steps:
      # First, before any step that reads a secret.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse a run outside main
        run: scripts/release.sh guard

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Only the package that carries the pinned sentry-cli, and its own dependencies; no secret in this step's environment.
      - name: Install the pinned sentry-cli
        run: |
          pnpm install --frozen-lockfile --filter @fivvi/observability...
          "$SENTRY_CLI" --version

      # The certificate goes into a keychain made for this run, the profile where Xcode finds it.
      - name: Install the signing certificate and profile
        env:
          IOS_DISTRIBUTION_CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: scripts/release-ios.sh signing

      - name: Archive the Release build
        run: scripts/release-ios.sh archive

      # Before the upload: a build that testers can install always has its symbols in Sentry.
      - name: Upload the dSYMs to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: scripts/release-ios.sh symbols

      - name: Export and upload to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: scripts/release-ios.sh upload

      # Whatever failed: the keychain, the profile and the key file don't outlive the run.
      - name: Delete the keychain and the key files
        if: always()
        run: scripts/release-ios.sh cleanup

  android:
    name: Android release
    needs: [prepare, ios-tests, android-tests]
    if: inputs.android
    # Waits here for the owner's approval; nothing below runs, and no secret is readable, before it. The same suites as
    # the iOS job wait for: they ran once, in the test jobs.
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_BUILD_NUMBER: ${{ needs.prepare.outputs.build-number }}
      # The sentry-cli that pnpm-lock.yaml pins (@sentry/cli, a dependency of @fivvi/observability).
      SENTRY_CLI: ${{ github.workspace }}/packages/observability/node_modules/.bin/sentry-cli
    steps:
      # First, before any step that reads a secret.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse a run outside main
        run: scripts/release.sh guard

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # Reads the Gradle cache of main and never writes one: this job holds the signing key.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      # Only the package that carries the pinned sentry-cli, and its own dependencies; no secret in this step's environment.
      - name: Install the pinned sentry-cli
        run: |
          pnpm install --frozen-lockfile --filter @fivvi/observability...
          "$SENTRY_CLI" --version

      # The keystore goes to a private file outside the repo; the last step of the job deletes it.
      - name: Install the upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: scripts/release-android.sh signing

      - name: Install the Android SDK packages
        run: scripts/release-android.sh sdk

      - name: Build the signed App Bundle
        env:
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: scripts/release-android.sh bundle

      # The signed bundle alone (its folder holds nothing else): a certificate, no secret. It is what the owner uploads by
      # hand the first time, which Google's API can't do. A public repo's artifacts are readable by anyone, so it is kept
      # for a short time.
      - name: Upload the App Bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-app-bundle
          path: ${{ runner.temp }}/fivvi-release-android/bundle/*.aab
          retention-days: 14
          if-no-files-found: error

      # Before the publish: a build that testers can install always has its mapping in Sentry. Skipped, with a line saying
      # so, while the release build is not minified.
      - name: Upload the R8 mapping to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: scripts/release-android.sh symbols

      - name: Publish to Play internal testing
        if: inputs.publish-android
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: scripts/release-android.sh publish

      # Whatever failed: the keystore doesn't outlive the run.
      - name: Delete the keystore
        if: always()
        run: scripts/release-android.sh cleanup
