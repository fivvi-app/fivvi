# CI for every pull request, every push to main and every merge group of the merge queue (E002, E010), and on demand
# (workflow_dispatch). The queue tests a PR on top of the latest main on a temporary gh-readonly-queue/main/* branch;
# the required checks must report there too, or the queue never merges (ADR-018).
#
# The job names ("Detect changes", "Checks (Linux)", "E2E (Linux)", "iOS",
# "Android") are the intended required checks; see docs/engineering/WORKFLOW.md §7. Renaming a job
# renames its check, so update WORKFLOW.md in the same PR. "iOS" and "Android" are gate jobs (#293): each needs its parts
# (a build job and the test jobs) and reports their combined result through scripts/native-gate.sh, so the required
# names stay while the parts change; a gate is skipped, and passes as skipped, when "Detect changes" says the app's
# inputs did not change. Every job runs when something it depends on changed, and only then (scripts/affected.mjs,
# scripts/native-jobs.sh; ADR-024).
#
# New static checks (i18n parity, OpenAPI drift, ...) are added as a `check`
# script in the package that owns them. Turbo picks them up; no change here.

name: CI

on:
  pull_request:
  # A push to main only fills the caches that PRs and merge groups read, and nothing in it fails the run (ADR-018,
  # amendment of 12 November 2026; E002 #1357). The merge group already passed on the same tree, and a flaky failure here
  # would turn main red and hold back the deploy of development and production (Railway's "Wait for CI"). So on a push:
  #   - the Linux jobs run as on a PR: turbo caches the tasks that passed (a failed task is left out, the others stay);
  #   - the native jobs run only as far as they write main's caches (Gradle, the AVD snapshot, DerivedData; a PR and a merge
  #     group read only main's and their own, E002 #242), when native paths changed (scripts/native-jobs.sh), without
  #     their test suites, retries, gates or Maestro;
  #   - every job has `continue-on-error: ${{ github.event_name == 'push' }}` (false on the other events), and the steps
  #     whose failure would stop the cache from being saved carry it too. Changing that is a decision for an ADR.
  #   - continue-on-error covers a job or step that FAILS. A job that hits its job timeout, or that no runner takes, ends
  #     `cancelled`, and a cancelled job makes the run `cancelled`, which Railway's "Wait for CI" treats as no go
  #     (push runs 42821661674, 42761668186, 42649049029: E2E (Linux) hit its job timeout). So the long steps of the
  #     jobs that run on a push have a step `timeout-minutes` below their job's, only on a push (360, the most GitHub
  #     allows, otherwise): a hang becomes a failed step, which continue-on-error covers. Still open: no YAML can stop a
  #     cancel when no runner takes a job (the macOS jobs, after about 15 minutes); the run is then `cancelled`. The
  #     owner checks what Railway does then (notes of #1357).
  # A PR, a merge group and workflow_dispatch run as before; the five required checks keep their names.
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]
  workflow_dispatch:

# A new push to a PR cancels the run for the previous push. A run that is in progress on main is never cancelled, nor is
# a run of a merge group, which the queue waits for. A run on main that is still pending when another push arrives is
# replaced by the newer one (GitHub keeps one running and one pending run per group): it shows as `cancelled` with no
# jobs, and is not a failure.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TZ: UTC
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    continue-on-error: ${{ github.event_name == 'push' }}
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      android: ${{ steps.filter.outputs.android }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A PR checkout is a merge commit whose first parent is the base branch.
          fetch-depth: 2
          persist-credentials: false

      - id: filter
        name: Filter paths
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          # A merge group's parent commit: main as the queue saw it. Empty on the other events.
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          RUN_NATIVE: ${{ contains(github.event.pull_request.labels.*.name, 'run-native') }}
        run: |
          set -euo pipefail

          # The commit to compare with: a PR's base branch, the push's previous head, or the base commit of the
          # merge group (every queued PR's commits sit on top of it).
          prior="$BEFORE"
          if [[ "$EVENT" == 'merge_group' ]]; then prior="$MERGE_BASE"; fi

          base=''
          if [[ "$EVENT" == 'pull_request' ]]; then
            base='HEAD^1'
          elif [[ -n "$prior" && ! "$prior" =~ ^0+$ ]]; then
            if git cat-file -e "$prior^{commit}" 2>/dev/null \
              || git fetch --no-tags --depth=1 origin "$prior"; then
              base="$prior"
            fi
          fi

          if [[ -n "$base" ]]; then
            changed="$(git diff --no-renames --name-only "$base" HEAD)"
          else
            echo 'No base commit to compare with; treating every path as changed.'
            changed="$(git ls-files)"
          fi

          # Which native jobs run (scripts/native-jobs.sh): those whose paths changed. That holds on a push to main,
          # which writes the caches every PR reads, and in a merge group, whose caches only its own queue branch reads.
          # workflow_dispatch and the PR's run-native label (read on its pushes) force them.
          args=(--event "$EVENT")
          if [[ "$RUN_NATIVE" == 'true' ]]; then args+=(--run-native); fi
          scripts/native-jobs.sh "${args[@]}" <<<"$changed" >>"$GITHUB_OUTPUT"

          # Whether the Linux E2E job runs (scripts/affected.mjs, the decision scripts/check.sh makes too): only when the
          # web app or a package it depends on changed, or on demand. Why it skips is in the log and the job summary.
          affected_args=()
          if [[ "$EVENT" == 'workflow_dispatch' || "$RUN_NATIVE" == 'true' ]]; then affected_args+=(--force); fi
          reasons="$(mktemp)"
          node scripts/affected.mjs ${affected_args[@]+"${affected_args[@]}"} <<<"$changed" 2>"$reasons" | grep '^e2e=' >>"$GITHUB_OUTPUT"
          cat "$reasons"
          { echo '### What this change affects'; sed 's/^/- /' "$reasons"; } >>"${GITHUB_STEP_SUMMARY:-/dev/null}"

  checks:
    name: Checks (Linux)
    runs-on: ubuntu-24.04
    continue-on-error: ${{ github.event_name == 'push' }}
    timeout-minutes: 15
    # Integration tests run against real Postgres, the same major version as
    # compose.yaml and Railway (TESTING.md §5.3). Tests create their own databases.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: fivvi
          POSTGRES_PASSWORD: fake-local-db-password
          POSTGRES_DB: fivvi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fivvi -d fivvi"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://fivvi:fake-local-db-password@localhost:5432/fivvi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the version from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # `pnpm lint:root` runs shellcheck, and its findings differ per version: the runner's preinstalled one flagged
      # what the local one didn't. The version and checksums are pinned in scripts/_shellcheck.sh, the same file
      # scripts/bootstrap.sh uses; the cache key follows that file, so a bump downloads the new release.
      - name: Restore shellcheck
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: shellcheck-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/_shellcheck.sh') }}

      - name: Install the pinned shellcheck
        timeout-minutes: ${{ github.event_name == 'push' && 3 || 360 }}
        run: |
          source scripts/_lib.sh
          source scripts/_shellcheck.sh
          install_shellcheck
          echo "$SHELLCHECK_HOME" >>"$GITHUB_PATH"
          export PATH="$SHELLCHECK_HOME:$PATH"
          shellcheck --version
          [[ "$(shellcheck_version)" == "$SHELLCHECK_VERSION" ]] || { echo "shellcheck is not $SHELLCHECK_VERSION"; exit 1; }

      - name: Install dependencies
        timeout-minutes: ${{ github.event_name == 'push' && 5 || 360 }}
        run: pnpm install --frozen-lockfile

      # Turbo's local cache, plus Next.js's own build cache for turbo misses.
      # Main's cache is readable by every PR; a PR's cache only by that PR.
      - name: Restore turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo/cache
            apps/web/.next/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # The contract drift check (packages/contract) builds swift-openapi-generator and downloads
      # the openapi-generator jar when turbo has no cached result for it. The pipeline keeps both
      # in node_modules/.cache/contract and reuses them when their names match: the binary per
      # `swift --version` + Package.swift + Package.resolved, the jar per pinned version. Exact key
      # only, so a generator bump starts from an empty directory and old tools don't pile up.
      - name: Read Swift version
        id: swift
        run: echo "version=$(swift --version | sed -nE 's/.*Swift version ([0-9.]+).*/\1/p')" >>"$GITHUB_OUTPUT"

      - name: Restore the contract generators
        id: contract-generators
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/contract/node_modules/.cache/contract
          key: contract-generators-${{ runner.os }}-swift${{ steps.swift.outputs.version }}-${{ hashFiles('packages/contract/tools/swift-generator/Package.swift', 'packages/contract/tools/swift-generator/Package.resolved', 'packages/contract/config/openapi-generator.json') }}

      # One turbo run so independent tasks run in parallel. A failing task
      # doesn't stop the unrelated ones, so one run reports every failure.
      - name: Lint, typecheck, unit and integration tests, build, format and static checks
        # On a push only (E002 #1357): a hang fails this step, which continue-on-error covers, instead of the job timeout
        # cancelling the job and the run. The slowest of 34 push runs of main took 620 s here (3 took 10 minutes or more),
        # and the job spends about 1 minute outside this step: 13 + 1 leaves 1 of the job's 15 minutes for the cache save.
        timeout-minutes: ${{ github.event_name == 'push' && 13 || 360 }}
        continue-on-error: ${{ github.event_name == 'push' }}
        run: >-
          pnpm exec turbo run lint typecheck test test:integration build format:check check
          --cache-dir=.turbo/cache
          --continue=dependencies-successful

      # Saved even when another task fails, so a freshly built generator isn't lost; only on a
      # miss, and only once the check has produced both tools (not when turbo reused its result).
      - name: Save the contract generators
        if: >-
          always()
          && steps.contract-generators.outputs.cache-hit != 'true'
          && hashFiles('packages/contract/node_modules/.cache/contract/swift-openapi-generator-*', '!**/*.partial') != ''
          && hashFiles('packages/contract/node_modules/.cache/contract/openapi-generator-cli-*.jar') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/contract/node_modules/.cache/contract
          key: ${{ steps.contract-generators.outputs.cache-primary-key }}

  e2e:
    name: E2E (Linux)
    needs: changes
    # Only when the web app or a package it depends on is affected (scripts/affected.mjs); otherwise this required check
    # passes as skipped, and "Detect changes" says why.
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    continue-on-error: ${{ github.event_name == 'push' }}
    # 15 minutes for the work itself (the last runs took 10 to 14) plus the 10 minutes the OS packages step may spend
    # on its retries (#1311), so the job is never cancelled in the middle of one. On a push (E002 #1357) the work step may
    # take 20 minutes (below), so the job gets 35: about 1 minute outside the steps, the worst case of the OS packages step
    # (10) and the work step (20) make 31, and 4 minutes remain for the post steps (the Playwright report, the caches). A
    # push is not in the merge queue's chain of timeouts (150, ADR-018), so this lengthens no queue wait; a pull request,
    # a merge group and workflow_dispatch keep 25.
    timeout-minutes: ${{ github.event_name == 'push' && 35 || 25 }}
    # The e2e servers each create and migrate their own database on it (apps/web/e2e/serve.ts).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: fivvi
          POSTGRES_PASSWORD: fake-local-db-password
          POSTGRES_DB: fivvi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fivvi -d fivvi"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://fivvi:fake-local-db-password@localhost:5432/fivvi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        timeout-minutes: ${{ github.event_name == 'push' && 5 || 360 }}
        run: pnpm install --frozen-lockfile

      # Reuses the build from the latest "Checks (Linux)" cache when nothing changed.
      # Restore only: that job saves the cache.
      - name: Restore turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo/cache
            apps/web/.next/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @fivvi/web exec playwright --version | awk '{print $2}')" >>"$GITHUB_OUTPUT"

      # Browsers are cached per Playwright version; the OS packages they need are not
      # cacheable, so they are installed on every run.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        timeout-minutes: ${{ github.event_name == 'push' && 5 || 360 }}
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @fivvi/web exec playwright install --only-shell chromium

      # apt cannot always resolve the Ubuntu mirror from the runner (#1311), which failed the job before any test ran;
      # the script tries the install again.
      - name: Install Chromium's OS packages
        # Worst case: 4 tries of about 1.5 minutes, plus 90 seconds of waiting between them.
        timeout-minutes: 10
        run: scripts/playwright-deps.sh

      # Builds the web app, then runs every spec in nl-NL and en with axe checks.
      - name: Web e2e (nl-NL and en)
        id: e2e
        # On a push only (E002 #1357), as the turbo step of "Checks (Linux)". The slowest of 32 push runs of main took 754 s
        # here (7 took 12 minutes or more); 20 minutes is 1.6 times that, and fits the job's 35 with the OS packages step.
        timeout-minutes: ${{ github.event_name == 'push' && 20 || 360 }}
        continue-on-error: ${{ github.event_name == 'push' }}
        run: pnpm exec turbo run test:e2e --cache-dir=.turbo/cache

      # Only on failure: artifact storage counts against the free quota.
      - name: Upload Playwright report
        # On a push the test step has continue-on-error, which makes failure() false: read the step's own outcome.
        if: failure() || steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore


  # iOS (E008, E002, #293). Three parts and the gate "iOS": one job builds once and packs the test bundle, two jobs run
  # the Dutch and the English test pass from it at the same time, each on its own simulator (a cold run was 16 of 21
  # minutes of tests in a row). They start only when the app, its generated inputs or its own scripts changed (in a PR, a
  # merge group or a push to main), or on demand (scripts/native-jobs.sh), to keep PR feedback fast. The UI tests run in
  # both languages on every push. The image and Xcode are pinned, so a runner update doesn't change the toolchain.
  #
  # The image (E002 #242): macos-15, not macos-26, whose runners queued about 10 minutes in two runs. The app needs
  # no Xcode 26: Swift 6.0 mode, swift-tools-version 6.0 packages, project format 77 and iOS 17 as the deployment
  # target all build with Xcode 16. macos-15 has Xcode 16.0 to 16.4 and 26.0.1 to 26.3 (not 26.5 or 26.6, which only
  # macos-26 has), so this takes 26.3, the newest, to stay on the Xcode 26 line of local runs (iOS 26.2 simulator
  # instead of 26.5). If the job fails here but not on macos-26, or its queue isn't shorter, go back to macos-26 and
  # Xcode_26.6.
  ios-build:
    name: iOS build
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    continue-on-error: ${{ github.event_name == 'push' }}
    # The longest build of the last 10 green runs took 322 s (5.4 min), so 12 minutes is 2.2 times that (#393).
    # Detect changes (5) + this (12) + iOS tests (38) + the report job (2) = 57, under the merge queue's check
    # timeout (ADR-018). If no runner takes this job, GitHub cancels it after 15 minutes and ios-build-retry builds once
    # more (see there for the longest chain, 142, and the queue's 150).
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read # scripts/step-timings.sh reads this run's step durations
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: xcode
        name: Xcode version
        run: echo "version=$(xcodebuild -version | tr -s ' \n' '--' | sed 's/-$//')" >> "$GITHUB_OUTPUT"

      # DerivedData, with the compiled Swift packages (sentry-cocoa takes minutes to build), and the packages
      # themselves. Keyed by Package.resolved, the Xcode version, the runner OS and the run: every run saves what it
      # built (an exact hit is never saved again, so a key without the run would freeze the cache at the first
      # build) and restores the newest one through the restore keys, the same Package.resolved first. The package
      # graph is in the key too (the manifests of all local packages, in apps/ios/Packages and in packages/, and the
      # project file): a cache built for another graph
      # (Sentry a direct dependency of the app, not of FivviShared) made Xcode refuse its precompiled Sentry module in
      # the first run of the shared packages (#500), and a failed run saves nothing. Within one graph a stale cache
      # only costs build time and never changes a result. A PR can read its own caches and main's; main's are
      # written by the pushes that change native paths, so a PR's first run is warm once main has run it. The
      # manifest of the sources' modification times (scripts/ios-mtimes.mjs) is part of it. The index store is left
      # out: nothing in a build reads it, and it is a large part of the payload. GitHub keeps a repository's caches
      # to 10 GB, evicts the least recently used first, and removes any not read for 7 days.
      - name: Cache the iOS build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/ios/.build/DerivedData
            apps/ios/.build/SourcePackages
            apps/ios/.build/source-mtimes.json
            !apps/ios/.build/DerivedData/Logs
            !apps/ios/.build/DerivedData/Index.noindex
          key: ios-build-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('apps/ios/Packages/**/Package.swift', 'packages/contract/swift/Package.swift', 'packages/design-tokens/FivviDesignTokens/Package.swift', 'packages/i18n/generated/ios/Package.swift', 'apps/ios/FivviPro.xcodeproj/project.pbxproj') }}-${{ hashFiles('apps/ios/FivviPro.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ios-build-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('apps/ios/Packages/**/Package.swift', 'packages/contract/swift/Package.swift', 'packages/design-tokens/FivviDesignTokens/Package.swift', 'packages/i18n/generated/ios/Package.swift', 'apps/ios/FivviPro.xcodeproj/project.pbxproj') }}-${{ hashFiles('apps/ios/FivviPro.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
            ios-build-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('apps/ios/Packages/**/Package.swift', 'packages/contract/swift/Package.swift', 'packages/design-tokens/FivviDesignTokens/Package.swift', 'packages/i18n/generated/ios/Package.swift', 'apps/ios/FivviPro.xcodeproj/project.pbxproj') }}-

      # Xcode decides what to compile by the modification time of the inputs, and a checkout gives every file the
      # time of the checkout: the restored DerivedData above was thrown away by a build that found every source "changed"
      # (about 90 s of Swift and 50 s of asset catalog every run). The files whose content is the cached build's get
      # their old time back; the ones that changed keep the new time and are compiled (#293 AC15).
      - name: Restore the sources' modification times
        run: node scripts/ios-mtimes.mjs restore

      # The same steps as `pnpm test:ios` up to the build (apps/ios/README.md#tests): SwiftLint, the checks, one
      # build-for-testing; then it packs the test bundle. Prints the build timing summary.
      - name: SwiftLint, checks and build for testing
        timeout-minutes: ${{ github.event_name == 'push' && 10 || 360 }}
        run: scripts/test-ios.sh build

      - name: Record the sources' modification times
        run: node scripts/ios-mtimes.mjs save

      # What the two test jobs run: the .xctestrun and the build products, packed in a tar to keep the file modes.
      - name: Upload the test bundle
        if: github.event_name != 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-bundle
          path: apps/ios/.build/ios-test-bundle.tar
          # .build is a hidden folder, which the action skips by default (#290).
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

      # Only on failure: artifact storage counts against the free quota.
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-build-log
          path: apps/ios/.build/build-for-testing.log
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

      - name: Step durations
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/step-timings.sh

  # The retries (#1268): when no hosted macOS runner takes a job within 15 minutes, GitHub cancels it with no step run
  # and `needs.<job>.result` is `abandoned`. This builds once more, with the same steps (a test compares them), and the
  # tests start from whichever build succeeded; a run that somebody cancelled is not retried. A test pass that got no
  # runner is retried too (ios-tests-plan, ios-tests-retry below), and only that language, from the bundle that already
  # exists. Every retry may itself queue for a runner for 15 minutes, and ios-tests-plan waits for the whole ios-tests
  # matrix, so the other language may run its full 38 minutes before the plan starts. The longest chain by the timeouts
  # is therefore Detect changes 5 + (15 wait + 15 wait + 12 build) + (38 tests + 2 plan + 15 wait + 38 tests) + the gate
  # 2 = 142 minutes, so the merge queue's check timeout is 150 (ADR-018), applied with
  # `scripts/github-settings.sh apply`, and `pr.sh wait` gives a native run 155.
  ios-build-retry:
    name: iOS build (retry)
    needs: [changes, ios-build]
    if: ${{ !cancelled() && github.event_name != 'push' && needs.changes.outputs.ios == 'true' && needs.ios-build.result == 'abandoned' }}
    runs-on: macos-15
    continue-on-error: ${{ github.event_name == 'push' }}
    # As "iOS build".
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read # scripts/step-timings.sh reads this run's step durations
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: xcode
        name: Xcode version
        run: echo "version=$(xcodebuild -version | tr -s ' \n' '--' | sed 's/-$//')" >> "$GITHUB_OUTPUT"

      # DerivedData, with the compiled Swift packages (sentry-cocoa takes minutes to build), and the packages
      # themselves. Keyed by Package.resolved, the Xcode version, the runner OS and the run: every run saves what it
      # built (an exact hit is never saved again, so a key without the run would freeze the cache at the first
      # build) and restores the newest one through the restore keys, the same Package.resolved first. The package
      # graph is in the key too (the manifests of all local packages, in apps/ios/Packages and in packages/, and the
      # project file): a cache built for another graph
      # (Sentry a direct dependency of the app, not of FivviShared) made Xcode refuse its precompiled Sentry module in
      # the first run of the shared packages (#500), and a failed run saves nothing. Within one graph a stale cache
      # only costs build time and never changes a result. A PR can read its own caches and main's; main's are
      # written by the pushes that change native paths, so a PR's first run is warm once main has run it. The
      # manifest of the sources' modification times (scripts/ios-mtimes.mjs) is part of it. The index store is left
      # out: nothing in a build reads it, and it is a large part of the payload. GitHub keeps a repository's caches
      # to 10 GB, evicts the least recently used first, and removes any not read for 7 days.
      - name: Cache the iOS build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/ios/.build/DerivedData
            apps/ios/.build/SourcePackages
            apps/ios/.build/source-mtimes.json
            !apps/ios/.build/DerivedData/Logs
            !apps/ios/.build/DerivedData/Index.noindex
          key: ios-build-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('apps/ios/Packages/**/Package.swift', 'packages/contract/swift/Package.swift', 'packages/design-tokens/FivviDesignTokens/Package.swift', 'packages/i18n/generated/ios/Package.swift', 'apps/ios/FivviPro.xcodeproj/project.pbxproj') }}-${{ hashFiles('apps/ios/FivviPro.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ios-build-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('apps/ios/Packages/**/Package.swift', 'packages/contract/swift/Package.swift', 'packages/design-tokens/FivviDesignTokens/Package.swift', 'packages/i18n/generated/ios/Package.swift', 'apps/ios/FivviPro.xcodeproj/project.pbxproj') }}-${{ hashFiles('apps/ios/FivviPro.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
            ios-build-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('apps/ios/Packages/**/Package.swift', 'packages/contract/swift/Package.swift', 'packages/design-tokens/FivviDesignTokens/Package.swift', 'packages/i18n/generated/ios/Package.swift', 'apps/ios/FivviPro.xcodeproj/project.pbxproj') }}-

      # Xcode decides what to compile by the modification time of the inputs, and a checkout gives every file the
      # time of the checkout: the restored DerivedData above was thrown away by a build that found every source "changed"
      # (about 90 s of Swift and 50 s of asset catalog every run). The files whose content is the cached build's get
      # their old time back; the ones that changed keep the new time and are compiled (#293 AC15).
      - name: Restore the sources' modification times
        run: node scripts/ios-mtimes.mjs restore

      # The same steps as `pnpm test:ios` up to the build (apps/ios/README.md#tests): SwiftLint, the checks, one
      # build-for-testing; then it packs the test bundle. Prints the build timing summary.
      - name: SwiftLint, checks and build for testing
        timeout-minutes: ${{ github.event_name == 'push' && 10 || 360 }}
        run: scripts/test-ios.sh build

      - name: Record the sources' modification times
        run: node scripts/ios-mtimes.mjs save

      # What the two test jobs run: the .xctestrun and the build products, packed in a tar to keep the file modes.
      - name: Upload the test bundle
        if: github.event_name != 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-bundle
          path: apps/ios/.build/ios-test-bundle.tar
          # .build is a hidden folder, which the action skips by default (#290).
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

      # Only on failure: artifact storage counts against the free quota.
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-build-log
          path: apps/ios/.build/build-for-testing.log
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

      - name: Step durations
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/step-timings.sh

  ios-tests:
    name: iOS tests (${{ matrix.locale }})
    needs: [ios-build, ios-build-retry]
    # Start from whichever build succeeded (the retry runs only when the first was abandoned); !cancelled() because a
    # skipped retry would skip this job.
    if: ${{ !cancelled() && github.event_name != 'push' && (needs.ios-build.result == 'success' || needs.ios-build-retry.result == 'success') }}
    runs-on: macos-15
    continue-on-error: ${{ github.event_name == 'push' }}
    # A healthy run takes 14-21 min (#393), of which the simulator boot and settle is up to 4 min (xcodebuild 11-17). A test that hangs fails
    # after its own allowance (scripts/test-ios.sh), so this is the backstop for the whole job: the deadline there
    # (1790 s, counted from the start of xcodebuild) + its grace (60 s) + what the job spends outside the deadline (at
    # most 245 s boot and settle, 33 s other steps, 15 s uploading the results, 17 s reports and cleanup after the
    # grace: 310 s measured) + 2 min = 2280 s, so 38 min. Detect changes (5) + iOS build (12) + this (38) + the report job (2) = 57, under the merge queue's
    # check timeout (ADR-018). Raising the deadline further means raising this, and a test fails when the
    # numbers no longer fit.
    timeout-minutes: 38
    permissions:
      contents: read
      actions: read # scripts/step-timings.sh reads this run's step durations
    strategy:
      # Both languages always run: a failing one doesn't hide the other's result.
      fail-fast: false
      matrix:
        locale: [nl, en]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the test bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-test-bundle
          path: apps/ios/.build

      # The unit and UI tests of this language, from the bundle of "iOS build", without building again, on this job's own
      # simulator. Prints the slowest tests.
      - name: Unit and UI tests (${{ matrix.locale }})
        run: scripts/test-ios.sh test ${{ matrix.locale }}

      # Only on failure, or when the timeout cancels the job (#305) in a run that nothing supersedes (a pull request
      # run is cancelled by the next push): artifact storage counts against the free quota.
      - name: Upload test results
        if: failure() || (cancelled() && github.event_name != 'pull_request')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-results-${{ matrix.locale }}
          path: apps/ios/.build/TestResults-*.xcresult
          # .build is a hidden folder, which the action skips by default (#290). Only these paths are named.
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

      - name: Step durations
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/step-timings.sh

  # Which languages of the tests got no runner (#1268): reads the run's jobs once "iOS tests" ended, for the matrix of
  # ios-tests-retry. Cheap and on Linux; it names a language only when its job was cancelled with no runner and no step.
  ios-tests-plan:
    name: iOS tests (retry plan)
    needs: ios-tests
    # !cancelled(): a run that somebody cancelled is not retried.
    if: ${{ !cancelled() && github.event_name != 'push' && needs.ios-tests.result != 'success' && needs.ios-tests.result != 'skipped' }}
    runs-on: ubuntu-24.04
    continue-on-error: ${{ github.event_name == 'push' }}
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read # scripts/ios-parts.sh reads this run's jobs
    outputs:
      locales: ${{ steps.plan.outputs.locales }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: plan
        name: Languages that got no runner
        env:
          GH_TOKEN: ${{ github.token }}
          TESTS: ${{ needs.ios-tests.result }}
        run: echo "locales=$(scripts/ios-parts.sh retry-locales "$TESTS")" >>"$GITHUB_OUTPUT"

  # The retry of a test pass that no runner took (#1268): the same steps as ios-tests (a test compares them), for the
  # languages the plan named, from the bundle "iOS build" (or its retry) uploaded. The gate takes those languages' parts
  # from here.
  ios-tests-retry:
    name: iOS tests (${{ matrix.locale }}) (retry)
    needs: ios-tests-plan
    if: ${{ !cancelled() && github.event_name != 'push' && needs.ios-tests-plan.outputs.locales != '' && needs.ios-tests-plan.outputs.locales != '[]' }}
    runs-on: macos-15
    continue-on-error: ${{ github.event_name == 'push' }}
    # As "iOS tests".
    timeout-minutes: 38
    permissions:
      contents: read
      actions: read # scripts/step-timings.sh reads this run's step durations
    strategy:
      fail-fast: false
      matrix:
        # The fallback only keeps the expression valid when the plan was skipped (no outputs); the `if` above then skips this job.
        locale: ${{ fromJSON(needs.ios-tests-plan.outputs.locales || '["nl"]') }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the test bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-test-bundle
          path: apps/ios/.build

      # The unit and UI tests of this language, from the bundle of "iOS build", without building again, on this job's own
      # simulator. Prints the slowest tests.
      - name: Unit and UI tests (${{ matrix.locale }})
        run: scripts/test-ios.sh test ${{ matrix.locale }}

      # Only on failure, or when the timeout cancels the job (#305) in a run that nothing supersedes (a pull request
      # run is cancelled by the next push): artifact storage counts against the free quota.
      - name: Upload test results
        if: failure() || (cancelled() && github.event_name != 'pull_request')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-results-${{ matrix.locale }}
          path: apps/ios/.build/TestResults-*.xcresult
          # .build is a hidden folder, which the action skips by default (#290). Only these paths are named.
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

      - name: Step durations
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/step-timings.sh

  # The required check "iOS": the combined result of the build and both test passes (AC17); skipped, and so passing,
  # when the native decision says the app's inputs didn't change.
  #
  # No runner (#413): GitHub's hosted macOS arm64 runners run short of capacity at times, and then a job is cancelled
  # after about 15 minutes with no runner and no step, although no test ran, and `needs.<job>.result` is `abandoned`
  # (#1268). A build that gets none is built once more by ios-build-retry, a test pass that gets none is run once more
  # by ios-tests-retry, on the same image; a retry that gets none either, or fails, still fails this check, and so
  # removes the PR from the merge queue. A retry on macos-15-intel was tried and dropped, because its tests ran past the
  # 1080 s deadline of #305. The error says which part had no runner (or was cancelled before one picked it up) and
  # that, if nobody cancelled the run, re-queuing the PR is enough, which part failed on a runner (a build or test
  # failure), and when the part is a retry, that it was the retry. scripts/ios-parts.sh reads the run's jobs to tell
  # them apart; the step adds a few seconds to the 2 minutes of this job.
  ios:
    name: iOS
    needs: [changes, ios-build, ios-build-retry, ios-tests, ios-tests-plan, ios-tests-retry]
    if: always() && needs.changes.outputs.ios == 'true' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    continue-on-error: ${{ github.event_name == 'push' }}
    # Only reads the results of the jobs it needs; short, so the chain of a native check stays under the queue timeout.
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read # scripts/ios-parts.sh reads this run's jobs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tells a part that no hosted runner picked up (#413) from one that failed on a runner, for the message. A read that
      # fails leaves the bare results as the jobs gave them: the gate then fails the same, with its summary line only
      # and no claim about a runner.
      - name: Combined result of the iOS jobs
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ needs.ios-build.result }}
          RETRY: ${{ needs.ios-build-retry.result }}
          TESTS: ${{ needs.ios-tests.result }}
        run: |
          mapfile -t PARTS < <(scripts/ios-parts.sh "$BUILD" "$TESTS" "$RETRY")
          scripts/native-gate.sh iOS true "${PARTS[@]}"

  # Android (E008, #293). The same commands as locally (TESTING.md §7.2), in three jobs and the gate "Android": "Android
  # build" (ktlint and the other checks, the debug build, and the debug app for Maestro, uploaded), "Android tests" (unit
  # tests and the Compose UI tests on an emulator; builds what it tests itself, so it runs next to the build job) and
  # "Android Maestro" (the flows in nl-NL and en on an emulator, from the uploaded app). The emulator needs KVM.
  android-build:
    name: Android build
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    continue-on-error: ${{ github.event_name == 'push' }}
    # Measured 0.8 to 4.6 minutes in the last 46 runs (the slowest: run 41674310293): 12 is
    # 2.6 x that and keeps the Android chain under the merge queue's check timeout (150, ADR-018; #519).
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read # scripts/step-timings.sh reads this run's step durations
    env:
      # The debug app for Maestro has the address of the web server of the Maestro job baked in: the same port in both.
      E2E_PORT: '3100'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # Caches Gradle's dependencies and wrapper; main's cache is readable by every PR.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Android SDK build tools
        timeout-minutes: ${{ github.event_name == 'push' && 5 || 360 }}
        run: scripts/android.sh setup --build-only

      - name: ktlint, checks and debug build
        timeout-minutes: 10
        run: scripts/android.sh build

      - name: Debug app for Maestro
        if: github.event_name != 'push'
        run: scripts/android.sh maestro-apk

      - name: Upload the debug app
        if: github.event_name != 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-maestro-apk
          path: apps/android/build/maestro/app-debug.apk
          retention-days: 1
          if-no-files-found: error

      - name: Upload Android reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-build-reports
          path: |
            apps/android/app/build/reports/
            apps/android/core/build/reports/
            apps/android/client/build/reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Step durations
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/step-timings.sh

  android-tests:
    name: Android tests
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    continue-on-error: ${{ github.event_name == 'push' }}
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read # scripts/step-timings.sh reads this run's step durations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The emulator creates a 6 GB data partition on its first boot and needs 7.4 GB free for it; Gradle
      # needs more. These preinstalled toolchains aren't used by this job.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # Caches Gradle's dependencies and wrapper; main's cache is readable by every PR.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm || true
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo '::error::/dev/kvm is not usable by the runner user'
            exit 1
          fi

      - name: Android SDK packages and emulator
        timeout-minutes: ${{ github.event_name == 'push' && 15 || 360 }}
        run: scripts/android.sh setup

      - id: avd
        name: Emulator cache key
        run: echo "key=$(scripts/android.sh avd-key)" >> "$GITHUB_OUTPUT"

      # The AVD with the snapshot of its booted state. Keyed by the system image, the emulator and the AVD settings
      # (a snapshot only loads on the same ones). Saved when the job passes on a miss, after the emulator has stopped.
      # A missing or broken snapshot is not an error: the boot below falls back to a cold boot. Bump the version (now v2) to drop every
      # cached AVD, and do it when a snapshot that no longer loads was replaced by a cold boot: the cache action never
      # overwrites an existing key, so the replacement isn't saved and every run would fall back to a cold boot. The
      # caches of a PR are its own and main's (written by pushes to main that change native paths).
      - name: Cache the emulator
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.android/avd
          key: avd-v2-${{ runner.os }}-${{ steps.avd.outputs.key }}

      # Booted once; verify reuses it. From the snapshot when it is cached, else cold: then the
      # script saves one. It gives up after EMULATOR_BOOT_TIMEOUT (a cold boot can take minutes) and prints the
      # emulator log; the step timeout is a backstop.
      - name: Boot the emulator
        timeout-minutes: 10
        env:
          AVD_SNAPSHOT: '1'
          EMULATOR_BOOT_TIMEOUT: '480'
        run: scripts/android.sh emulator

      - name: Unit tests, release bundle and Compose UI tests
        if: github.event_name != 'push'
        timeout-minutes: 25
        run: scripts/android.sh verify

      # The cache of the emulator is saved after this step: the emulator must not be running, or it would be copied in
      # mid-write.
      - name: Stop the emulator
        if: always()
        run: scripts/android.sh stop

      # Always, also after a cancel or timeout: without the emulator log a hung boot can't be diagnosed. Kept 7 days,
      # as artifact storage counts against the free quota.
      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-test-reports
          path: |
            apps/android/app/build/reports/
            apps/android/core/build/reports/
            apps/android/client/build/reports/
            apps/android/app/build/outputs/androidTest-results/
            apps/android/build/emulator.log*
          retention-days: 7
          if-no-files-found: ignore

      - name: Step durations
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/step-timings.sh

  android-maestro:
    name: Android Maestro
    needs: [changes, android-build]
    if: needs.changes.outputs.android == 'true' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    continue-on-error: ${{ github.event_name == 'push' }}
    # The setup before the Maestro step (3 minutes measured, the emulator boot is capped at 10), the step (30) and the
    # steps after it; still bounds a hung run (#519).
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read # scripts/step-timings.sh reads this run's step durations
    env:
      # The port the debug app of "Android build" has baked in (scripts/android.sh maestro-apk).
      E2E_PORT: '3100'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The emulator creates a 6 GB data partition on its first boot and needs 7.4 GB free for it; Postgres and the web
      # build need more. These preinstalled toolchains aren't used by this job.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Maestro needs a JDK.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm || true
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo '::error::/dev/kvm is not usable by the runner user'
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Reuses the web build from the latest "Checks (Linux)" cache when nothing changed. Restore only.
      - name: Restore turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo/cache
            apps/web/.next/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Android SDK packages, emulator and Maestro
        run: scripts/android.sh setup

      - id: avd
        name: Emulator cache key
        run: echo "key=$(scripts/android.sh avd-key)" >> "$GITHUB_OUTPUT"

      # The AVD with the snapshot of its booted state (see "Android tests"): the same key, so a cache saved by one job is
      # read by the other.
      - name: Cache the emulator
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.android/avd
          key: avd-v2-${{ runner.os }}-${{ steps.avd.outputs.key }}

      - name: Boot the emulator
        timeout-minutes: 10
        env:
          AVD_SNAPSHOT: '1'
          EMULATOR_BOOT_TIMEOUT: '480'
        run: scripts/android.sh emulator

      - name: Download the debug app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-maestro-apk
          path: apps/android/build/maestro

      # Postgres (migrated and seeded), the fake Lettermint server and the web server, then every flow in nl-NL and en, with the
      # app of "Android build" (nothing is built here).
      # Both locales run one after the other: run 41938461253 (10 flows) took 19 min 47 s on a slow runner, 14 to 18
      # minutes on main. The 30 minutes are 1.5 x the slowest run (#519); the "Step durations" step shows how close a run
      # came and warns above 20 minutes (two thirds of the budget).
      - name: Maestro flows (sign-in, anonymous and hello; nl-NL and en)
        timeout-minutes: 30
        run: scripts/maestro.sh android --apk

      # The cache of the emulator is saved after this step: the emulator must not be running, or it would be copied in
      # mid-write.
      - name: Stop the emulator
        if: always()
        run: scripts/android.sh stop

      - name: Upload Maestro reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-maestro-reports
          path: |
            apps/android/build/emulator.log*
            e2e/maestro/build/
          retention-days: 7
          if-no-files-found: ignore

      - name: Step durations
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/step-timings.sh "Maestro flows (sign-in, anonymous and hello; nl-NL and en)=30"

  # The required check "Android": the combined result of the build, the tests and Maestro (AC17); skipped, and so passing,
  # when the native decision says the app's inputs didn't change.
  android:
    name: Android
    needs: [changes, android-build, android-tests, android-maestro]
    if: always() && needs.changes.outputs.android == 'true' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    continue-on-error: ${{ github.event_name == 'push' }}
    # Only reads the results of the jobs it needs; short, so the chain of a native check stays under the queue timeout.
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Combined result of the Android jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: scripts/native-gate.sh Android true $RESULTS

  # Quarantine, the Android part (E002 #1363, ADR-025 amendment of 12 November 2026, TESTING.md §8). A flaky test on
  # quarantine/compose.txt (the Android unit tests and the Compose UI tests) or quarantine/maestro.txt (a Maestro flow) is left
  # out of "Android tests" and "Android Maestro" (android.sh and maestro.sh read the lists), and this job, which
  # is NOT a required check and must never become one, runs exactly the listed tests, so their results stay visible and the
  # fix can show it works here. It passes when the lists are empty, and then does nothing but read them: no SDK, no emulator, no
  # web build. A failing listed test fails this job and no other. Like the other native test suites it does not run on a push to
  # main. FIVVI_QUARANTINE=only selects the listed tests; the web part of the Quarantine job is the job `quarantine` (above).
  quarantine-android:
    name: Quarantine (Android)
    # No native test suite runs on a push to main ("Android tests", "Android Maestro"): the lists are read on the other events.
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    continue-on-error: ${{ github.event_name == 'push' }}
    # The work only: setup 10 + the Compose tests 25 + the Maestro flows 30, with about 5 minutes outside the steps. Nothing
    # waits for this job, so no chain of timeouts (ADR-018) includes it.
    timeout-minutes: 90
    env:
      FIVVI_QUARANTINE: only
      # The port the debug app for Maestro has baked in (scripts/android.sh maestro-apk).
      E2E_PORT: '3100'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Runs before any install, on the Node the runner has (scripts/quarantine-android.mjs imports nothing else).
      - id: lists
        name: Read the quarantine lists
        run: |
          set -euo pipefail
          compose="$(node scripts/quarantine-android.mjs count compose)"
          maestro="$(node scripts/quarantine-android.mjs count maestro)"
          {
            echo "compose=$compose"
            echo "maestro=$maestro"
            if [[ "$compose" != '0' || "$maestro" != '0' ]]; then echo 'any=true'; else echo 'any=false'; fi
          } >>"$GITHUB_OUTPUT"
          {
            echo '### Quarantine (Android)'
            echo "- Compose: $compose listed test(s)"
            echo "- Maestro: $maestro listed flow(s)"
            if [[ "$compose" == '0' && "$maestro" == '0' ]]; then echo 'Nothing is quarantined: nothing to run.'; fi
          } >>"${GITHUB_STEP_SUMMARY:-/dev/null}"

      # The emulator creates a 6 GB data partition on its first boot and needs 7.4 GB free for it; Gradle and the web build
      # need more. These preinstalled toolchains aren't used by this job.
      - name: Free disk space
        if: steps.lists.outputs.any == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.lists.outputs.maestro != '0'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.lists.outputs.maestro != '0'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Gradle builds the app, and Maestro needs a JDK.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.lists.outputs.any == 'true'
        with:
          distribution: temurin
          java-version: '21'

      # Caches Gradle's dependencies and wrapper; main's cache is readable by every PR.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: steps.lists.outputs.any == 'true'

      - name: Enable KVM
        if: steps.lists.outputs.any == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm || true
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo '::error::/dev/kvm is not usable by the runner user'
            exit 1
          fi

      - name: Install dependencies
        if: steps.lists.outputs.maestro != '0'
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile

      # Reuses the web build from the latest "Checks (Linux)" cache when nothing changed. Restore only.
      - name: Restore turbo cache
        if: steps.lists.outputs.maestro != '0'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo/cache
            apps/web/.next/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Android SDK packages, emulator and Maestro
        if: steps.lists.outputs.any == 'true'
        timeout-minutes: 15
        run: scripts/android.sh setup

      - id: avd
        name: Emulator cache key
        if: steps.lists.outputs.any == 'true'
        run: echo "key=$(scripts/android.sh avd-key)" >> "$GITHUB_OUTPUT"

      # The AVD with the snapshot of its booted state, the same key as "Android tests" (see there): restored, never saved by
      # this job, whose emulator is a copy of theirs.
      - name: Restore the emulator
        if: steps.lists.outputs.any == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.android/avd
          key: avd-v2-${{ runner.os }}-${{ steps.avd.outputs.key }}

      - name: Boot the emulator
        if: steps.lists.outputs.any == 'true'
        timeout-minutes: 10
        env:
          AVD_SNAPSHOT: '1'
          EMULATOR_BOOT_TIMEOUT: '480'
        run: scripts/android.sh emulator

      # The listed unit tests, then the listed Compose UI tests on the emulator.
      - name: Compose, the listed tests only
        if: steps.lists.outputs.compose != '0'
        timeout-minutes: 25
        run: scripts/android.sh quarantine

      # The debug app with the API address of this job's web server, then the listed flows in nl-NL and en. A failed Compose
      # step does not skip the flows: the job reports every listed test that fails.
      - name: Debug app for Maestro
        if: ${{ !cancelled() && steps.lists.outputs.maestro != '0' }}
        timeout-minutes: 10
        run: scripts/android.sh maestro-apk

      - name: Maestro, the listed flows only
        if: ${{ !cancelled() && steps.lists.outputs.maestro != '0' }}
        timeout-minutes: 30
        run: scripts/maestro.sh android --apk

      - name: Stop the emulator
        if: ${{ always() && steps.lists.outputs.any == 'true' }}
        run: scripts/android.sh stop

      - name: Upload Quarantine (Android) reports
        if: ${{ always() && steps.lists.outputs.any == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-quarantine-reports
          path: |
            apps/android/app/build/reports/
            apps/android/client/build/reports/
            apps/android/app/build/outputs/androidTest-results/
            apps/android/build/emulator.log*
            e2e/maestro/build/
          retention-days: 7
          if-no-files-found: ignore
