# CI for every pull request, every push to main and every merge group of the merge queue (E002, E010), on demand
# (workflow_dispatch) and every night (schedule). The queue tests a PR on top of the latest main on a temporary gh-readonly-queue/main/* branch;
# the required checks must report there too, or the queue never merges (ADR-018).
#
# The job names ("Detect changes", "Checks (Linux)", "E2E (Linux)", "iOS",
# "Android") are the intended required checks; see docs/engineering/WORKFLOW.md §7. Renaming a job
# renames its check, so update WORKFLOW.md in the same PR. "iOS" and "Android" are gate jobs (#293): each needs its parts
# (a build job and the test jobs) and reports their combined result through scripts/native-gate.sh, so the required
# names stay while the parts change; a gate is skipped, and passes as skipped, when "Detect changes" says the app's
# inputs did not change. Every job runs when something it depends on changed, and only then (scripts/affected.mjs,
# scripts/native-jobs.sh; ADR-024).
#
# New static checks (i18n parity, OpenAPI drift, ...) are added as a `check`
# script in the package that owns them. Turbo picks them up; no change here.
#
# The pipeline switch (ADR-034, ADR-035, .github/pipeline.json, scripts/pipeline.sh): "Detect changes" reads `ci` and outputs
# `ui_tests` and `integration_tests`. With `ci: full` every run runs every UI test and the integration tests, as before ADR-034
# (tag pipeline-full-2026-11-18). With `ci: fast` a pull request, a merge group and a push run no UI test: "iOS tests" run
# `test-ios.sh test <locale> --unit-only`, "Android tests" runs `android.sh verify --no-ui` without KVM, emulator and AVD cache,
# "Android Maestro" and "E2E (Linux)" do not run (a skipped required check passes), "Quarantine" runs its Vitest list only and
# "Quarantine (Android)" does not run. With `ci: lean` (ADR-035) a pull request, a merge group and a push run the same as with
# `fast`, and "Checks (Linux)" also leaves out the integration tests (`test:integration`): lint, types, unit tests, build and
# the static checks still run. The nightly run (schedule, 02:00 UTC) and workflow_dispatch run everything in every setting, UI
# tests, integration tests and every quarantine list included, whatever changed, and the last job, "Nightly report", opens or
# updates the issue "Nightly UI tests failed" when one of them failed, the integration tests (in "Checks (Linux)") included.

name: CI

on:
  pull_request:
  # A push to main only fills the caches that PRs and merge groups read, and nothing in it fails the run (ADR-018,
  # amendment of 12 November 2026; E002 #1357). The merge group already passed on the same tree (with `merge: direct`, ADR-035, which has no merge group, the PR's own run on a branch up to date with main did), and a flaky failure here
  # would turn main red and hold back the deploy of development and production (Railway's "Wait for CI"). So on a push:
  #   - the Linux jobs run as on a PR: turbo caches the tasks that passed (a failed task is left out, the others stay);
  #   - the native jobs run only as far as they write main's caches (Gradle, the AVD snapshot, DerivedData; a PR and a merge
  #     group read only main's and their own, E002 #242), when native paths changed (scripts/native-jobs.sh), without
  #     their test suites, retries, gates or Maestro;
  #   - every job has `continue-on-error: ${{ github.event_name == 'push' }}` (false on the other events), and the steps
  #     whose failure would stop the cache from being saved carry it too. Changing that is a decision for an ADR.
  #   - continue-on-error covers a job or step that FAILS. A job that hits its job timeout, or that no runner takes, ends
  #     `cancelled`, and a cancelled job makes the run `cancelled`, which Railway's "Wait for CI" treats as no go
  #     (push runs 42821661674, 42761668186, 42649049029: E2E (Linux) hit its job timeout). So the long steps of the
  #     jobs that run on a push have a step `timeout-minutes` below their job's, only on a push (360, the most GitHub
  #     allows, otherwise): a hang becomes a failed step, which continue-on-error covers. Still open: no YAML can stop a
  #     cancel when no runner takes a job (the macOS jobs, after about 15 minutes); the run is then `cancelled`. The
  #     owner checks what Railway does then (notes of #1357).
  # A PR, a merge group and workflow_dispatch run as before; the five required checks keep their names.
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]
  workflow_dispatch:
  # The UI tests run here every night, on main (ADR-034): a scheduled run forces every job like workflow_dispatch.
  schedule:
    - cron: '0 2 * * *'

# A new push to a PR cancels the run for the previous push. A run that is in progress on main is never cancelled, nor is
# a run of a merge group, which the queue waits for. A run on main that is still pending when another push arrives is
# replaced by the newer one (GitHub keeps one running and one pending run per group): it shows as `cancelled` with no
# jobs, and is not a failure.
#
# The nightly run has a group of its own: it runs on main, like a push, and a push run that is pending would otherwise replace
# a nightly run that is pending behind a running one (or the other way round), and a night would be lost.
concurrency:
  group: ci-${{ github.event.pull_request.number || (github.event_name == 'schedule' && 'nightly') || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TZ: UTC
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    continue-on-error: ${{ github.event_name == 'push' }}
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      android: ${{ steps.filter.outputs.android }}
      e2e: ${{ steps.filter.outputs.e2e }}
      # Whether the UI tests run in this run (ADR-034): the Compose UI tests and Maestro on Android, the UI tests of iOS, the
      # Playwright suite (E2E (Linux)) and the Playwright, Compose and Maestro quarantine lists.
      ui_tests: ${{ steps.filter.outputs.ui_tests }}
      # Whether Checks (Linux) runs the integration tests (ADR-035): always with `ci: full` and `fast`; with `ci: lean` only in
      # the nightly run and on demand.
      integration_tests: ${{ steps.filter.outputs.integration_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A PR checkout is a merge commit whose first parent is the base branch.
          fetch-depth: 2
          persist-credentials: false

      - id: filter
        name: Filter paths
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          # A merge group's parent commit: main as the queue saw it. Empty on the other events.
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          RUN_NATIVE: ${{ contains(github.event.pull_request.labels.*.name, 'run-native') }}
        run: |
          set -euo pipefail

          # The commit to compare with: a PR's base branch, the push's previous head, or the base commit of the
          # merge group (every queued PR's commits sit on top of it).
          prior="$BEFORE"
          if [[ "$EVENT" == 'merge_group' ]]; then prior="$MERGE_BASE"; fi

          base=''
          if [[ "$EVENT" == 'pull_request' ]]; then
            base='HEAD^1'
          elif [[ -n "$prior" && ! "$prior" =~ ^0+$ ]]; then
            if git cat-file -e "$prior^{commit}" 2>/dev/null \
              || git fetch --no-tags --depth=1 origin "$prior"; then
              base="$prior"
            fi
          fi

          if [[ -n "$base" ]]; then
            changed="$(git diff --no-renames --name-only "$base" HEAD)"
          else
            echo 'No base commit to compare with; treating every path as changed.'
            changed="$(git ls-files)"
          fi

          # Which native jobs run (scripts/native-jobs.sh): those whose paths changed. That holds on a push to main,
          # which writes the caches every PR reads, and in a merge group, whose caches only its own queue branch reads.
          # workflow_dispatch, the nightly run (schedule) and the PR's run-native label (read on its pushes) force them.
          args=(--event "$EVENT")
          if [[ "$RUN_NATIVE" == 'true' ]]; then args+=(--run-native); fi
          scripts/native-jobs.sh "${args[@]}" <<<"$changed" >>"$GITHUB_OUTPUT"

          # Whether the Linux E2E job runs (scripts/affected.mjs, the decision scripts/check.sh makes too): only when the
          # web app or a package it depends on changed, or on demand (also in the nightly run). Why it skips is in the log and
          # the job summary.
          affected_args=()
          if [[ "$EVENT" == 'workflow_dispatch' || "$EVENT" == 'schedule' || "$RUN_NATIVE" == 'true' ]]; then affected_args+=(--force); fi
          reasons="$(mktemp)"
          node scripts/affected.mjs ${affected_args[@]+"${affected_args[@]}"} <<<"$changed" 2>"$reasons" | grep '^e2e=' >>"$GITHUB_OUTPUT"
          cat "$reasons"
          { echo '### What this change affects'; sed 's/^/- /' "$reasons"; } >>"${GITHUB_STEP_SUMMARY:-/dev/null}"

          # Whether the UI tests run (ADR-034, .github/pipeline.json): always with `ci: full`, and with `ci: fast` or `lean` only in
          # the nightly run and on demand; the PR's run-native label forces the native jobs, not the UI tests. The rule lives
          # in scripts/pipeline.sh ui-tests, which the Quarantine jobs ask too; it fails closed: a missing or unknown
          # setting stops this job, and with it the run. The reason below only words the answer.
          ui_tests="$(scripts/pipeline.sh ui-tests --event "$EVENT")"
          ci_mode="$(scripts/pipeline.sh get ci)"
          if [[ "$ui_tests" == 'false' ]]; then
            ui_reason="ci is $ci_mode (.github/pipeline.json), so they run in the nightly run only"
          elif [[ "$ci_mode" == 'full' ]]; then
            ui_reason="ci is full (.github/pipeline.json), so every run runs them"
          elif [[ "$EVENT" == 'schedule' ]]; then
            ui_reason="the nightly run (schedule) runs them, every night"
          else
            ui_reason="$EVENT runs everything"
          fi
          echo "UI tests: $([[ "$ui_tests" == 'true' ]] && echo run || echo 'not run'): $ui_reason."
          echo "ui_tests=$ui_tests" >>"$GITHUB_OUTPUT"
          echo "- UI tests: $([[ "$ui_tests" == 'true' ]] && echo run || echo 'not run'): $ui_reason" >>"${GITHUB_STEP_SUMMARY:-/dev/null}"

          # Whether Checks (Linux) runs the integration tests (ADR-035): always with `ci: full` and `fast`, and with `ci: lean`
          # only in the nightly run and on demand. The rule lives in scripts/pipeline.sh integration-tests; same fail-closed
          # behaviour as above.
          integration_tests="$(scripts/pipeline.sh integration-tests --event "$EVENT")"
          if [[ "$integration_tests" == 'false' ]]; then
            integration_reason="ci is $ci_mode (.github/pipeline.json), so they run in the nightly run only"
          elif [[ "$ci_mode" == 'lean' && "$EVENT" == 'schedule' ]]; then
            integration_reason="the nightly run (schedule) runs them, every night"
          elif [[ "$ci_mode" == 'lean' ]]; then
            integration_reason="$EVENT runs everything"
          else
            integration_reason="ci is $ci_mode (.github/pipeline.json), so every run runs them"
          fi
          echo "Integration tests: $([[ "$integration_tests" == 'true' ]] && echo run || echo 'not run'): $integration_reason."
          echo "integration_tests=$integration_tests" >>"$GITHUB_OUTPUT"
          echo "- Integration tests: $([[ "$integration_tests" == 'true' ]] && echo run || echo 'not run'): $integration_reason" >>"${GITHUB_STEP_SUMMARY:-/dev/null}"

  checks:
    name: Checks (Linux)
    # Waits for Detect changes only for its integration_tests decision (ADR-035): about 20 seconds, and 5 + 25 minutes in the
    # chain of timeouts, far below the merge queue's 150 (ADR-018).
    needs: changes
    runs-on: ubuntu-24.04
    continue-on-error: ${{ github.event_name == 'push' }}
    # 25 minutes on every event (E002 #1490): a change to a package almost every other one depends on (packages/i18n, PR
    # #1488) misses the turbo cache everywhere, and the job then runs every package's lint, typecheck, tests and build
    # from scratch: 11 minutes on the PR (run 44523798956), and the merge group (run 44526069321) was cancelled at the
    # old 15 with no test failing, so the queue removed the PR. 25 is at least 1.5 times that slowest full run.
    timeout-minutes: 25
    # Integration tests run against real Postgres, the same major version as
    # compose.yaml and Railway (TESTING.md §5.3). Tests create their own databases.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: fivvi
          POSTGRES_PASSWORD: fake-local-db-password
          POSTGRES_DB: fivvi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fivvi -d fivvi"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://fivvi:fake-local-db-password@localhost:5432/fivvi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the version from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # `pnpm lint:root` runs shellcheck, and its findings differ per version: the runner's preinstalled one flagged
      # what the local one didn't. The version and checksums are pinned in scripts/_shellcheck.sh, the same file
      # scripts/bootstrap.sh uses; the cache key follows that file, so a bump downloads the new release.
      - name: Restore shellcheck
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: shellcheck-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/_shellcheck.sh') }}

      - name: Install the pinned shellcheck
        timeout-minutes: ${{ github.event_name == 'push' && 3 || 360 }}
        run: |
          source scripts/_lib.sh
          source scripts/_shellcheck.sh
          install_shellcheck
          echo "$SHELLCHECK_HOME" >>"$GITHUB_PATH"
          export PATH="$SHELLCHECK_HOME:$PATH"
          shellcheck --version
          [[ "$(shellcheck_version)" == "$SHELLCHECK_VERSION" ]] || { echo "shellcheck is not $SHELLCHECK_VERSION"; exit 1; }

      - name: Install dependencies
        timeout-minutes: ${{ github.event_name == 'push' && 5 || 360 }}
        run: pnpm install --frozen-lockfile

      # Turbo's local cache, plus Next.js's own build cache for turbo misses.
      # Main's cache is readable by every PR; a PR's cache only by that PR.
      - name: Restore turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo/cache
            apps/web/.next/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # The contract drift check (packages/contract) builds swift-openapi-generator and downloads
      # the openapi-generator jar when turbo has no cached result for it. The pipeline keeps both
      # in node_modules/.cache/contract and reuses them when their names match: the binary per
      # `swift --version` + Package.swift + Package.resolved, the jar per pinned version. Exact key
      # only, so a generator bump starts from an empty directory and old tools don't pile up.
      - name: Read Swift version
        id: swift
        run: echo "version=$(swift --version | sed -nE 's/.*Swift version ([0-9.]+).*/\1/p')" >>"$GITHUB_OUTPUT"

      - name: Restore the contract generators
        id: contract-generators
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/contract/node_modules/.cache/contract
          key: contract-generators-${{ runner.os }}-swift${{ steps.swift.outputs.version }}-${{ hashFiles('packages/contract/tools/swift-generator/Package.swift', 'packages/contract/tools/swift-generator/Package.resolved', 'packages/contract/config/openapi-generator.json') }}

      # One turbo run so independent tasks run in parallel. A failing task
      # doesn't stop the unrelated ones, so one run reports every failure.
      # The integration tests are one of its tasks only when the run has them (`ci: full` and `fast` always; `ci: lean`
      # only in the nightly run and on demand, ADR-035): "Detect changes" decides, scripts/pipeline.sh integration-tests.
      # Anything but exactly 'false' runs them: a value that is missing or odd never leaves tests out.
      - name: Lint, typecheck, unit tests, integration tests (when the run has them), build, format and static checks
        # On a push only (E002 #1357): a hang fails this step, which continue-on-error covers, instead of the job timeout
        # cancelling the job and the run. The slowest of 34 push runs of main took 620 s here (3 took 10 minutes or more),
        # and the job spends about 1 minute outside this step: 22 + 1 leaves 2 of the job's 25 minutes for the cache save. The step
        # is long so that a full uncached run on main (#1490) is not cut off before turbo has cached what passed.
        timeout-minutes: ${{ github.event_name == 'push' && 22 || 360 }}
        continue-on-error: ${{ github.event_name == 'push' }}
        env:
          INTEGRATION_TESTS: ${{ needs.changes.outputs.integration_tests }}
        run: |
          tasks=(lint typecheck test)
          if [[ "${INTEGRATION_TESTS:-}" != 'false' ]]; then tasks+=(test:integration); fi
          tasks+=(build format:check check)
          pnpm exec turbo run "${tasks[@]}" \
            --cache-dir=.turbo/cache \
            --continue=dependencies-successful

      # Saved even when another task fails, so a freshly built generator isn't lost; only on a
      # miss, and only once the check has produced both tools (not when turbo reused its result).
      - name: Save the contract generators
        if: >-
          always()
          && steps.contract-generators.outputs.cache-hit != 'true'
          && hashFiles('packages/contract/node_modules/.cache/contract/swift-openapi-generator-*', '!**/*.partial') != ''
          && hashFiles('packages/contract/node_modules/.cache/contract/openapi-generator-cli-*.jar') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/contract/node_modules/.cache/contract
          key: ${{ steps.contract-generators.outputs.cache-primary-key }}

  e2e:
    name: E2E (Linux)
    needs: changes
    # Only when the web app or a package it depends on is affected (scripts/affected.mjs); otherwise this required check
    # passes as skipped, and "Detect changes" says why. Playwright is a UI test: with `ci: fast` it runs only in the nightly
    # run and on demand (ADR-034), and the required check passes as skipped on a pull request and in a merge group.
    if: needs.changes.outputs.e2e == 'true' && needs.changes.outputs.ui_tests == 'true'
    runs-on: ubuntu-24.04
    continue-on-error: ${{ github.event_name == 'push' }}
    # The suite stops itself after 17 minutes (apps/web/test/e2e-run.ts, #1408), and the OS packages step may spend 10 minutes on
    # its retries (#1311) before it starts, so the job is never cancelled in the middle of either: about 1 minute for the
    # setup and the build, the worst case of the OS packages step (10), the suite (17) and 2 minutes for the post steps (the
    # Playwright report, the caches) make 30. The apt cache steps (prepare, restore, prune: seconds each, 2 minutes at most
    # each) run before the suite and count in the setup minute. The save runs only after a cold install that passed, and
    # takes seconds (32 MB) with 2 minutes as its limit: it comes out of the 2 minutes of the post steps, and out of the
    # suite's time only if the install used all of its 10 minutes (the last of 4 tries on a slow mirror) and the suite all
    # of its 17, the 1 + 10 + 2 + 17 = 30 of a run that is then cut off in its post steps at worst, which the limit of
    # the job is there for. On a push (E002 #1357) the work step may take 20 minutes (below), so the job gets 35: 1 + 10 +
    # 2 + 20 make 33, and 2 minutes remain for the post steps. A push is not in the merge queue's chain of timeouts (150,
    # ADR-018); for a pull request, a merge group and workflow_dispatch the chain is Detect changes 5 plus this job's 30,
    # far below it.
    timeout-minutes: ${{ github.event_name == 'push' && 35 || 30 }}
    # The e2e servers each create and migrate their own database on it (apps/web/e2e/serve.ts).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: fivvi
          POSTGRES_PASSWORD: fake-local-db-password
          POSTGRES_DB: fivvi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fivvi -d fivvi"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://fivvi:fake-local-db-password@localhost:5432/fivvi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        timeout-minutes: ${{ github.event_name == 'push' && 5 || 360 }}
        run: pnpm install --frozen-lockfile

      # Reuses the build from the latest "Checks (Linux)" cache when nothing changed.
      # Restore only: that job saves the cache.
      - name: Restore turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo/cache
            apps/web/.next/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @fivvi/web exec playwright --version | awk '{print $2}')" >>"$GITHUB_OUTPUT"

      # Browsers are cached per Playwright version. The OS packages they need are cached below, as the .deb files apt
      # downloads (#1470).
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        timeout-minutes: ${{ github.event_name == 'push' && 5 || 360 }}
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @fivvi/web exec playwright install --only-shell chromium

      # The Ubuntu mirror is now and then slow or out of reach from the runner: the step took 5 to 9 minutes instead of 15 to
      # 25 seconds and hit its limit with no test run (#1470; unreachable: #1311). So the packages come from a cache: apt
      # keeps the .deb files it downloads in /var/cache/apt/archives and takes them from there when the index of the mirror
      # lists the same version, so a warm run only fetches the small indexes.
      # The key holds the Ubuntu release (ImageOS, ubuntu24), Playwright's version (its list of packages for Chromium) and
      # the month, and NOT the runner image version: the image changes several times a week, and runs land on different
      # ones, so a key with it hardly ever hit (run 44421172254). Which .deb files are right is for apt to decide: it
      # compares each cached file with the mirror's index and downloads only what is missing or newer, so a cache from
      # another image is still almost complete. The month renews the cache once a month, so it does not drift from the
      # mirror for good; the restore-keys take the latest cache of the same release and Playwright version, so the first
      # run of a month starts from last month's files and downloads only what changed. They name no other release or
      # Playwright version, whose lists differ. A restored file that no longer fits the index is ignored by apt, and
      # "apt-get autoclean" deletes such files before the save, so the caches do not pile up old versions.
      # The cache is saved right after the install passes, so a failing test run does not lose it. As with the other caches,
      # a PR and a merge group read main's and their own. Who fills main's: with `ci: full` the push run on main (when it
      # runs E2E: a web change; E002 #242); with `ci: fast` the push run never runs E2E (ADR-034), so only the nightly run
      # (and a `full` push) does. In `fast` E2E does not run on a PR either, so a cold apt cache costs a PR nothing. A cold
      # run installs as before.
      - name: Prepare the apt cache for Chromium's OS packages
        id: apt
        timeout-minutes: 2
        run: |
          set -euo pipefail
          echo "release=${ImageOS:-unknown}" >>"$GITHUB_OUTPUT"
          echo "month=$(date -u +%Y-%m)" >>"$GITHUB_OUTPUT"
          # The cache action restores as the runner user, and apt must keep the packages it downloads.
          sudo mkdir -p /var/cache/apt/archives
          sudo chmod a+rwx /var/cache/apt/archives
          echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-downloaded-packages >/dev/null

      - name: Restore Chromium's OS packages
        id: apt-cache
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-chromium-${{ runner.os }}-${{ steps.apt.outputs.release }}-playwright-${{ steps.playwright.outputs.version }}-${{ steps.apt.outputs.month }}
          restore-keys: apt-chromium-${{ runner.os }}-${{ steps.apt.outputs.release }}-playwright-${{ steps.playwright.outputs.version }}-

      # apt cannot always resolve the Ubuntu mirror from the runner (#1311), which failed the job before any test ran;
      # the script tries the install again. What it installs is unchanged. With a warm cache this takes seconds.
      - name: Install Chromium's OS packages
        # Worst case, a cold cache and a mirror that fails: 4 tries of about 1.5 minutes, plus 90 seconds of waiting between them.
        timeout-minutes: 10
        run: scripts/playwright-deps.sh

      # A problem with the cache never fails the job: the next run installs from the mirror. Only a run that did not find the
      # exact key saves, after the files that no longer fit the mirror's index (the apt-get update of the install above) are deleted.
      - name: Prune Chromium's OS packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        timeout-minutes: 2
        continue-on-error: true
        run: sudo apt-get autoclean

      - name: Save Chromium's OS packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-chromium-${{ runner.os }}-${{ steps.apt.outputs.release }}-playwright-${{ steps.playwright.outputs.version }}-${{ steps.apt.outputs.month }}

      # Builds the web app, then runs every spec in nl-NL and en with axe checks.
      - name: Web e2e (nl-NL and en)
        id: e2e
        # On a push only (E002 #1357), as the turbo step of "Checks (Linux)". The slowest of 32 push runs of main took 754 s
        # here (7 took 12 minutes or more); 20 minutes is 1.6 times that, and fits the job's 35 with the OS packages step.
        timeout-minutes: ${{ github.event_name == 'push' && 20 || 360 }}
        continue-on-error: ${{ github.event_name == 'push' }}
        run: pnpm exec turbo run test:e2e --cache-dir=.turbo/cache

      # Only on failure: artifact storage counts against the free quota.
      - name: Upload Playwright report
        # On a push the test step has continue-on-error, which makes failure() false: read the step's own outcome.
        if: failure() || steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore


  # Quarantine (E002 #1361, ADR-025 amendment of 12 November 2026, TESTING.md §8). A flaky test on a quarantine list
  # (quarantine/vitest.txt, quarantine/playwright.txt) is left out of "Checks (Linux)" and "E2E (Linux)" (the shared Vitest
  # preset and apps/web/playwright.config.ts read the list), and this job, which is NOT a required check and must never become
  # one, runs exactly the listed tests on every run, so their results stay visible and the fix can show it works here.
  # THIS JOB NEVER FAILS. A red check holds back the merge gate (scripts/merge-gate.jq counts any check that is not a
  # success), `pr.sh ready`, the failing count of `flow.sh` and the Railway preview, which waits on every check suite
  # (.railway/railway.ts), and the quarantine exists to unblock exactly those. So a listed test that fails, or a step that
  # cannot run it, ends as a `::warning` annotation and a line in the job summary (the last step), with the job green.
  # Every step that can fail has `continue-on-error: true` on every event, and each test step runs whatever happened to
  # the other one (`!cancelled()`). Only a cancelled run is cancelled. It passes when the lists are empty, and then does
  # nothing but read them: no install, no Postgres use, no browser. scripts/quarantine.mjs --count says which runner has
  # entries; FIVVI_QUARANTINE=only selects the listed tests.
  #
  # With `ci: fast` (ADR-034) a run without UI tests reads the Playwright list and leaves it out: the job runs its Vitest list
  # only, and the Playwright list runs in the nightly run and on demand. The job waits for no other job (it runs on every
  # run, also when "Detect changes" fails), so it reads the switch itself, as "Detect changes" does for `ui_tests`.
  quarantine:
    name: Quarantine
    runs-on: ubuntu-24.04
    # Never fails, on any event; the push-run rules (ADR-018) hold as for every job.
    continue-on-error: ${{ github.event_name == 'push' }}
    # The step timeouts are the same on every event (not the push-only expression of the other jobs) and add up to 54
    # (install 5 + Vitest 12 + Chromium 5 + its OS packages 10 + build 8 + e2e 14), below this job's 60 with about 3 minutes
    # outside the steps: a hung listed test ends as a failed step, which continue-on-error covers, never as a job that the
    # timeout cancels (a cancelled job is neither green nor ignorable). Nothing waits for this job, so no chain of timeouts
    # (ADR-018) includes it.
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: fivvi
          POSTGRES_PASSWORD: fake-local-db-password
          POSTGRES_DB: fivvi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fivvi -d fivvi"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://fivvi:fake-local-db-password@localhost:5432/fivvi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Runs before any install, on the Node the runner has (scripts/quarantine.mjs imports nothing else).
      - id: lists
        name: Read the quarantine lists
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          vitest="$(node scripts/quarantine.mjs --count vitest)"
          listed="$(node scripts/quarantine.mjs --count playwright)"
          # The Playwright list holds UI tests: it runs only in a run with UI tests (ADR-034), and every step below reads
          # `playwright`, so a run without them leaves it out here, once. A run has UI tests with `ci: full`, and with
          # `ci: fast` in the nightly run and on demand (scripts/pipeline.sh ui-tests, the rule of "Detect changes"); a switch that
          # cannot be read, or an unknown value, leaves the list out: this job never fails, and never guesses that it should run more.
          ui_tests="$(scripts/pipeline.sh ui-tests --event "$EVENT" 2>/dev/null || echo false)"
          playwright="$listed"
          playwright_later=0
          if [[ "$ui_tests" != 'true' ]]; then playwright=0; playwright_later="$listed"; fi
          {
            echo "vitest=$vitest"
            echo "playwright=$playwright"
            echo "playwright_later=$playwright_later"
            if [[ "$vitest" != '0' || "$playwright" != '0' ]]; then echo 'any=true'; else echo 'any=false'; fi
          } >>"$GITHUB_OUTPUT"
          if [[ "$vitest" == '0' && "$playwright" == '0' ]]; then
            {
              echo '### Quarantine'
              if [[ "$playwright_later" != '0' ]]; then
                echo "Vitest lists nothing, and the $playwright_later listed Playwright test(s) run in the nightly run only: this run has no UI tests (ADR-034)."
              else
                echo 'Nothing is quarantined: the lists of Vitest and Playwright are empty, so there is nothing to run.'
              fi
            } >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.lists.outputs.any == 'true'
        continue-on-error: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.lists.outputs.any == 'true'
        continue-on-error: true
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        id: install
        if: steps.lists.outputs.any == 'true'
        timeout-minutes: 5
        continue-on-error: true
        run: pnpm install --frozen-lockfile

      # Every package's unit and integration tests, each with the preset that reads the list. The two runs and every
      # package run to the end, so the job reports every listed test that fails; the log is read by the last step.
      # `--reporter=default` leaves out Vitest's github-actions reporter: its red ::error annotations would sit under the
      # green check, on files the PR may not touch. The summary and the ::warning of the last step carry the result.
      - name: Vitest, the listed tests only
        id: vitest
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.lists.outputs.vitest != '0' }}
        timeout-minutes: 12
        continue-on-error: true
        shell: bash
        env:
          FIVVI_QUARANTINE: only
          # No colour codes in the log the report step reads.
          NO_COLOR: '1'
          FORCE_COLOR: '0'
        # The step ends 0 whatever the tests did, and writes their real exit status as its output `status`: a failed step
        # under continue-on-error would still add a red "Process completed with exit code 1" annotation to the green check.
        run: |
          set +e
          {
            status=0
            pnpm -r --no-bail --if-present run test --reporter=default || status=1
            pnpm -r --no-bail --if-present run test:integration --reporter=default || status=1
            exit "$status"
          } 2>&1 | tee "$RUNNER_TEMP/quarantine-vitest.log"
          echo "status=${PIPESTATUS[0]}" >>"$GITHUB_OUTPUT"
          exit 0

      # Restore only, as E2E (Linux) does: that job and Checks (Linux) save the caches.
      - name: Restore turbo cache
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.lists.outputs.playwright != '0' }}
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo/cache
            apps/web/.next/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Read Playwright version
        id: playwright
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.lists.outputs.playwright != '0' }}
        continue-on-error: true
        run: echo "version=$(pnpm --filter @fivvi/web exec playwright --version | awk '{print $2}')" >>"$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        id: playwright-cache
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        id: chromium
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' && steps.playwright-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 5
        continue-on-error: true
        run: pnpm --filter @fivvi/web exec playwright install --only-shell chromium

      - name: Install Chromium's OS packages
        id: os-packages
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        # Worst case: 4 tries of about 1.5 minutes, plus 90 seconds of waiting between them.
        timeout-minutes: 10
        continue-on-error: true
        run: scripts/playwright-deps.sh

      # The build apart from the tests: `turbo run test:e2e` would take FIVVI_QUARANTINE into its hash and, with the cache,
      # could skip the run; the job must run the listed tests every time.
      - name: Build the web app
        id: build
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        timeout-minutes: 8
        continue-on-error: true
        run: pnpm exec turbo run build --filter=@fivvi/web --cache-dir=.turbo/cache

      # `--retries=0`: a quarantined test that fails and then passes on the retry of CI (retries: 1) must not read as fixed.
      # The reporters are the config's without `github`, whose red ::error annotations would sit under the green check.
      - name: Web e2e (nl-NL and en), the listed tests only
        id: e2e
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.os-packages.outcome == 'success' && steps.chromium.outcome != 'failure' }}
        timeout-minutes: 14
        continue-on-error: true
        shell: bash
        env:
          FIVVI_QUARANTINE: only
          NO_COLOR: '1'
          FORCE_COLOR: '0'
        # Ends 0 and writes the real exit status as its output `status`, as the Vitest step does.
        run: |
          set +e
          pnpm --filter @fivvi/web run test:e2e --retries=0 --reporter=list,html,./e2e/timeout-reporter.ts 2>&1 | tee "$RUNNER_TEMP/quarantine-playwright.log"
          echo "status=${PIPESTATUS[0]}" >>"$GITHUB_OUTPUT"
          exit 0

      - name: Upload Playwright report
        if: ${{ !cancelled() && steps.e2e.outputs.status != '' && steps.e2e.outputs.status != '0' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-quarantine
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

      # The result of the job: which list, which tests failed, or that all passed. A failing runner is a warning
      # annotation, never a failed check (see the top of this job).
      - name: Report the quarantined tests
        if: ${{ !cancelled() && steps.lists.outputs.any == 'true' }}
        continue-on-error: true
        shell: bash
        env:
          INSTALL: ${{ steps.install.outcome }}
          VITEST_LISTED: ${{ steps.lists.outputs.vitest }}
          VITEST: ${{ steps.vitest.outcome }}
          VITEST_STATUS: ${{ steps.vitest.outputs.status }}
          PLAYWRIGHT_LISTED: ${{ steps.lists.outputs.playwright }}
          PLAYWRIGHT_LATER: ${{ steps.lists.outputs.playwright_later }}
          E2E: ${{ steps.e2e.outcome }}
          E2E_STATUS: ${{ steps.e2e.outputs.status }}
        run: |
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo '### Quarantine' >>"$summary"
          # report <runner> <listed> <step outcome> <exit status of the tests> <log> <pattern of a failed test's line>
          # The test steps end 0 themselves and write the real exit status of the tests; an empty status with an outcome of
          # failure is a step that did not finish (its timeout), and `skipped` is a step that did not start.
          report() {
            local runner="$1" listed="$2" outcome="$3" status="$4" log="$5" pattern="$6" failed
            if [[ "$listed" == '0' ]]; then
              echo "- $runner: nothing listed" >>"$summary"
            elif [[ "$status" == '0' ]]; then
              echo "- $runner: all $listed quarantined test(s) passed" >>"$summary"
            elif [[ -n "$status" ]]; then
              # Colour codes first (the log has none when NO_COLOR works, and a runner may add them anyway), then the lines of
              # failed tests, without pnpm's own summary of a failed recursive run (`× "pnpm recursive run" failed in 1 packages`).
              failed="$(sed -E 's/\x1b\[[0-9;]*m//g' "$log" 2>/dev/null | grep -E "$pattern" | grep -v 'pnpm recursive run' | sed -E 's/^(apps|packages)\/[^ ]+ [^ ]+: //; s/^ +//' | sort -u | head -20 || true)"
              echo "- $runner: **$listed listed, and the quarantined tests failed**" >>"$summary"
              if [[ -n "$failed" ]]; then
                printf '\n```\n%s\n```\n' "$failed" >>"$summary"
              fi
              echo "::warning title=Quarantine ($runner)::the listed tests of $runner failed (the check stays green: a quarantined test never blocks). $(printf '%s' "$failed" | tr '\n' ';' | cut -c1-400 | sed 's/%/%25/g')"
            else
              echo "- $runner: $listed listed, but the tests did not run to the end ($outcome): see the steps of this job" >>"$summary"
              echo "::warning title=Quarantine ($runner)::$listed listed test(s) of $runner did not run to the end ($outcome); see the steps of this job"
            fi
          }
          report Vitest "$VITEST_LISTED" "$VITEST" "$VITEST_STATUS" "$RUNNER_TEMP/quarantine-vitest.log" '^((apps|packages)/[^ ]+ [^ ]+: )? *(FAIL|×) '
          if [[ "${PLAYWRIGHT_LATER:-0}" != '0' ]]; then
            echo "- Playwright: $PLAYWRIGHT_LATER listed, not run here: the UI tests run in the nightly run (ADR-034)" >>"$summary"
          else
            report Playwright "$PLAYWRIGHT_LISTED" "$E2E" "$E2E_STATUS" "$RUNNER_TEMP/quarantine-playwright.log" '^((apps|packages)/[^ ]+ [^ ]+: )? +[0-9]+\) \['
          fi

  # iOS (E008, E002, #293). Seven jobs and the gate "iOS": one job builds once and packs the test bundle, and six test jobs run
  # the Dutch and the English test passes from it (each language in three parts, #1447, #1614) at the same time, each on its own
  # simulator (a cold run was 16 of 21 minutes of tests in a row). They start only when the app, its generated inputs or
  # its own scripts changed (in a PR, a merge group or a push to main), or on demand (scripts/native-jobs.sh), to keep
  # PR feedback fast. The UI tests run in both languages on every push. The image and Xcode are pinned, so a runner
  # update doesn't change the toolchain.
  #
  # The image (E002 #242): macos-15, not macos-26, whose runners queued about 10 minutes in two runs. The app needs
  # no Xcode 26: Swift 6.0 mode, swift-tools-version 6.0 packages, project format 77 and iOS 17 as the deployment
  # target all build with Xcode 16. macos-15 has Xcode 16.0 to 16.4 and 26.0.1 to 26.3 (not 26.5 or 26.6, which only
  # macos-26 has), so this takes 26.3, the newest, to stay on the Xcode 26 line of local runs (iOS 26.2 simulator
  # instead of 26.5). If the job fails here but not on macos-26, or its queue isn't shorter, go back to macos-26 and
  # Xcode_26.6.
  ios-build:
    name: iOS build
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    continue-on-error: ${{ github.event_name == 'push' }}
    # The longest build of the last 10 green runs took 322 s (5.4 min), so 12 minutes is 2.2 times that (#393).
    # Detect changes (5) + this (12) + iOS tests (44) + the report job (2) = 63, under the merge queue's check
    # timeout (ADR-018). If no runner takes this job, GitHub cancels it after 15 minutes and ios-build-retry builds once
    # more (see there for the longest chain, 154, and the queue's 160).
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read # scripts/step-timings.sh reads this run's step durations
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: xcode
        name: Xcode version
        run: echo "version=$(xcodebuild -version | tr -s ' \n' '--' | sed 's/-$//')" >> "$GITHUB_OUTPUT"

      # DerivedData, with the compiled Swift packages (sentry-cocoa takes minutes to build), and the packages
      # themselves. Keyed by Package.resolved, the Xcode version, the runner OS and the run: every run saves what it
      # built (an exact hit is never saved again, so a key without the run would freeze the cache at the first
      # build) and restores the newest one through the restore keys, the same Package.resolved first. The package
      # graph is in the key too (the manifests of all local packages, in apps/ios/Packages and in packages/, and the
      # project file): a cache built for another graph
      # (Sentry a direct dependency of the app, not of FivviShared) made Xcode refuse its precompiled Sentry module in
      # the first run of the shared packages (#500), and a failed run saves nothing. Within one graph a stale cache
      # only costs build time and never changes a result. A PR can read its own caches and main's; main's are
      # written by the pushes that change native paths, so a PR's first run is warm once main has run it. The
      # manifest of the sources' modification times (scripts/ios-mtimes.mjs) is part of it. The index store is left
      # out: nothing in a build reads it, and it is a large part of the payload. GitHub keeps a repository's caches
      # to 10 GB, evicts the least recently used first, and removes any not read for 7 days.
      - name: Cache the iOS build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/ios/.build/DerivedData
            apps/ios/.build/SourcePackages
            apps/ios/.build/source-mtimes.json
            !apps/ios/.build/DerivedData/Logs
            !apps/ios/.build/DerivedData/Index.noindex
          key: ios-build-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('apps/ios/Packages/**/Package.swift', 'packages/contract/swift/Package.swift', 'packages/design-tokens/FivviDesignTokens/Package.swift', 'packages/i18n/generated/ios/Package.swift', 'apps/ios/FivviPro.xcodeproj/project.pbxproj') }}-${{ hashFiles('apps/ios/FivviPro.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ios-build-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('apps/ios/Packages/**/Package.swift', 'packages/contract/swift/Package.swift', 'packages/design-tokens/FivviDesignTokens/Package.swift', 'packages/i18n/generated/ios/Package.swift', 'apps/ios/FivviPro.xcodeproj/project.pbxproj') }}-${{ hashFiles('apps/ios/FivviPro.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
            ios-build-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('apps/ios/Packages/**/Package.swift', 'packages/contract/swift/Package.swift', 'packages/design-tokens/FivviDesignTokens/Package.swift', 'packages/i18n/generated/ios/Package.swift', 'apps/ios/FivviPro.xcodeproj/project.pbxproj') }}-

      # Xcode decides what to compile by the modification time of the inputs, and a checkout gives every file the
      # time of the checkout: the restored DerivedData above was thrown away by a build that found every source "changed"
      # (about 90 s of Swift and 50 s of asset catalog every run). The files whose content is the cached build's get
      # their old time back; the ones that changed keep the new time and are compiled (#293 AC15).
      - name: Restore the sources' modification times
        run: node scripts/ios-mtimes.mjs restore

      # The same steps as `pnpm test:ios` up to the build (apps/ios/README.md#tests): SwiftLint, the checks, one
      # build-for-testing; then it packs the test bundle. Prints the build timing summary.
      - name: SwiftLint, checks and build for testing
        timeout-minutes: ${{ github.event_name == 'push' && 10 || 360 }}
        run: scripts/test-ios.sh build

      - name: Record the sources' modification times
        run: node scripts/ios-mtimes.mjs save

      # What the six test jobs run: the .xctestrun and the build products, packed in a tar to keep the file modes.
      - name: Upload the test bundle
        if: github.event_name != 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-bundle
          path: apps/ios/.build/ios-test-bundle.tar
          # .build is a hidden folder, which the action skips by default (#290).
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

      # Only on failure: artifact storage counts against the free quota.
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-build-log
          path: |
            apps/ios/.build/build-for-testing.log
            apps/ios/.build/build-for-testing-Fivvi.log
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

      - name: Step durations
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/step-timings.sh

  # The retries (#1268): when no hosted macOS runner takes a job within 15 minutes, GitHub cancels it with no step run
  # and `needs.<job>.result` is `abandoned`. This builds once more, with the same steps (a test compares them), and the
  # tests start from whichever build succeeded; a run that somebody cancelled is not retried. A test pass that got no
  # runner is retried too (ios-tests-plan, ios-tests-retry below), and only that language, from the bundle that already
  # exists. Every retry may itself queue for a runner for 15 minutes, and ios-tests-plan waits for the whole ios-tests
  # matrix, so the other language may run its full 44 minutes before the plan starts. The longest chain by the timeouts
  # is therefore Detect changes 5 + (15 wait + 15 wait + 12 build) + (44 tests + 2 plan + 15 wait + 44 tests) + the gate
  # 2 = 154 minutes, so the merge queue's check timeout is 160 (ADR-018), applied with
  # `scripts/github-settings.sh apply`, and `pr.sh wait` gives a native run 165.
  ios-build-retry:
    name: iOS build (retry)
    needs: [changes, ios-build]
    if: ${{ !cancelled() && github.event_name != 'push' && needs.changes.outputs.ios == 'true' && needs.ios-build.result == 'abandoned' }}
    runs-on: macos-15
    continue-on-error: ${{ github.event_name == 'push' }}
    # As "iOS build".
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read # scripts/step-timings.sh reads this run's step durations
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: xcode
        name: Xcode version
        run: echo "version=$(xcodebuild -version | tr -s ' \n' '--' | sed 's/-$//')" >> "$GITHUB_OUTPUT"

      # DerivedData, with the compiled Swift packages (sentry-cocoa takes minutes to build), and the packages
      # themselves. Keyed by Package.resolved, the Xcode version, the runner OS and the run: every run saves what it
      # built (an exact hit is never saved again, so a key without the run would freeze the cache at the first
      # build) and restores the newest one through the restore keys, the same Package.resolved first. The package
      # graph is in the key too (the manifests of all local packages, in apps/ios/Packages and in packages/, and the
      # project file): a cache built for another graph
      # (Sentry a direct dependency of the app, not of FivviShared) made Xcode refuse its precompiled Sentry module in
      # the first run of the shared packages (#500), and a failed run saves nothing. Within one graph a stale cache
      # only costs build time and never changes a result. A PR can read its own caches and main's; main's are
      # written by the pushes that change native paths, so a PR's first run is warm once main has run it. The
      # manifest of the sources' modification times (scripts/ios-mtimes.mjs) is part of it. The index store is left
      # out: nothing in a build reads it, and it is a large part of the payload. GitHub keeps a repository's caches
      # to 10 GB, evicts the least recently used first, and removes any not read for 7 days.
      - name: Cache the iOS build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/ios/.build/DerivedData
            apps/ios/.build/SourcePackages
            apps/ios/.build/source-mtimes.json
            !apps/ios/.build/DerivedData/Logs
            !apps/ios/.build/DerivedData/Index.noindex
          key: ios-build-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('apps/ios/Packages/**/Package.swift', 'packages/contract/swift/Package.swift', 'packages/design-tokens/FivviDesignTokens/Package.swift', 'packages/i18n/generated/ios/Package.swift', 'apps/ios/FivviPro.xcodeproj/project.pbxproj') }}-${{ hashFiles('apps/ios/FivviPro.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ios-build-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('apps/ios/Packages/**/Package.swift', 'packages/contract/swift/Package.swift', 'packages/design-tokens/FivviDesignTokens/Package.swift', 'packages/i18n/generated/ios/Package.swift', 'apps/ios/FivviPro.xcodeproj/project.pbxproj') }}-${{ hashFiles('apps/ios/FivviPro.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
            ios-build-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('apps/ios/Packages/**/Package.swift', 'packages/contract/swift/Package.swift', 'packages/design-tokens/FivviDesignTokens/Package.swift', 'packages/i18n/generated/ios/Package.swift', 'apps/ios/FivviPro.xcodeproj/project.pbxproj') }}-

      # Xcode decides what to compile by the modification time of the inputs, and a checkout gives every file the
      # time of the checkout: the restored DerivedData above was thrown away by a build that found every source "changed"
      # (about 90 s of Swift and 50 s of asset catalog every run). The files whose content is the cached build's get
      # their old time back; the ones that changed keep the new time and are compiled (#293 AC15).
      - name: Restore the sources' modification times
        run: node scripts/ios-mtimes.mjs restore

      # The same steps as `pnpm test:ios` up to the build (apps/ios/README.md#tests): SwiftLint, the checks, one
      # build-for-testing; then it packs the test bundle. Prints the build timing summary.
      - name: SwiftLint, checks and build for testing
        timeout-minutes: ${{ github.event_name == 'push' && 10 || 360 }}
        run: scripts/test-ios.sh build

      - name: Record the sources' modification times
        run: node scripts/ios-mtimes.mjs save

      # What the six test jobs run: the .xctestrun and the build products, packed in a tar to keep the file modes.
      - name: Upload the test bundle
        if: github.event_name != 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-bundle
          path: apps/ios/.build/ios-test-bundle.tar
          # .build is a hidden folder, which the action skips by default (#290).
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

      # Only on failure: artifact storage counts against the free quota.
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-build-log
          path: |
            apps/ios/.build/build-for-testing.log
            apps/ios/.build/build-for-testing-Fivvi.log
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

      - name: Step durations
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/step-timings.sh

  ios-tests:
    name: iOS tests (${{ matrix.locale }} ${{ matrix.shard }}/3)
    # `changes` for the decision whether the UI tests run (ADR-034).
    needs: [changes, ios-build, ios-build-retry]
    # Start from whichever build succeeded (the retry runs only when the first was abandoned); !cancelled() because a
    # skipped retry would skip this job.
    if: ${{ !cancelled() && github.event_name != 'push' && (needs.ios-build.result == 'success' || needs.ios-build-retry.result == 'success') }}
    # Parts 2 and 3 of a language have nothing to run in a run without UI tests (ADR-034, see the test steps below): it runs on
    # Linux then and takes no macOS runner (the parts that run would otherwise make six macOS jobs where main has two, and
    # a part 2 or 3 that got no runner would be retried and could fail "iOS" with no test involved). The job still passes as
    # a part, so the gate and the retry plan read it as before.
    runs-on: ${{ (needs.changes.outputs.ui_tests == 'true' || matrix.shard == 1) && 'macos-15' || 'ubuntu-24.04' }}
    continue-on-error: ${{ github.event_name == 'push' }}
    # A healthy run takes 14-21 min (#393), of which the simulator boot and settle is up to 4 min (xcodebuild 11-17). A test that hangs fails
    # after its own allowance (scripts/test-ios.sh), so this is the backstop for the whole job: the deadline there
    # (2100 s, counted from the start of xcodebuild) + its grace (60 s) + what the job spends outside the deadline (at
    # most 245 s boot and settle, 33 s other steps, 15 s uploading the results, 17 s reports and cleanup after the
    # grace: 310 s measured) + 2 min = 2590 s, so 44 min. Detect changes (5) + iOS build (12) + this (44) + the report job (2) = 63, under the merge queue's
    # check timeout (ADR-018). Raising the deadline further means raising this, and a test fails when the
    # numbers no longer fit. The deadline is 2100 s since #1389: the xcodebuild step of a run took 1170 to 1730 s on
    # the runners of 13-14 November 2026 (median 1650 s, the interrupted ones at 1790 s or more), and a run may use at
    # most 85 % of the deadline on a typical runner (TESTING.md §7.2).
    #
    # Each language runs in three parts, on a runner each (#1447, #1614): the whole language took 1585 to 2112 s of xcodebuild on
    # the runners of 16-17 November 2026, and ran past the deadline in the merge queue with no test failing. Two parts were
    # no longer enough: in the nightly run of 28 November 2026 (46131663275) they took 1735 to 2055 s of the 2100 s deadline
    # (82 to 97 %), and `nl 1/2` lost to the job's 44 minutes (1998 s of Fivvi Pro, 237 s of Fivvi and the count). A part is
    # a third of the test classes by their weight (scripts/test-ios.sh, `--shard`), about 1300 to 1400 s on a slow runner,
    # so the deadline and the timeout stay as they are and a part has room to grow to 85 % of them. The six test parts start
    # after the build has ended, and GitHub Free runs five macOS jobs at once: `max-parallel: 5` makes the sixth leg wait
    # inside the matrix, not for a runner, because GitHub cancels a macOS job that gets no runner after about 15 minutes (the
    # #413 and #1268 cases, which the retry below exists for). It counts every leg, the Linux ones of a run without UI tests
    # too, which end in seconds and free their place. The matrix is the one in scripts/ios-parts.sh (the names of the parts,
    # which the gate and the retry read); a test keeps the three in step.
    #
    # The count of the part's tests before the run (`--shard`, IOS_ENUMERATE_DEADLINE) is not in the 310 s: those were
    # measured on 3 November 2026 (#393), before `select_shard` counted anything (19 November). It is 240 s since #1580
    # (the first try took 85 s or more on this runner and went past the old 120 s in 22 of 28 jobs of 7 nightly runs),
    # with its grace and a second try 600 s at worst, for a hang only, once for each app (Fivvi Pro, then Fivvi). The
    # release budgets one such count on top (release.yml); here it is paid from the 2 minutes and from the share of the
    # run's deadline the part does not use, as the 360 s of the old deadline were, because the chain of timeouts above
    # leaves no room for more (a test pins it at 63 and 154 minutes).
    timeout-minutes: 44
    permissions:
      contents: read
      actions: read # scripts/step-timings.sh reads this run's step durations
    strategy:
      # All parts always run: a failing one doesn't hide the others' results.
      fail-fast: false
      # GitHub Free runs five macOS jobs at once: the sixth leg waits here, in the matrix queue, not for a runner (see above).
      max-parallel: 5
      matrix:
        locale: [nl, en]
        shard: [1, 2, 3]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the test bundle
        if: needs.changes.outputs.ui_tests == 'true' || matrix.shard == 1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-test-bundle
          path: apps/ios/.build

      # The tests of this part of this language, from the bundle of "iOS build", without building again, on this job's own
      # simulator. Prints the slowest tests. With `ci: fast` (ADR-034) only a run with UI tests (the nightly run, on
      # demand) runs the unit and UI tests, each part its third (#1447, #1614); every other run runs the unit tests of this
      # language once, in part 1, and leaves the UI test target out (parts 2 and 3 have nothing to run: they run on Linux, download no
      # bundle, and pass).
      - name: Unit and UI tests (${{ matrix.locale }} ${{ matrix.shard }}/3)
        if: needs.changes.outputs.ui_tests == 'true'
        run: scripts/test-ios.sh test ${{ matrix.locale }} --shard ${{ matrix.shard }}/3

      - name: Unit tests (${{ matrix.locale }}), no UI tests in this run
        if: needs.changes.outputs.ui_tests != 'true' && matrix.shard == 1
        run: scripts/test-ios.sh test ${{ matrix.locale }} --unit-only

      # Only on failure, or when the timeout cancels the job (#305) in a run that nothing supersedes (a pull request
      # run is cancelled by the next push): artifact storage counts against the free quota.
      - name: Upload test results
        if: failure() || (cancelled() && github.event_name != 'pull_request')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-results-${{ matrix.locale }}-${{ matrix.shard }}of3
          path: apps/ios/.build/TestResults-*.xcresult
          # .build is a hidden folder, which the action skips by default (#290). Only these paths are named.
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

      - name: Step durations
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/step-timings.sh

  # Which parts of the tests got no runner (#1268): reads the run's jobs once "iOS tests" ended, for the matrix of
  # ios-tests-retry. Cheap and on Linux; it names a part (a language and its third, #1447, #1614) only when its job was
  # cancelled with no runner and no step.
  ios-tests-plan:
    name: iOS tests (retry plan)
    needs: ios-tests
    # !cancelled(): a run that somebody cancelled is not retried.
    if: ${{ !cancelled() && github.event_name != 'push' && needs.ios-tests.result != 'success' && needs.ios-tests.result != 'skipped' }}
    runs-on: ubuntu-24.04
    continue-on-error: ${{ github.event_name == 'push' }}
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read # scripts/ios-parts.sh reads this run's jobs
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: plan
        name: Parts that got no runner
        env:
          GH_TOKEN: ${{ github.token }}
          TESTS: ${{ needs.ios-tests.result }}
        run: echo "parts=$(scripts/ios-parts.sh retry-parts "$TESTS")" >>"$GITHUB_OUTPUT"

  # The retry of a test pass that no runner took (#1268): the same steps as ios-tests (a test compares them), for the
  # parts the plan named, from the bundle "iOS build" (or its retry) uploaded. The gate takes those parts' results
  # from here.
  ios-tests-retry:
    name: iOS tests (${{ matrix.locale }} ${{ matrix.shard }}/3) (retry)
    needs: [changes, ios-tests-plan]
    if: ${{ !cancelled() && github.event_name != 'push' && needs.ios-tests-plan.outputs.parts != '' && needs.ios-tests-plan.outputs.parts != '[]' }}
    # As "iOS tests".
    runs-on: ${{ (needs.changes.outputs.ui_tests == 'true' || matrix.shard == 1) && 'macos-15' || 'ubuntu-24.04' }}
    continue-on-error: ${{ github.event_name == 'push' }}
    # As "iOS tests".
    timeout-minutes: 44
    permissions:
      contents: read
      actions: read # scripts/step-timings.sh reads this run's step durations
    strategy:
      fail-fast: false
      matrix:
        # The legs the plan named, `[{"locale":"nl","shard":1}, ...]`. The fallback only keeps the expression valid when the plan was skipped (no outputs); the `if` above then skips this job.
        include: ${{ fromJSON(needs.ios-tests-plan.outputs.parts || '[{"locale":"nl","shard":1}]') }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the test bundle
        if: needs.changes.outputs.ui_tests == 'true' || matrix.shard == 1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-test-bundle
          path: apps/ios/.build

      # The tests of this part of this language, from the bundle of "iOS build", without building again, on this job's own
      # simulator. Prints the slowest tests. With `ci: fast` (ADR-034) only a run with UI tests (the nightly run, on
      # demand) runs the unit and UI tests, each part its third (#1447, #1614); every other run runs the unit tests of this
      # language once, in part 1, and leaves the UI test target out (parts 2 and 3 have nothing to run: they run on Linux, download no
      # bundle, and pass).
      - name: Unit and UI tests (${{ matrix.locale }} ${{ matrix.shard }}/3)
        if: needs.changes.outputs.ui_tests == 'true'
        run: scripts/test-ios.sh test ${{ matrix.locale }} --shard ${{ matrix.shard }}/3

      - name: Unit tests (${{ matrix.locale }}), no UI tests in this run
        if: needs.changes.outputs.ui_tests != 'true' && matrix.shard == 1
        run: scripts/test-ios.sh test ${{ matrix.locale }} --unit-only

      # Only on failure, or when the timeout cancels the job (#305) in a run that nothing supersedes (a pull request
      # run is cancelled by the next push): artifact storage counts against the free quota.
      - name: Upload test results
        if: failure() || (cancelled() && github.event_name != 'pull_request')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-results-${{ matrix.locale }}-${{ matrix.shard }}of3
          path: apps/ios/.build/TestResults-*.xcresult
          # .build is a hidden folder, which the action skips by default (#290). Only these paths are named.
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

      - name: Step durations
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/step-timings.sh

  # The required check "iOS": the combined result of the build and both test passes (AC17); skipped, and so passing,
  # when the native decision says the app's inputs didn't change.
  #
  # No runner (#413): GitHub's hosted macOS arm64 runners run short of capacity at times, and then a job is cancelled
  # after about 15 minutes with no runner and no step, although no test ran, and `needs.<job>.result` is `abandoned`
  # (#1268). A build that gets none is built once more by ios-build-retry, a test pass that gets none is run once more
  # by ios-tests-retry, on the same image; a retry that gets none either, or fails, still fails this check, and so
  # removes the PR from the merge queue. A retry on macos-15-intel was tried and dropped, because its tests ran past the
  # 1080 s deadline of #305. The error says which part had no runner (or was cancelled before one picked it up) and
  # that, if nobody cancelled the run, re-queuing the PR is enough, which part failed on a runner (a build or test
  # failure), and when the part is a retry, that it was the retry. scripts/ios-parts.sh reads the run's jobs to tell
  # them apart; the step adds a few seconds to the 2 minutes of this job.
  ios:
    name: iOS
    needs: [changes, ios-build, ios-build-retry, ios-tests, ios-tests-plan, ios-tests-retry]
    if: always() && needs.changes.outputs.ios == 'true' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    continue-on-error: ${{ github.event_name == 'push' }}
    # Only reads the results of the jobs it needs; short, so the chain of a native check stays under the queue timeout.
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read # scripts/ios-parts.sh reads this run's jobs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tells a part that no hosted runner picked up (#413) from one that failed on a runner, for the message. A read that
      # fails leaves the bare results as the jobs gave them: the gate then fails the same, with its summary line only
      # and no claim about a runner.
      - name: Combined result of the iOS jobs
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ needs.ios-build.result }}
          RETRY: ${{ needs.ios-build-retry.result }}
          TESTS: ${{ needs.ios-tests.result }}
        run: |
          mapfile -t PARTS < <(scripts/ios-parts.sh "$BUILD" "$TESTS" "$RETRY")
          scripts/native-gate.sh iOS true "${PARTS[@]}"

  # Android (E008, #293). The same commands as locally (TESTING.md §7.2), in three jobs and the gate "Android": "Android
  # build" (ktlint and the other checks, the debug build, and the debug app for Maestro, uploaded), "Android tests" (unit
  # tests and the Compose UI tests on an emulator; builds what it tests itself, so it runs next to the build job) and
  # "Android Maestro" (the flows in nl-NL and en on an emulator, from the uploaded app). The emulator needs KVM.
  android-build:
    name: Android build
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    continue-on-error: ${{ github.event_name == 'push' }}
    # Measured 0.8 to 4.6 minutes in the last 46 runs (the slowest: run 41674310293): 12 is
    # 2.6 x that and keeps the Android chain under the merge queue's check timeout (150, ADR-018; #519).
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read # scripts/step-timings.sh reads this run's step durations
    env:
      # The debug app for Maestro has the address of the web server of the Maestro job baked in: the same port in both.
      E2E_PORT: '3100'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # Caches Gradle's dependencies and wrapper; main's cache is readable by every PR.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Android SDK build tools
        timeout-minutes: ${{ github.event_name == 'push' && 5 || 360 }}
        run: scripts/android.sh setup --build-only

      - name: ktlint, checks and debug build
        timeout-minutes: 10
        run: scripts/android.sh build

      # Only for the Maestro job, which runs only in a run with UI tests (ADR-034).
      - name: Debug app for Maestro
        if: github.event_name != 'push' && needs.changes.outputs.ui_tests == 'true'
        run: scripts/android.sh maestro-apk

      - name: Upload the debug app
        if: github.event_name != 'push' && needs.changes.outputs.ui_tests == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-maestro-apk
          path: apps/android/build/maestro/app-debug.apk
          retention-days: 1
          if-no-files-found: error

      - name: Upload Android reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-build-reports
          path: |
            apps/android/app/build/reports/
            apps/android/core/build/reports/
            apps/android/client/build/reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Step durations
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/step-timings.sh

  android-tests:
    name: Android tests
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    continue-on-error: ${{ github.event_name == 'push' }}
    # The setup (3 minutes at most), the step "Unit tests, release bundle and Compose UI tests" (40) and 2 minutes for the
    # steps after it (#1442).
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read # scripts/step-timings.sh reads this run's step durations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The steps for the emulator (disk space, KVM, the SDK's emulator and image, the AVD cache, the boot) run only in a run
      # with UI tests (ADR-034); a run without them verifies the unit tests and the release bundle with the build tools only.
      #
      # The emulator creates a 6 GB data partition on its first boot and needs 7.4 GB free for it; Gradle
      # needs more. These preinstalled toolchains aren't used by this job.
      - name: Free disk space
        if: needs.changes.outputs.ui_tests == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # Caches Gradle's dependencies and wrapper; main's cache is readable by every PR.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Enable KVM
        if: needs.changes.outputs.ui_tests == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm || true
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo '::error::/dev/kvm is not usable by the runner user'
            exit 1
          fi

      - name: Android SDK packages and emulator
        if: needs.changes.outputs.ui_tests == 'true'
        timeout-minutes: ${{ github.event_name == 'push' && 15 || 360 }}
        run: scripts/android.sh setup

      - name: Android SDK build tools
        if: needs.changes.outputs.ui_tests != 'true'
        timeout-minutes: ${{ github.event_name == 'push' && 5 || 360 }}
        run: scripts/android.sh setup --build-only

      - id: avd
        name: Emulator cache key
        if: needs.changes.outputs.ui_tests == 'true'
        run: echo "key=$(scripts/android.sh avd-key)" >> "$GITHUB_OUTPUT"

      # The AVD with the snapshot of its booted state. Keyed by the system image, the emulator and the AVD settings
      # (a snapshot only loads on the same ones). Saved when the job passes on a miss, after the emulator has stopped.
      # A missing or broken snapshot is not an error: the boot below falls back to a cold boot. Bump the version (now v2) to drop every
      # cached AVD, and do it when a snapshot that no longer loads was replaced by a cold boot: the cache action never
      # overwrites an existing key, so the replacement isn't saved and every run would fall back to a cold boot. The
      # caches of a PR are its own and main's (written by pushes to main that change native paths).
      - name: Cache the emulator
        if: needs.changes.outputs.ui_tests == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.android/avd
          key: avd-v2-${{ runner.os }}-${{ steps.avd.outputs.key }}

      # Booted once; verify reuses it. From the snapshot when it is cached, else cold: then the
      # script saves one. It gives up after EMULATOR_BOOT_TIMEOUT (a cold boot can take minutes) and prints the
      # emulator log; the step timeout is a backstop.
      - name: Boot the emulator
        if: needs.changes.outputs.ui_tests == 'true'
        timeout-minutes: 10
        env:
          AVD_SNAPSHOT: '1'
          EMULATOR_BOOT_TIMEOUT: '480'
        run: scripts/android.sh emulator

      # Slow, not hung (#1442): over 25 runs of 14 to 17 November the step took 1033 to 1466 s, and the three that ran out of
      # 1500 s were 10 to 50 s from the end. The unit tests and the bundle take 3 to 5 minutes, the Compose UI tests 14 to 21
      # (:app's 436 take 12 to 17 on the two-core runner, :client's 85 about 2.5; the slowest test takes 5 s). 40 minutes is
      # 1.6 times the slowest run measured. A test that hangs fails by name after UI_TEST_TIMEOUT_MS (a minute or two,
      # scripts/_android.sh), long before the limit; the step below names the one that started last when it runs out anyway.
      - name: Unit tests, release bundle and Compose UI tests
        if: github.event_name != 'push' && needs.changes.outputs.ui_tests == 'true'
        timeout-minutes: 40
        run: scripts/android.sh verify

      # `ci: fast` (ADR-034): the unit tests and the signed release bundle, no emulator and no Compose UI test (those run in the
      # nightly run). The 40 minutes of the step above stay the limit of this step too, so the job's timeout is the same.
      - name: Unit tests and release bundle, no UI tests in this run
        if: github.event_name != 'push' && needs.changes.outputs.ui_tests != 'true'
        timeout-minutes: 40
        run: scripts/android.sh verify --no-ui

      # A push to main runs no test suite (ADR-018), so the two steps above don't run there and main's Gradle cache would lack the
      # dependencies of the unit tests, the Compose UI test APKs and the release bundle: a PR's Android tests starts colder than
      # before (E002 #1370; runs 44711652541, 44888055834 and 44947576787 restored a cache of 447 B to 3 MB and failed
      # downloading buildscript artifacts). This step compiles them, runs no test and boots no emulator; the cache is saved by
      # the post step of setup-gradle. It cannot fail the push run: continue-on-error, and a timeout below the job's.
      - name: Compile the test APKs and the release bundle (the push run fills the Gradle cache)
        if: github.event_name == 'push'
        continue-on-error: ${{ github.event_name == 'push' }}
        timeout-minutes: 20
        run: scripts/android.sh compile-tests

      - name: The Compose UI test that ran last
        if: failure() && needs.changes.outputs.ui_tests == 'true'
        run: scripts/android.sh last-test

      # The cache of the emulator is saved after this step: the emulator must not be running, or it would be copied in
      # mid-write.
      - name: Stop the emulator
        if: always() && needs.changes.outputs.ui_tests == 'true'
        run: scripts/android.sh stop

      # Always, also after a cancel or timeout: without the emulator log a hung boot can't be diagnosed. Kept 7 days,
      # as artifact storage counts against the free quota.
      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-test-reports
          path: |
            apps/android/app/build/reports/
            apps/android/core/build/reports/
            apps/android/client/build/reports/
            apps/android/app/build/outputs/androidTest-results/
            apps/android/build/emulator.log*
          retention-days: 7
          if-no-files-found: ignore

      - name: Step durations
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/step-timings.sh

  android-maestro:
    name: Android Maestro
    needs: [changes, android-build]
    # Maestro is a UI test: with `ci: fast` it runs only in the nightly run and on demand (ADR-034), and the gate "Android"
    # takes the skipped job for a pass only then.
    if: needs.changes.outputs.android == 'true' && github.event_name != 'push' && needs.changes.outputs.ui_tests == 'true'
    runs-on: ubuntu-24.04
    continue-on-error: ${{ github.event_name == 'push' }}
    # The setup before the Maestro step (3 minutes measured, the emulator boot is capped at 10), the step (45) and the
    # steps after it; still bounds a hung run (#519, #1578).
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # scripts/step-timings.sh reads this run's step durations
    env:
      # The port the debug app of "Android build" has baked in (scripts/android.sh maestro-apk).
      E2E_PORT: '3100'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The emulator creates a 6 GB data partition on its first boot and needs 7.4 GB free for it; Postgres and the web
      # build need more. These preinstalled toolchains aren't used by this job.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Maestro needs a JDK.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm || true
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo '::error::/dev/kvm is not usable by the runner user'
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Reuses the web build from the latest "Checks (Linux)" cache when nothing changed. Restore only.
      - name: Restore turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo/cache
            apps/web/.next/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Android SDK packages, emulator and Maestro
        run: scripts/android.sh setup

      - id: avd
        name: Emulator cache key
        run: echo "key=$(scripts/android.sh avd-key)" >> "$GITHUB_OUTPUT"

      # The AVD with the snapshot of its booted state (see "Android tests"): the same key, so a cache saved by one job is
      # read by the other.
      - name: Cache the emulator
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.android/avd
          key: avd-v2-${{ runner.os }}-${{ steps.avd.outputs.key }}

      - name: Boot the emulator
        timeout-minutes: 10
        env:
          AVD_SNAPSHOT: '1'
          EMULATOR_BOOT_TIMEOUT: '480'
        run: scripts/android.sh emulator

      - name: Download the debug app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-maestro-apk
          path: apps/android/build/maestro

      # Postgres (migrated and seeded), the fake Lettermint server and the web server, then every flow in nl-NL and en, with the
      # app of "Android build" (nothing is built here).
      # Both locales run one after the other: run 41938461253 (10 flows) took 19 min 47 s on a slow runner, 14 to 18
      # minutes on main. The suite grows with every Android ticket: the nightly runs of 21 to 24 November 2026 took 24 min
      # 38 s, 28 min 7 s, 28 min 36 s and, cut off by the 30-minute budget with the last flow of en running (run
      # 45388530989, nl-NL 14 min 7 s), over 30 min 13 s. The 45 minutes are 1.5 x 30 minutes (#519, #1578); the "Step
      # durations" step shows how close a run came and warns above 30 minutes (two thirds of the budget).
      - name: Maestro flows (sign-in, anonymous and home; nl-NL and en)
        timeout-minutes: 45
        run: scripts/maestro.sh android --apk

      # The cache of the emulator is saved after this step: the emulator must not be running, or it would be copied in
      # mid-write.
      - name: Stop the emulator
        if: always()
        run: scripts/android.sh stop

      - name: Upload Maestro reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-maestro-reports
          path: |
            apps/android/build/emulator.log*
            e2e/maestro/build/
          retention-days: 7
          if-no-files-found: ignore

      - name: Step durations
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/step-timings.sh "Maestro flows (sign-in, anonymous and home; nl-NL and en)=45"

  # The required check "Android": the combined result of the build, the tests and Maestro (AC17); skipped, and so passing,
  # when the native decision says the app's inputs didn't change.
  android:
    name: Android
    needs: [changes, android-build, android-tests, android-maestro]
    if: always() && needs.changes.outputs.android == 'true' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    continue-on-error: ${{ github.event_name == 'push' }}
    # Only reads the results of the jobs it needs; short, so the chain of a native check stays under the queue timeout.
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The parts are labelled, so the gate can accept one skipped part by name (scripts/native-gate.sh --skip-ok, ADR-034): "Android
      # Maestro" when "Detect changes" says this run has no UI tests (`ui_tests` is exactly `false`). In any other run, also when
      # `ui_tests` is empty, a skipped Maestro fails the gate as before: it stays fail-closed.
      - name: Combined result of the Android jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.android-build.result }}
          TESTS: ${{ needs.android-tests.result }}
          MAESTRO: ${{ needs.android-maestro.result }}
          UI_TESTS: ${{ needs.changes.outputs.ui_tests }}
        run: |
          skip_ok=()
          if [[ "$UI_TESTS" == 'false' ]]; then skip_ok+=(--skip-ok 'Android Maestro'); fi
          scripts/native-gate.sh ${skip_ok[@]+"${skip_ok[@]}"} Android true \
            "Detect changes=$CHANGES" "Android build=$BUILD" "Android tests=$TESTS" "Android Maestro=$MAESTRO"

  # Quarantine, the Android part (E002 #1363, ADR-025 amendment of 12 November 2026, TESTING.md §8). A flaky test on
  # quarantine/compose.txt (the Android unit tests and the Compose UI tests) or quarantine/maestro.txt (a Maestro flow) is left
  # out of "Android tests" and "Android Maestro" (android.sh and maestro.sh read the lists), and this job, which
  # is NOT a required check and must never become one, runs exactly the listed tests, so their results stay visible and the
  # fix can show it works here. It passes when the lists are empty, and then does nothing but read them: no SDK, no emulator, no
  # web build. A failing listed test fails this job and no other. Like the other native test suites it does not run on a push to
  # main. FIVVI_QUARANTINE=only selects the listed tests.
  quarantine-android:
    name: Quarantine (Android)
    # No native test suite runs on a push to main ("Android tests", "Android Maestro"): the lists are read on the other events.
    # Both lists hold UI tests (the Compose UI tests and the Maestro flows): with `ci: fast` (ADR-034) they run only in the
    # nightly run and on demand. The job waits for no other job, so it reads the switch itself (the first step), and a run
    # without UI tests ends there with both lists left out.
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    continue-on-error: ${{ github.event_name == 'push' }}
    # The step timeouts below are literal on every event and add up to 95 (install 5, SDK setup 15, boot 10, Compose 25, debug
    # app 10, Maestro 30), so the job's 120 holds them with about 5 minutes outside the steps: a hung listed test ends as a
    # failed step, never as a job the timeout cancels. Nothing waits for this job, so no chain of timeouts (ADR-018) includes it.
    # NEVER RED, as the Quarantine job (ci.yml, above): every step after the lists is continue-on-error, and the last step
    # reports the Compose and Maestro results in the job summary and as warnings (a red check holds back the merge gate).
    timeout-minutes: 120
    env:
      FIVVI_QUARANTINE: only
      # The port the debug app for Maestro has baked in (scripts/android.sh maestro-apk).
      E2E_PORT: '3100'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Runs before any install, on the Node the runner has (scripts/quarantine-android.mjs imports nothing else).
      - id: lists
        name: Read the quarantine lists
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          compose="$(node scripts/quarantine-android.mjs count compose)"
          maestro="$(node scripts/quarantine-android.mjs count maestro)"
          # Both lists hold UI tests: they run only in a run with UI tests (ADR-034): `ci: full`, or `ci: fast` in the nightly
          # run and on demand (scripts/pipeline.sh ui-tests, the rule of "Detect changes"). A switch that cannot be read, or an unknown value, leaves them out.
          ui_tests="$(scripts/pipeline.sh ui-tests --event "$EVENT" 2>/dev/null || echo false)"
          left_out=0
          if [[ "$ui_tests" != 'true' ]]; then left_out=$((compose + maestro)); compose=0; maestro=0; fi
          {
            echo "compose=$compose"
            echo "maestro=$maestro"
            if [[ "$compose" != '0' || "$maestro" != '0' ]]; then echo 'any=true'; else echo 'any=false'; fi
          } >>"$GITHUB_OUTPUT"
          {
            echo '### Quarantine (Android)'
            echo "- Compose: $compose listed test(s)"
            echo "- Maestro: $maestro listed flow(s)"
            if [[ "$left_out" != '0' ]]; then echo "$left_out listed UI test(s) run in the nightly run only: this run has no UI tests (ADR-034)."; fi
            if [[ "$compose" == '0' && "$maestro" == '0' && "$left_out" == '0' ]]; then echo 'Nothing is quarantined: nothing to run.'; fi
          } >>"${GITHUB_STEP_SUMMARY:-/dev/null}"

      # The emulator creates a 6 GB data partition on its first boot and needs 7.4 GB free for it; Gradle and the web build
      # need more. These preinstalled toolchains aren't used by this job.
      - name: Free disk space
        if: steps.lists.outputs.any == 'true'
        continue-on-error: true
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.lists.outputs.maestro != '0'
        continue-on-error: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.lists.outputs.maestro != '0'
        continue-on-error: true
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Gradle builds the app, and Maestro needs a JDK.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.lists.outputs.any == 'true'
        continue-on-error: true
        with:
          distribution: temurin
          java-version: '21'

      # Caches Gradle's dependencies and wrapper; main's cache is readable by every PR.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: steps.lists.outputs.any == 'true'
        continue-on-error: true

      - name: Enable KVM
        if: steps.lists.outputs.any == 'true'
        continue-on-error: true
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm || true
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo '::error::/dev/kvm is not usable by the runner user'
            exit 1
          fi

      - name: Install dependencies
        if: steps.lists.outputs.maestro != '0'
        continue-on-error: true
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile

      # Reuses the web build from the latest "Checks (Linux)" cache when nothing changed. Restore only.
      - name: Restore turbo cache
        if: steps.lists.outputs.maestro != '0'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo/cache
            apps/web/.next/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Android SDK packages, emulator and Maestro
        if: steps.lists.outputs.any == 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: scripts/android.sh setup

      - id: avd
        name: Emulator cache key
        if: steps.lists.outputs.any == 'true'
        continue-on-error: true
        run: echo "key=$(scripts/android.sh avd-key)" >> "$GITHUB_OUTPUT"

      # The AVD with the snapshot of its booted state, the same key as "Android tests" (see there): restored, never saved by
      # this job, whose emulator is a copy of theirs.
      - name: Restore the emulator
        if: steps.lists.outputs.any == 'true'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.android/avd
          key: avd-v2-${{ runner.os }}-${{ steps.avd.outputs.key }}

      - name: Boot the emulator
        if: steps.lists.outputs.any == 'true'
        continue-on-error: true
        timeout-minutes: 10
        env:
          AVD_SNAPSHOT: '1'
          EMULATOR_BOOT_TIMEOUT: '480'
        run: scripts/android.sh emulator

      # The listed unit tests, then the listed Compose UI tests on the emulator.
      - name: Compose, the listed tests only
        id: compose
        if: steps.lists.outputs.compose != '0'
        continue-on-error: true
        timeout-minutes: 25
        run: scripts/android.sh quarantine

      # The debug app with the API address of this job's web server, then the listed flows in nl-NL and en. A failed Compose
      # step does not skip the flows: the job reports every listed test that fails.
      - name: Debug app for Maestro
        id: apk
        if: ${{ !cancelled() && steps.lists.outputs.maestro != '0' }}
        continue-on-error: true
        timeout-minutes: 10
        run: scripts/android.sh maestro-apk

      - name: Maestro, the listed flows only
        id: flows
        if: ${{ !cancelled() && steps.lists.outputs.maestro != '0' }}
        continue-on-error: true
        timeout-minutes: 30
        run: scripts/maestro.sh android --apk

      - name: Stop the emulator
        if: ${{ always() && steps.lists.outputs.any == 'true' }}
        continue-on-error: true
        run: scripts/android.sh stop

      - name: Upload Quarantine (Android) reports
        if: ${{ always() && steps.lists.outputs.any == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-quarantine-reports
          path: |
            apps/android/app/build/reports/
            apps/android/client/build/reports/
            apps/android/app/build/outputs/androidTest-results/
            apps/android/build/emulator.log*
            e2e/maestro/build/
          retention-days: 7
          if-no-files-found: ignore

      # The result of the job: a failing runner is a warning and a line in the summary, never a failed check (see the top).
      - name: Report the quarantined tests
        if: ${{ !cancelled() && steps.lists.outputs.any == 'true' }}
        continue-on-error: true
        env:
          COMPOSE_LISTED: ${{ steps.lists.outputs.compose }}
          COMPOSE: ${{ steps.compose.outcome }}
          MAESTRO_LISTED: ${{ steps.lists.outputs.maestro }}
          APK: ${{ steps.apk.outcome }}
          FLOWS: ${{ steps.flows.outcome }}
        run: |
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo '### Quarantine (Android)' >>"$summary"
          # report <runner> <listed> <outcome of the tests>: the steps before them (SDK, emulator) failing shows as a failed run
          report() {
            local runner="$1" listed="$2" outcome="$3"
            if [[ "$listed" == '0' ]]; then
              echo "- $runner: nothing listed" >>"$summary"
            elif [[ "$outcome" == 'success' ]]; then
              echo "- $runner: all $listed quarantined test(s) passed" >>"$summary"
            else
              echo "- $runner: **$listed listed, and the run did not pass ($outcome)**: a quarantined test failed, or the run could not start; see the steps and the android-quarantine-reports artifact" >>"$summary"
              echo "::warning title=Quarantine ($runner)::the listed tests of $runner did not pass ($outcome); the check stays green: a quarantined test never blocks. See the steps of this job"
            fi
          }
          flows="$FLOWS"
          if [[ "$MAESTRO_LISTED" != '0' && "$APK" != 'success' ]]; then flows="$APK"; fi
          report Compose "$COMPOSE_LISTED" "$COMPOSE"
          report Maestro "$MAESTRO_LISTED" "$flows"

  # The report of the nightly run (ADR-034): the UI tests run here every night, on main, and nobody watches the run. When a
  # job of it failed or was cancelled, this opens the bug issue "Nightly UI tests failed" (bug, ready-for-agent; the factory
  # builds it before the other tickets), or comments on the open one (scripts/nightly-report.sh). It runs only on the schedule,
  # after every other job whatever became of them (`always()`), and is the only job with `issues: write`. The issue holds the
  # run's address and the names of the failing jobs; no log and no user data. Not a required check.
  nightly-report:
    name: Nightly report
    needs:
      - changes
      - checks
      - e2e
      - quarantine
      - ios-build
      - ios-build-retry
      - ios-tests
      - ios-tests-plan
      - ios-tests-retry
      - ios
      - android-build
      - android-tests
      - android-maestro
      - android
      - quarantine-android
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    continue-on-error: ${{ github.event_name == 'push' }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # scripts/nightly-report.sh reads the names of this run's jobs
      issues: write # opens or comments on "Nightly UI tests failed"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open or update the issue of a failed nightly run
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
        run: scripts/nightly-report.sh
