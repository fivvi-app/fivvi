# CI for every pull request, every push to main and every merge group of the merge queue (E002, E010), and on demand
# (workflow_dispatch). The queue tests a PR on top of the latest main on a temporary gh-readonly-queue/main/* branch;
# the required checks must report there too, or the queue never merges (ADR-018).
#
# The job names ("Detect changes", "Checks (Linux)", "E2E (Linux)", "iOS",
# "Android") are the intended required checks; see docs/engineering/WORKFLOW.md §7. Renaming a job
# renames its check, so update WORKFLOW.md in the same PR. "iOS" and "Android" are gate jobs (#293): each needs its parts
# (a build job and the test jobs) and reports their combined result through scripts/native-gate.sh, so the required
# names stay while the parts change; a gate is skipped, and passes as skipped, when "Detect changes" says the app's
# inputs did not change. Every job runs when something it depends on changed, and only then (scripts/affected.mjs,
# scripts/native-jobs.sh; ADR-024).
#
# New static checks (i18n parity, OpenAPI drift, ...) are added as a `check`
# script in the package that owns them. Turbo picks them up; no change here.

name: CI

on:
  pull_request:
  # The native jobs still run on a push to main when native paths changed (scripts/native-jobs.sh): main's caches
  # (Gradle, the AVD snapshot, DerivedData) are written only by these runs, and a PR and a merge group read only main's
  # and their own (E002 #242).
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]
  # On demand (`gh workflow run CI --ref <branch>`). ios_retry proves the iOS retry path (see the iOS jobs below): it
  # skips the macos-15 jobs and runs the retry on macos-15-intel for both languages, as if no arm64 runner had picked
  # them up (`gh workflow run CI --ref <branch> -f ios_retry=true`).
  workflow_dispatch:
    inputs:
      ios_retry:
        description: Run iOS on the retry pool (macos-15-intel) only, as if no macos-15 runner had picked the jobs up (#413)
        type: boolean
        default: false

# A new push to a PR cancels the run for the previous push. Runs on main are never cancelled, so every merged commit
# keeps its own result; nor are runs of merge groups, which the queue waits for.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TZ: UTC
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      android: ${{ steps.filter.outputs.android }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A PR checkout is a merge commit whose first parent is the base branch.
          fetch-depth: 2
          persist-credentials: false

      - id: filter
        name: Filter paths
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          # A merge group's parent commit: main as the queue saw it. Empty on the other events.
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          RUN_NATIVE: ${{ contains(github.event.pull_request.labels.*.name, 'run-native') }}
        run: |
          set -euo pipefail

          # The commit to compare with: a PR's base branch, the push's previous head, or the base commit of the
          # merge group (every queued PR's commits sit on top of it).
          prior="$BEFORE"
          if [[ "$EVENT" == 'merge_group' ]]; then prior="$MERGE_BASE"; fi

          base=''
          if [[ "$EVENT" == 'pull_request' ]]; then
            base='HEAD^1'
          elif [[ -n "$prior" && ! "$prior" =~ ^0+$ ]]; then
            if git cat-file -e "$prior^{commit}" 2>/dev/null \
              || git fetch --no-tags --depth=1 origin "$prior"; then
              base="$prior"
            fi
          fi

          if [[ -n "$base" ]]; then
            changed="$(git diff --no-renames --name-only "$base" HEAD)"
          else
            echo 'No base commit to compare with; treating every path as changed.'
            changed="$(git ls-files)"
          fi

          # Which native jobs run (scripts/native-jobs.sh): those whose paths changed. That holds on a push to main,
          # which writes the caches every PR reads, and in a merge group, whose caches only its own queue branch reads.
          # workflow_dispatch and the PR's run-native label (read on its pushes) force them.
          args=(--event "$EVENT")
          if [[ "$RUN_NATIVE" == 'true' ]]; then args+=(--run-native); fi
          scripts/native-jobs.sh "${args[@]}" <<<"$changed" >>"$GITHUB_OUTPUT"

          # Whether the Linux E2E job runs (scripts/affected.mjs, the decision scripts/check.sh makes too): only when the
          # web app or a package it depends on changed, or on demand. Why it skips is in the log and the job summary.
          affected_args=()
          if [[ "$EVENT" == 'workflow_dispatch' || "$RUN_NATIVE" == 'true' ]]; then affected_args+=(--force); fi
          reasons="$(mktemp)"
          node scripts/affected.mjs ${affected_args[@]+"${affected_args[@]}"} <<<"$changed" 2>"$reasons" | grep '^e2e=' >>"$GITHUB_OUTPUT"
          cat "$reasons"
          { echo '### What this change affects'; sed 's/^/- /' "$reasons"; } >>"${GITHUB_STEP_SUMMARY:-/dev/null}"

  checks:
    name: Checks (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Integration tests run against real Postgres, the same major version as
    # compose.yaml and Railway (TESTING.md §5.3). Tests create their own databases.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: fivvi
          POSTGRES_PASSWORD: fake-local-db-password
          POSTGRES_DB: fivvi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fivvi -d fivvi"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://fivvi:fake-local-db-password@localhost:5432/fivvi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the version from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # `pnpm lint:root` runs shellcheck, and its findings differ per version: the runner's preinstalled one flagged
      # what the local one didn't. The version and checksums are pinned in scripts/_shellcheck.sh, the same file
      # scripts/bootstrap.sh uses; the cache key follows that file, so a bump downloads the new release.
      - name: Restore shellcheck
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: shellcheck-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/_shellcheck.sh') }}

      - name: Install the pinned shellcheck
        run: |
          source scripts/_lib.sh
          source scripts/_shellcheck.sh
          install_shellcheck
          echo "$SHELLCHECK_HOME" >>"$GITHUB_PATH"
          export PATH="$SHELLCHECK_HOME:$PATH"
          shellcheck --version
          [[ "$(shellcheck_version)" == "$SHELLCHECK_VERSION" ]] || { echo "shellcheck is not $SHELLCHECK_VERSION"; exit 1; }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turbo's local cache, plus Next.js's own build cache for turbo misses.
      # Main's cache is readable by every PR; a PR's cache only by that PR.
      - name: Restore turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo/cache
            apps/web/.next/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # The contract drift check (packages/contract) builds swift-openapi-generator and downloads
      # the openapi-generator jar when turbo has no cached result for it. The pipeline keeps both
      # in node_modules/.cache/contract and reuses them when their names match: the binary per
      # `swift --version` + Package.swift + Package.resolved, the jar per pinned version. Exact key
      # only, so a generator bump starts from an empty directory and old tools don't pile up.
      - name: Read Swift version
        id: swift
        run: echo "version=$(swift --version | sed -nE 's/.*Swift version ([0-9.]+).*/\1/p')" >>"$GITHUB_OUTPUT"

      - name: Restore the contract generators
        id: contract-generators
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/contract/node_modules/.cache/contract
          key: contract-generators-${{ runner.os }}-swift${{ steps.swift.outputs.version }}-${{ hashFiles('packages/contract/tools/swift-generator/Package.swift', 'packages/contract/tools/swift-generator/Package.resolved', 'packages/contract/config/openapi-generator.json') }}

      # One turbo run so independent tasks run in parallel. A failing task
      # doesn't stop the unrelated ones, so one run reports every failure.
      - name: Lint, typecheck, unit and integration tests, build, format and static checks
        run: >-
          pnpm exec turbo run lint typecheck test test:integration build format:check check
          --cache-dir=.turbo/cache
          --continue=dependencies-successful

      # Saved even when another task fails, so a freshly built generator isn't lost; only on a
      # miss, and only once the check has produced both tools (not when turbo reused its result).
      - name: Save the contract generators
        if: >-
          always()
          && steps.contract-generators.outputs.cache-hit != 'true'
          && hashFiles('packages/contract/node_modules/.cache/contract/swift-openapi-generator-*', '!**/*.partial') != ''
          && hashFiles('packages/contract/node_modules/.cache/contract/openapi-generator-cli-*.jar') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/contract/node_modules/.cache/contract
          key: ${{ steps.contract-generators.outputs.cache-primary-key }}

  e2e:
    name: E2E (Linux)
    needs: changes
    # Only when the web app or a package it depends on is affected (scripts/affected.mjs); otherwise this required check
    # passes as skipped, and "Detect changes" says why.
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The e2e servers each create and migrate their own database on it (apps/web/e2e/serve.ts).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: fivvi
          POSTGRES_PASSWORD: fake-local-db-password
          POSTGRES_DB: fivvi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fivvi -d fivvi"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://fivvi:fake-local-db-password@localhost:5432/fivvi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Reuses the build from the latest "Checks (Linux)" cache when nothing changed.
      # Restore only: that job saves the cache.
      - name: Restore turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo/cache
            apps/web/.next/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @fivvi/web exec playwright --version | awk '{print $2}')" >>"$GITHUB_OUTPUT"

      # Browsers are cached per Playwright version; the OS packages they need are not
      # cacheable, so they are installed on every run.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium and its OS packages
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @fivvi/web exec playwright install --with-deps --only-shell chromium

      - name: Install Chromium's OS packages
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @fivvi/web exec playwright install-deps chromium

      # Builds the web app, then runs every spec in nl-NL and en with axe checks.
      - name: Web e2e (nl-NL and en)
        run: pnpm exec turbo run test:e2e --cache-dir=.turbo/cache

      # Only on failure: artifact storage counts against the free quota.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore


  # iOS (E008, E002, #293, #413). Per language a test job, a check and a retry, and the gate "iOS": one job builds once
  # and packs the test bundle, two jobs ("iOS tests (nl)" and "(en)") run the Dutch and the English test pass from it at
  # the same time, each on its own simulator (a cold run was 16 of 21 minutes of tests in a row). They start only when
  # the app, its generated inputs or its own scripts changed (in a PR, a merge group or a push to main), or on demand
  # (scripts/native-jobs.sh), to keep PR feedback fast. The UI tests run in both languages on every push. The image and
  # Xcode are pinned, so a runner update doesn't change the toolchain.
  #
  # The image (E002 #242): macos-15, not macos-26, whose runners queued about 10 minutes in two runs. The app needs
  # no Xcode 26: Swift 6.0 mode, swift-tools-version 6.0 packages, project format 77 and iOS 17 as the deployment
  # target all build with Xcode 16. macos-15 has Xcode 16.0 to 16.4 and 26.0.1 to 26.3 (not 26.5 or 26.6, which only
  # macos-26 has), so this takes 26.3, the newest, to stay on the Xcode 26 line of local runs (iOS 26.2 simulator
  # instead of 26.5). If the job fails here but not on macos-26, or its queue isn't shorter, go back to macos-26 and
  # Xcode_26.6.
  #
  # No runner (#413): GitHub's hosted macOS arm64 capacity runs short at times. A job that no runner picks up is
  # cancelled after about 15 minutes ("The job was not acquired by Runner of type hosted even after multiple
  # attempts"), with no runner and no step, and used to fail the required check although no test ran. Per language,
  # "iOS parts (<language>)" reads the run's jobs (scripts/ios-parts.sh) and tells that apart from a timeout or a
  # failure: the language is tried again on macos-15-intel, a pool with its own capacity (x64; the same Xcode 26.3 and
  # iOS 26.2 simulator, per the runner-images readme), as "iOS tests retry (<language>)": it builds for itself (a
  # bundle built on arm64 doesn't run on x64) and runs the same tests of that language. When the build had no runner
  # both languages are retried, side by side. A language's check and retry need only the build and that language's own
  # tests job, never the other language's: the other language's tests may still run for 25 minutes, and the retry must
  # not wait for them (run 41518844693: 31 minutes were gone before any retry when it did). The gate counts each retry's
  # result in place of the missing part and says in its error, per part, whether a runner never picked it up or a build
  # or test failed (scripts/native-gate.sh). A build or test that fails on a runner is never retried. Nothing is
  # skipped: every language still runs the same tests on every push.
  #
  # Forced run: `gh workflow run CI --ref <branch> -f ios_retry=true` skips ios-build and the test jobs and runs only
  # the retry, for both languages, to prove that path in CI (#413 AC2).
  #
  # The budget against the merge queue's check timeout of 60 minutes (ADR-018), by the timeouts of the jobs:
  #  - the build finds no runner: Detect changes (5) + the wait for a runner that never comes (about 15, GitHub's) + an
  #    "iOS parts" job (2) + the retry (35, both languages side by side) + the gate (2) = 59. It fits, with a minute left.
  #  - one language finds no runner after the build: Detect changes (5) + the build (up to 25; about 3 to 10 measured) +
  #    the wait (about 15) + iOS parts (2) + the retry (up to 35; it builds cold on x64 first) + the gate (2) = 59 plus
  #    the build's time: 62 to 69 by measured builds, and 84 by timeouts. That can pass 60. Measured times are in the PR
  #    of #413; a retry that ends in about 25 to 30 minutes fits. If the measured chain does not fit, the owner raises
  #    check_response_timeout_minutes of the merge_queue rule in .github/rulesets/main.json and applies it with
  #    scripts/github-settings.sh apply (not changed here: the ruleset is a guardrail file).
  ios-build:
    name: iOS build
    needs: changes
    # ios_retry (workflow_dispatch) runs only the retry pool; it is empty on any other event.
    if: needs.changes.outputs.ios == 'true' && inputs.ios_retry != true
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read # scripts/step-timings.sh reads this run's step durations
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: xcode
        name: Xcode version
        run: echo "version=$(xcodebuild -version | tr -s ' \n' '--' | sed 's/-$//')" >> "$GITHUB_OUTPUT"

      # DerivedData, with the compiled Swift packages (sentry-cocoa takes minutes to build), and the packages
      # themselves. Keyed by Package.resolved, the Xcode version, the runner OS and the run: every run saves what it
      # built (an exact hit is never saved again, so a key without the run would freeze the cache at the first
      # build) and restores the newest one through the restore keys, the same Package.resolved first. A stale cache
      # only costs build time and never changes a result. A PR can read its own caches and main's; main's are
      # written by the pushes that change native paths, so a PR's first run is warm once main has run it. The
      # manifest of the sources' modification times (scripts/ios-mtimes.mjs) is part of it. The index store is left
      # out: nothing in a build reads it, and it is a large part of the payload. GitHub keeps a repository's caches
      # to 10 GB, evicts the least recently used first, and removes any not read for 7 days.
      - name: Cache the iOS build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/ios/.build/DerivedData
            apps/ios/.build/SourcePackages
            apps/ios/.build/source-mtimes.json
            !apps/ios/.build/DerivedData/Logs
            !apps/ios/.build/DerivedData/Index.noindex
          key: ios-build-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('apps/ios/FivviPro.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ios-build-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('apps/ios/FivviPro.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
            ios-build-${{ runner.os }}-${{ steps.xcode.outputs.version }}-

      # Xcode decides what to compile by the modification time of the inputs, and a checkout gives every file the
      # time of the checkout: the restored DerivedData above was thrown away by a build that found every source "changed"
      # (about 90 s of Swift and 50 s of asset catalog every run). The files whose content is the cached build's get
      # their old time back; the ones that changed keep the new time and are compiled (#293 AC15).
      - name: Restore the sources' modification times
        run: node scripts/ios-mtimes.mjs restore

      # The same steps as `pnpm test:ios` up to the build (apps/ios/README.md#tests): SwiftLint, the checks, one
      # build-for-testing; then it packs the test bundle. Prints the build timing summary.
      - name: SwiftLint, checks and build for testing
        run: scripts/test-ios.sh build

      - name: Record the sources' modification times
        run: node scripts/ios-mtimes.mjs save

      # What the two test jobs run: the .xctestrun and the build products, packed in a tar to keep the file modes.
      - name: Upload the test bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-bundle
          path: apps/ios/.build/ios-test-bundle.tar
          # .build is a hidden folder, which the action skips by default (#290).
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

      # Only on failure: artifact storage counts against the free quota.
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-build-log
          path: apps/ios/.build/build-for-testing.log
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

      - name: Step durations
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/step-timings.sh

  ios-tests-nl:
    name: iOS tests (nl)
    needs: ios-build
    runs-on: macos-15
    # A healthy run takes 10-16 min (the simulator settle is about 2.5). A test that hangs fails after its own allowance
    # (scripts/test-ios.sh), so this is the backstop. Without a retry, Detect changes (5) + iOS build (25) + this + the
    # report job (2) stay under the merge queue's check timeout of 60 (ADR-018). A job that no runner picks up waits
    # about 15 minutes (GitHub's limit, not this timeout) and the retry follows it: the budget of that chain is in the
    # comment on the iOS jobs above (#413). One job per language, not a matrix, so a language's retry never waits for
    # the other language's tests; the two are the same except for the language.
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read # scripts/step-timings.sh reads this run's step durations
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the test bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-test-bundle
          path: apps/ios/.build

      # The unit and UI tests of this language, from the bundle of "iOS build", without building again, on this job's own
      # simulator. Prints the slowest tests.
      - name: Unit and UI tests (nl)
        run: scripts/test-ios.sh test nl

      # Only on failure, or when the timeout cancels the job (#305) in a run that nothing supersedes (a pull request
      # run is cancelled by the next push): artifact storage counts against the free quota.
      - name: Upload test results
        if: failure() || (cancelled() && github.event_name != 'pull_request')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-results-nl
          path: apps/ios/.build/TestResults-*.xcresult
          # .build is a hidden folder, which the action skips by default (#290). Only these paths are named.
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

      - name: Step durations
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/step-timings.sh

  ios-tests-en:
    name: iOS tests (en)
    needs: ios-build
    runs-on: macos-15
    # A healthy run takes 10-16 min (the simulator settle is about 2.5). A test that hangs fails after its own allowance
    # (scripts/test-ios.sh), so this is the backstop. The budget is on "iOS tests (nl)"; this job is the same for en.
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read # scripts/step-timings.sh reads this run's step durations
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the test bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-test-bundle
          path: apps/ios/.build

      # The unit and UI tests of this language, from the bundle of "iOS build", without building again, on this job's own
      # simulator. Prints the slowest tests.
      - name: Unit and UI tests (en)
        run: scripts/test-ios.sh test en

      # Only on failure, or when the timeout cancels the job (#305) in a run that nothing supersedes (a pull request
      # run is cancelled by the next push): artifact storage counts against the free quota.
      - name: Upload test results
        if: failure() || (cancelled() && github.event_name != 'pull_request')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-results-en
          path: apps/ios/.build/TestResults-*.xcresult
          # .build is a hidden folder, which the action skips by default (#290). Only these paths are named.
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

      - name: Step durations
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/step-timings.sh

  # What became of the build and of the nl tests (#413): did a hosted runner pick them up. Cheap, on Linux, and always
  # runs (not when the run is cancelled, so a run that a newer push cancelled is never read as "no runner"). It needs
  # only the build and the nl tests job, so the nl retry never waits for the other language.
  ios-parts-nl:
    name: iOS parts (nl)
    needs: [changes, ios-build, ios-tests-nl]
    if: ${{ !cancelled() && needs.changes.outputs.ios == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read # scripts/ios-parts.sh reads this run's jobs
    outputs:
      build: ${{ steps.parts.outputs.build }}
      tests: ${{ steps.parts.outputs.tests }}
      retry: ${{ steps.parts.outputs.retry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: parts
        name: Did a runner pick up the build and the nl tests
        env:
          GH_TOKEN: ${{ github.token }}
          # Set only by the run on demand with ios_retry; empty otherwise.
          IOS_RETRY: ${{ inputs.ios_retry == true && 'true' || '' }}
        run: scripts/ios-parts.sh nl ${IOS_RETRY:+--force} >> "$GITHUB_OUTPUT"

  # What became of the build and of the en tests (#413): did a hosted runner pick them up. Cheap, on Linux, and always
  # runs (not when the run is cancelled, so a run that a newer push cancelled is never read as "no runner"). It needs
  # only the build and the en tests job, so the en retry never waits for the other language.
  ios-parts-en:
    name: iOS parts (en)
    needs: [changes, ios-build, ios-tests-en]
    if: ${{ !cancelled() && needs.changes.outputs.ios == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read # scripts/ios-parts.sh reads this run's jobs
    outputs:
      build: ${{ steps.parts.outputs.build }}
      tests: ${{ steps.parts.outputs.tests }}
      retry: ${{ steps.parts.outputs.retry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: parts
        name: Did a runner pick up the build and the en tests
        env:
          GH_TOKEN: ${{ github.token }}
          # Set only by the run on demand with ios_retry; empty otherwise.
          IOS_RETRY: ${{ inputs.ios_retry == true && 'true' || '' }}
        run: scripts/ios-parts.sh en ${IOS_RETRY:+--force} >> "$GITHUB_OUTPUT"

  # The retry of the nl tests when the build or they had no runner (#413), on macos-15-intel: a separate pool of hosted
  # runners, so the capacity that ran out for arm64 is not the one it waits for. It builds for itself, as
  # `scripts/test-ios.sh build` and then `test nl` do in the jobs above, so it needs no bundle from another
  # architecture. It starts as soon as "iOS parts (nl)" says so, whatever the other language is doing. The budget is in
  # the comment on the iOS jobs above.
  ios-retry-nl:
    name: iOS tests retry (nl)
    needs: ios-parts-nl
    if: ${{ !cancelled() && needs.ios-parts-nl.result == 'success' && needs.ios-parts-nl.outputs.retry == 'true' }}
    runs-on: macos-15-intel
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read # scripts/step-timings.sh reads this run's step durations
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: xcode
        name: Xcode version
        run: echo "version=$(xcodebuild -version | tr -s ' \n' '--' | sed 's/-$//')" >> "$GITHUB_OUTPUT"

      # As in "iOS build", with a key of its own: a build for x64 is not one for arm64. It is written only by a retry
      # (rare), and GitHub removes a cache not read for 7 days, so most retries build cold. When both languages are
      # retried they save the same key; the second one finds it taken and goes on.
      - name: Cache the iOS build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/ios/.build/DerivedData
            apps/ios/.build/SourcePackages
            apps/ios/.build/source-mtimes.json
            !apps/ios/.build/DerivedData/Logs
            !apps/ios/.build/DerivedData/Index.noindex
          key: ios-retry-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('apps/ios/FivviPro.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ios-retry-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('apps/ios/FivviPro.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
            ios-retry-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-

      - name: Restore the sources' modification times
        run: node scripts/ios-mtimes.mjs restore

      - name: SwiftLint, checks and build for testing
        run: scripts/test-ios.sh build

      - name: Record the sources' modification times
        run: node scripts/ios-mtimes.mjs save

      # The same command as "iOS tests", from the bundle this job just built.
      - name: Unit and UI tests (nl)
        run: scripts/test-ios.sh test nl

      # Only on failure, or when the timeout cancels the job (#305) in a run that nothing supersedes.
      - name: Upload test results
        if: failure() || (cancelled() && github.event_name != 'pull_request')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-retry-test-results-nl
          path: |
            apps/ios/.build/TestResults-*.xcresult
            apps/ios/.build/build-for-testing.log
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

      - name: Step durations
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/step-timings.sh

  # The retry of the en tests when the build or they had no runner (#413), on macos-15-intel: a separate pool of hosted
  # runners, so the capacity that ran out for arm64 is not the one it waits for. It builds for itself, as
  # `scripts/test-ios.sh build` and then `test en` do in the jobs above, so it needs no bundle from another
  # architecture. It starts as soon as "iOS parts (en)" says so, whatever the other language is doing. The budget is in
  # the comment on the iOS jobs above.
  ios-retry-en:
    name: iOS tests retry (en)
    needs: ios-parts-en
    if: ${{ !cancelled() && needs.ios-parts-en.result == 'success' && needs.ios-parts-en.outputs.retry == 'true' }}
    runs-on: macos-15-intel
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read # scripts/step-timings.sh reads this run's step durations
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: xcode
        name: Xcode version
        run: echo "version=$(xcodebuild -version | tr -s ' \n' '--' | sed 's/-$//')" >> "$GITHUB_OUTPUT"

      # As in "iOS build", with a key of its own: a build for x64 is not one for arm64. It is written only by a retry
      # (rare), and GitHub removes a cache not read for 7 days, so most retries build cold. When both languages are
      # retried they save the same key; the second one finds it taken and goes on.
      - name: Cache the iOS build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/ios/.build/DerivedData
            apps/ios/.build/SourcePackages
            apps/ios/.build/source-mtimes.json
            !apps/ios/.build/DerivedData/Logs
            !apps/ios/.build/DerivedData/Index.noindex
          key: ios-retry-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('apps/ios/FivviPro.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ios-retry-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('apps/ios/FivviPro.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
            ios-retry-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-

      - name: Restore the sources' modification times
        run: node scripts/ios-mtimes.mjs restore

      - name: SwiftLint, checks and build for testing
        run: scripts/test-ios.sh build

      - name: Record the sources' modification times
        run: node scripts/ios-mtimes.mjs save

      # The same command as "iOS tests", from the bundle this job just built.
      - name: Unit and UI tests (en)
        run: scripts/test-ios.sh test en

      # Only on failure, or when the timeout cancels the job (#305) in a run that nothing supersedes.
      - name: Upload test results
        if: failure() || (cancelled() && github.event_name != 'pull_request')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-retry-test-results-en
          path: |
            apps/ios/.build/TestResults-*.xcresult
            apps/ios/.build/build-for-testing.log
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

      - name: Step durations
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/step-timings.sh

  # The required check "iOS": the combined result of the build and both test passes (AC17), with the retry's result in
  # place of a part that no runner picked up (#413); skipped, and so passing, when the native decision says the app's
  # inputs didn't change. A part's state comes from "iOS parts" of its language (its result, or unacquired); if that job
  # failed, the plain results of the jobs are used, and an unacquired part then fails the check. The build is counted
  # with the retries of both languages, which build for themselves.
  ios:
    name: iOS
    needs: [changes, ios-build, ios-tests-nl, ios-tests-en, ios-parts-nl, ios-parts-en, ios-retry-nl, ios-retry-en]
    if: always() && needs.changes.outputs.ios == 'true'
    runs-on: ubuntu-24.04
    # Only reads the results of the jobs it needs; short, so the chain of a native check stays under the queue timeout.
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Combined result of the iOS jobs
        env:
          BUILD: ${{ needs.ios-parts-nl.outputs.build || needs.ios-parts-en.outputs.build || needs.ios-build.result }}
          NL: ${{ needs.ios-parts-nl.outputs.tests || needs.ios-tests-nl.result }}
          EN: ${{ needs.ios-parts-en.outputs.tests || needs.ios-tests-en.result }}
          RETRY_NL: ${{ needs.ios-retry-nl.result }}
          RETRY_EN: ${{ needs.ios-retry-en.result }}
        run: |
          scripts/native-gate.sh iOS true \
            "iOS build=$BUILD:$RETRY_NL+$RETRY_EN" \
            "iOS tests (nl)=$NL:$RETRY_NL" \
            "iOS tests (en)=$EN:$RETRY_EN"

  # Android (E008, #293). The same commands as locally (TESTING.md §7.2), in three jobs and the gate "Android": "Android
  # build" (ktlint and the other checks, the debug build, and the debug app for Maestro, uploaded), "Android tests" (unit
  # tests and the Compose UI tests on an emulator; builds what it tests itself, so it runs next to the build job) and
  # "Android Maestro" (the flows in nl-NL and en on an emulator, from the uploaded app). The emulator needs KVM.
  android-build:
    name: Android build
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # scripts/step-timings.sh reads this run's step durations
    env:
      # The debug app for Maestro has the address of the web server of the Maestro job baked in: the same port in both.
      E2E_PORT: '3100'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # Caches Gradle's dependencies and wrapper; main's cache is readable by every PR.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Android SDK build tools
        run: scripts/android.sh setup --build-only

      - name: ktlint, checks and debug build
        timeout-minutes: 20
        run: scripts/android.sh build

      - name: Debug app for Maestro
        run: scripts/android.sh maestro-apk

      - name: Upload the debug app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-maestro-apk
          path: apps/android/build/maestro/app-debug.apk
          retention-days: 1
          if-no-files-found: error

      - name: Upload Android reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-build-reports
          path: apps/android/app/build/reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Step durations
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/step-timings.sh

  android-tests:
    name: Android tests
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read # scripts/step-timings.sh reads this run's step durations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The emulator creates a 6 GB data partition on its first boot and needs 7.4 GB free for it; Gradle
      # needs more. These preinstalled toolchains aren't used by this job.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # Caches Gradle's dependencies and wrapper; main's cache is readable by every PR.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm || true
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo '::error::/dev/kvm is not usable by the runner user'
            exit 1
          fi

      - name: Android SDK packages and emulator
        run: scripts/android.sh setup

      - id: avd
        name: Emulator cache key
        run: echo "key=$(scripts/android.sh avd-key)" >> "$GITHUB_OUTPUT"

      # The AVD with the snapshot of its booted state. Keyed by the system image, the emulator and the AVD settings
      # (a snapshot only loads on the same ones). Saved when the job passes on a miss, after the emulator has stopped.
      # A missing or broken snapshot is not an error: the boot below falls back to a cold boot. Bump the version (now v2) to drop every
      # cached AVD, and do it when a snapshot that no longer loads was replaced by a cold boot: the cache action never
      # overwrites an existing key, so the replacement isn't saved and every run would fall back to a cold boot. The
      # caches of a PR are its own and main's (written by pushes to main that change native paths).
      - name: Cache the emulator
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.android/avd
          key: avd-v2-${{ runner.os }}-${{ steps.avd.outputs.key }}

      # Booted once; verify reuses it. From the snapshot when it is cached, else cold: then the
      # script saves one. It gives up after EMULATOR_BOOT_TIMEOUT (a cold boot can take minutes) and prints the
      # emulator log; the step timeout is a backstop.
      - name: Boot the emulator
        timeout-minutes: 10
        env:
          AVD_SNAPSHOT: '1'
          EMULATOR_BOOT_TIMEOUT: '480'
        run: scripts/android.sh emulator

      - name: Unit tests, release bundle and Compose UI tests
        timeout-minutes: 25
        run: scripts/android.sh verify

      # The cache of the emulator is saved after this step: the emulator must not be running, or it would be copied in
      # mid-write.
      - name: Stop the emulator
        if: always()
        run: scripts/android.sh stop

      # Always, also after a cancel or timeout: without the emulator log a hung boot can't be diagnosed. Kept 7 days,
      # as artifact storage counts against the free quota.
      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-test-reports
          path: |
            apps/android/app/build/reports/
            apps/android/app/build/outputs/androidTest-results/
            apps/android/build/emulator.log*
          retention-days: 7
          if-no-files-found: ignore

      - name: Step durations
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/step-timings.sh

  android-maestro:
    name: Android Maestro
    needs: [changes, android-build]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # scripts/step-timings.sh reads this run's step durations
    env:
      # The port the debug app of "Android build" has baked in (scripts/android.sh maestro-apk).
      E2E_PORT: '3100'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The emulator creates a 6 GB data partition on its first boot and needs 7.4 GB free for it; Postgres and the web
      # build need more. These preinstalled toolchains aren't used by this job.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Maestro needs a JDK.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm || true
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo '::error::/dev/kvm is not usable by the runner user'
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Reuses the web build from the latest "Checks (Linux)" cache when nothing changed. Restore only.
      - name: Restore turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo/cache
            apps/web/.next/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Android SDK packages, emulator and Maestro
        run: scripts/android.sh setup

      - id: avd
        name: Emulator cache key
        run: echo "key=$(scripts/android.sh avd-key)" >> "$GITHUB_OUTPUT"

      # The AVD with the snapshot of its booted state (see "Android tests"): the same key, so a cache saved by one job is
      # read by the other.
      - name: Cache the emulator
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.android/avd
          key: avd-v2-${{ runner.os }}-${{ steps.avd.outputs.key }}

      - name: Boot the emulator
        timeout-minutes: 10
        env:
          AVD_SNAPSHOT: '1'
          EMULATOR_BOOT_TIMEOUT: '480'
        run: scripts/android.sh emulator

      - name: Download the debug app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-maestro-apk
          path: apps/android/build/maestro

      # Postgres (migrated and seeded), the fake Brevo server and the web server, then every flow in nl-NL and en, with the
      # app of "Android build" (nothing is built here).
      - name: Maestro flows (sign-in, anonymous and hello; nl-NL and en)
        timeout-minutes: 20
        run: scripts/maestro.sh android --apk

      # The cache of the emulator is saved after this step: the emulator must not be running, or it would be copied in
      # mid-write.
      - name: Stop the emulator
        if: always()
        run: scripts/android.sh stop

      - name: Upload Maestro reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-maestro-reports
          path: |
            apps/android/build/emulator.log*
            e2e/maestro/build/
          retention-days: 7
          if-no-files-found: ignore

      - name: Step durations
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/step-timings.sh

  # The required check "Android": the combined result of the build, the tests and Maestro (AC17); skipped, and so passing,
  # when the native decision says the app's inputs didn't change.
  android:
    name: Android
    needs: [changes, android-build, android-tests, android-maestro]
    if: always() && needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    # Only reads the results of the jobs it needs; short, so the chain of a native check stays under the queue timeout.
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Combined result of the Android jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: scripts/native-gate.sh Android true $RESULTS
