# CI for every pull request, every push to main and every merge group of the merge queue (E002, E010), and on demand
# (workflow_dispatch). The queue tests a PR on top of the latest main on a temporary gh-readonly-queue/main/* branch;
# the required checks must report there too, or the queue never merges (ADR-018).
#
# The job names ("Detect changes", "Checks (Linux)", "E2E (Linux)", "iOS",
# "Android") are the intended required checks; see docs/engineering/WORKFLOW.md §7. Renaming a job
# renames its check, so update WORKFLOW.md in the same PR.
#
# New static checks (i18n parity, OpenAPI drift, ...) are added as a `check`
# script in the package that owns them. Turbo picks them up; no change here.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]
  workflow_dispatch:

# A new push to a PR cancels the run for the previous push. Runs on main are never cancelled, so every merged commit
# keeps its own result; nor are runs of merge groups, which the queue waits for.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TZ: UTC
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A PR checkout is a merge commit whose first parent is the base branch.
          fetch-depth: 2
          persist-credentials: false

      - id: filter
        name: Filter paths
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          # A merge group's parent commit: main as the queue saw it. Empty on the other events.
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          RUN_NATIVE: ${{ contains(github.event.pull_request.labels.*.name, 'run-native') }}
        run: |
          set -euo pipefail

          # The commit to compare with: a PR's base branch, the push's previous head, or the base commit of the
          # merge group (every queued PR's commits sit on top of it).
          prior="$BEFORE"
          if [[ "$EVENT" == 'merge_group' ]]; then prior="$MERGE_BASE"; fi

          base=''
          if [[ "$EVENT" == 'pull_request' ]]; then
            base='HEAD^1'
          elif [[ -n "$prior" && ! "$prior" =~ ^0+$ ]]; then
            if git cat-file -e "$prior^{commit}" 2>/dev/null \
              || git fetch --no-tags --depth=1 origin "$prior"; then
              base="$prior"
            fi
          fi

          if [[ -n "$base" ]]; then
            changed="$(git diff --name-only "$base" HEAD)"
          else
            echo 'No base commit to compare with; treating every path as changed.'
            changed="$(git ls-files)"
          fi

          # Which native jobs run (scripts/native-jobs.sh): those whose paths changed. That holds on a push to main,
          # which writes the caches every PR reads, and in a merge group, whose caches only its own queue branch reads.
          # workflow_dispatch and the PR's run-native label (read on its pushes) force them.
          args=(--event "$EVENT")
          if [[ "$RUN_NATIVE" == 'true' ]]; then args+=(--run-native); fi
          scripts/native-jobs.sh "${args[@]}" <<<"$changed" >>"$GITHUB_OUTPUT"

  checks:
    name: Checks (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Integration tests run against real Postgres, the same major version as
    # compose.yaml and Railway (TESTING.md §5.3). Tests create their own databases.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: trainer_hub
          POSTGRES_PASSWORD: trainer_hub
          POSTGRES_DB: trainer_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trainer_hub -d trainer_hub"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://trainer_hub:trainer_hub@localhost:5432/trainer_hub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the version from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # `pnpm lint:root` runs shellcheck, and its findings differ per version: the runner's preinstalled one flagged
      # what the local one didn't. The version and checksums are pinned in scripts/_shellcheck.sh, the same file
      # scripts/bootstrap.sh uses; the cache key follows that file, so a bump downloads the new release.
      - name: Restore shellcheck
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: shellcheck-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/_shellcheck.sh') }}

      - name: Install the pinned shellcheck
        run: |
          source scripts/_lib.sh
          source scripts/_shellcheck.sh
          install_shellcheck
          echo "$SHELLCHECK_HOME" >>"$GITHUB_PATH"
          export PATH="$SHELLCHECK_HOME:$PATH"
          shellcheck --version
          [[ "$(shellcheck_version)" == "$SHELLCHECK_VERSION" ]] || { echo "shellcheck is not $SHELLCHECK_VERSION"; exit 1; }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turbo's local cache, plus Next.js's own build cache for turbo misses.
      # Main's cache is readable by every PR; a PR's cache only by that PR.
      - name: Restore turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo/cache
            apps/web/.next/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # The contract drift check (packages/contract) builds swift-openapi-generator and downloads
      # the openapi-generator jar when turbo has no cached result for it. The pipeline keeps both
      # in node_modules/.cache/contract and reuses them when their names match: the binary per
      # `swift --version` + Package.swift + Package.resolved, the jar per pinned version. Exact key
      # only, so a generator bump starts from an empty directory and old tools don't pile up.
      - name: Read Swift version
        id: swift
        run: echo "version=$(swift --version | sed -nE 's/.*Swift version ([0-9.]+).*/\1/p')" >>"$GITHUB_OUTPUT"

      - name: Restore the contract generators
        id: contract-generators
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/contract/node_modules/.cache/contract
          key: contract-generators-${{ runner.os }}-swift${{ steps.swift.outputs.version }}-${{ hashFiles('packages/contract/tools/swift-generator/Package.swift', 'packages/contract/tools/swift-generator/Package.resolved', 'packages/contract/config/openapi-generator.json') }}

      # One turbo run so independent tasks run in parallel. A failing task
      # doesn't stop the unrelated ones, so one run reports every failure.
      - name: Lint, typecheck, unit and integration tests, build, format and static checks
        run: >-
          pnpm exec turbo run lint typecheck test test:integration build format:check check
          --cache-dir=.turbo/cache
          --continue=dependencies-successful

      # Saved even when another task fails, so a freshly built generator isn't lost; only on a
      # miss, and only once the check has produced both tools (not when turbo reused its result).
      - name: Save the contract generators
        if: >-
          always()
          && steps.contract-generators.outputs.cache-hit != 'true'
          && hashFiles('packages/contract/node_modules/.cache/contract/swift-openapi-generator-*', '!**/*.partial') != ''
          && hashFiles('packages/contract/node_modules/.cache/contract/openapi-generator-cli-*.jar') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/contract/node_modules/.cache/contract
          key: ${{ steps.contract-generators.outputs.cache-primary-key }}

  e2e:
    name: E2E (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The e2e servers each create and migrate their own database on it (apps/web/e2e/serve.ts).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: trainer_hub
          POSTGRES_PASSWORD: trainer_hub
          POSTGRES_DB: trainer_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trainer_hub -d trainer_hub"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://trainer_hub:trainer_hub@localhost:5432/trainer_hub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Reuses the build from the latest "Checks (Linux)" cache when nothing changed.
      # Restore only: that job saves the cache.
      - name: Restore turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo/cache
            apps/web/.next/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @fivvi/web exec playwright --version | awk '{print $2}')" >>"$GITHUB_OUTPUT"

      # Browsers are cached per Playwright version; the OS packages they need are not
      # cacheable, so they are installed on every run.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium and its OS packages
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @fivvi/web exec playwright install --with-deps --only-shell chromium

      - name: Install Chromium's OS packages
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @fivvi/web exec playwright install-deps chromium

      # Builds the web app, then runs every spec in nl-NL and en with axe checks.
      - name: Web e2e (nl-NL and en)
        run: pnpm exec turbo run test:e2e --cache-dir=.turbo/cache

      # Only on failure: artifact storage counts against the free quota.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  ios:
    name: iOS
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    # Only starts when the app, its generated inputs or its own scripts changed (in a PR, a merge group or a push to main), or on
    # demand (scripts/native-jobs.sh), to keep PR feedback fast. The image and Xcode are pinned, so a runner update doesn't
    # change the toolchain. One job, not a matrix per locale: the check keeps its name, and nl and en share one build
    # without an artifact upload and download. nl and en run in one test-without-building run on one simulator (scripts/test-ios.sh),
    # so the simulator is prepared and the app installed once: two simulators on the 3-core runner were slower (cold
    # run: 743 s in parallel).
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # scripts/step-timings.sh reads this run's step durations
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: xcode
        name: Xcode version
        run: echo "version=$(xcodebuild -version | tr -s ' \n' '--' | sed 's/-$//')" >> "$GITHUB_OUTPUT"

      # DerivedData, with the compiled Swift packages (sentry-cocoa takes minutes to build), and the packages
      # themselves. Keyed by Package.resolved, the Xcode version and the runner OS; a stale cache (the restore key)
      # only costs build time and never changes a result. A PR can read its own caches and main's; main's are
      # written by the pushes that change native paths, so a PR's first run is warm once main has run it.
      - name: Cache the iOS build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/ios/.build/DerivedData
            apps/ios/.build/SourcePackages
            !apps/ios/.build/DerivedData/Logs
          key: ios-build-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('apps/ios/FivviPro.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ios-build-${{ runner.os }}-${{ steps.xcode.outputs.version }}-

      # The same steps as `pnpm test:ios` (apps/ios/README.md#tests): SwiftLint, one build-for-testing, then the nl and
      # en tests without building again. Prints the build timing summary and the slowest tests.
      - name: SwiftLint, build and tests (nl and en)
        run: scripts/test-ios.sh

      # Only on failure: artifact storage counts against the free quota.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-results
          path: |
            apps/ios/.build/TestResults-*.xcresult
            apps/ios/.build/build-for-testing.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Step durations
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/step-timings.sh

  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    # The same commands as locally (TESTING.md §7.2): pnpm test:android (ktlint and the literal-text check, build, unit
    # tests, Compose UI tests on an emulator), then pnpm test:maestro (Postgres, migrate, seed, the web server, and the
    # Maestro flows in nl-NL and en). The emulator needs KVM.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # scripts/step-timings.sh reads this run's step durations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The emulator creates a 6 GB data partition on its first boot and needs 7.4 GB free for it; Gradle, Postgres
      # and the web build need more. These preinstalled toolchains aren't used by this job.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # Caches Gradle's dependencies and wrapper; main's cache is readable by every PR.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm || true
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo '::error::/dev/kvm is not usable by the runner user'
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Reuses the web build from the latest "Checks (Linux)" cache when nothing changed. Restore only.
      - name: Restore turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo/cache
            apps/web/.next/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Android SDK packages, emulator and Maestro
        run: scripts/android.sh setup

      - id: avd
        name: Emulator cache key
        run: echo "key=$(scripts/android.sh avd-key)" >> "$GITHUB_OUTPUT"

      # The AVD with the snapshot of its booted state. Keyed by the system image, the emulator and the AVD settings
      # (a snapshot only loads on the same ones). Saved when the job passes on a miss, after the emulator has stopped.
      # A missing or broken snapshot is not an error: the boot below falls back to a cold boot. Bump v2 to drop every
      # cached AVD, and do it when a snapshot that no longer loads was replaced by a cold boot: the cache action never
      # overwrites an existing key, so the replacement isn't saved and every run would fall back to a cold boot. The
      # caches of a PR are its own and main's (written by pushes to main that change native paths).
      - name: Cache the emulator
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.android/avd
          key: avd-v2-${{ runner.os }}-${{ steps.avd.outputs.key }}

      # Booted once; test:android and test:maestro reuse it. From the snapshot when it is cached, else cold: then the
      # script saves one. It gives up after EMULATOR_BOOT_TIMEOUT (a cold boot can take minutes) and prints the
      # emulator log; the step timeout is a backstop.
      - name: Boot the emulator
        timeout-minutes: 10
        env:
          AVD_SNAPSHOT: '1'
          EMULATOR_BOOT_TIMEOUT: '480'
        run: scripts/android.sh emulator

      - name: ktlint, build, unit tests and Compose UI tests
        timeout-minutes: 20
        run: pnpm test:android

      - name: Maestro hello flow (nl-NL and en)
        timeout-minutes: 15
        run: pnpm test:maestro

      # The cache of the emulator is saved after this step: the emulator must not be running, or it would be copied in
      # mid-write.
      - name: Stop the emulator
        if: always()
        run: scripts/android.sh stop

      # Always, also after a cancel or timeout: without the emulator log a hung boot can't be diagnosed. Kept 7 days,
      # as artifact storage counts against the free quota.
      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-reports
          path: |
            apps/android/app/build/reports/
            apps/android/app/build/outputs/androidTest-results/
            apps/android/build/emulator.log*
            e2e/maestro/build/
          retention-days: 7
          if-no-files-found: ignore

      - name: Step durations
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/step-timings.sh
