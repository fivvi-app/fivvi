packages:
  - apps/*
  - packages/*
  # Pinned code generators for packages/contract (see its README).
  - packages/contract/tools/*

# Refuse dependencies whose "engines" exclude our Node version. The Node version
# of this repo itself is enforced by "devEngines.runtime" in package.json.
engineStrict: true

# Shared dependency versions. Workspace packages reference them as "catalog:".
catalog:
  # Exact: we enable nursery rules, which may change in minor releases.
  '@biomejs/biome': 2.5.14
  '@formatjs/icu-messageformat-parser': ^3.5.20
  '@hono/zod-openapi': ^1.6.3
  '@types/node': ^26.6.2
  '@types/pg': ^8.23.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  drizzle-kit: ^0.31.11
  drizzle-orm: ^0.45.3
  hono: ^4.13.8
  next: 16.3.6
  next-intl: ^4.14.6
  openapi-fetch: ^0.17.0
  pg: ^8.23.0
  react: ^19.3.0
  react-dom: ^19.3.0
  turbo: ^2.11.2
  typescript: ~7.0.2
  vitest: ^5.0.1
  zod: ^4.6.5

# Next.js 16.3.6 (latest, requested by the owner) was published on 2026-09-22,
# inside pnpm's 1-day minimum release age. These exact versions are exempt;
# remove this list once they are older than a day (after 2026-09-23 16:21 UTC).
minimumReleaseAgeExclude:
  - next@16.3.6
  - '@next/env@16.3.6'
  - '@next/swc-darwin-arm64@16.3.6'
  - '@next/swc-darwin-x64@16.3.6'
  - '@next/swc-linux-arm64-gnu@16.3.6'
  - '@next/swc-linux-arm64-musl@16.3.6'
  - '@next/swc-linux-x64-gnu@16.3.6'
  - '@next/swc-linux-x64-musl@16.3.6'
  - '@next/swc-win32-arm64-msvc@16.3.6'
  - '@next/swc-win32-x64-msvc@16.3.6'

# Dependency install scripts we have reviewed and keep disabled:
# - esbuild (via drizzle-kit) works without its postinstall step, because pnpm
#   installs the platform binary anyway.
# - @parcel/watcher and @swc/core belong to next-intl's optional message
#   extractor, which we don't use.
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: false
