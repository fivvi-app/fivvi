packages:
  - apps/*
  - packages/*
  # Pinned code generators for packages/contract (see its README).
  - packages/contract/tools/*

# Refuse dependencies whose "engines" exclude our Node version. The Node version
# of this repo itself is enforced by "devEngines.runtime" in package.json.
engineStrict: true

# Shared dependency versions. Workspace packages reference them as "catalog:".
catalog:
  # Exact: we enable nursery rules, which may change in minor releases.
  '@biomejs/biome': 2.5.14
  '@axe-core/playwright': ^4.13.0
  '@formatjs/icu-messageformat-parser': ^3.5.20
  '@hono/zod-openapi': ^1.6.3
  # Exact: CI caches the browsers per Playwright version.
  '@playwright/test': 1.63.0
  # Error reporting (E009). Only packages/observability may import @sentry/* (biome.json).
  '@sentry/browser': ^11.7.0
  # Uploads the web app's source maps at build time (packages/observability, E009).
  '@sentry/cli': ^3.8.0
  '@sentry/core': ^11.7.0
  '@tailwindcss/node': ^4.3.3
  '@tailwindcss/postcss': ^4.3.3
  '@types/node': ^26.6.2
  '@types/pg': ^8.23.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  # Exact: our sign-in plugin builds on its internal adapter. Only packages/auth may import it (biome.json, F001).
  better-auth: 1.7.12
  class-variance-authority: ^0.7.1
  # shadcn/ui's class merger (clsx + tailwind-merge), used by the components in packages/ui.
  cn: ^0.4.0
  drizzle-kit: ^0.31.11
  drizzle-orm: ^0.45.3
  hono: ^4.13.8
  next: 16.3.6
  next-intl: ^4.14.6
  openapi-fetch: ^0.17.0
  pg: ^8.23.0
  # Cookieless web page views (E009). Only packages/observability may import posthog-js (biome.json).
  posthog-js: ^1.438.10
  # Product events (E009). Only packages/observability may import posthog-node (biome.json).
  posthog-node: ^5.56.1
  # Radix primitives for the shadcn/ui components in packages/ui (style radix-nova).
  radix-ui: ^1.8.1
  # Exact: the Railway IaC SDK is in beta and may break in minor releases (.railway/).
  railway: 3.11.0
  react: ^19.3.0
  react-dom: ^19.3.0
  react-email: ^6.11.0
  # Major 4, as decided in spec #33 (E007).
  style-dictionary: ^4.4.0
  tailwindcss: ^4.3.3
  # Animation utilities (`animate-in`, `fade-in-0`) of the shadcn/ui components that animate, such as AlertDialog.
  tw-animate-css: ^1.4.0
  tsx: ^4.23.15
  turbo: ^2.11.2
  typescript: ~7.0.2
  use-intl: ^4.14.6
  vitest: ^5.0.1
  zod: ^4.6.5

# Dependency install scripts we have reviewed and keep disabled:
# - esbuild (via drizzle-kit) works without its postinstall step, because pnpm
#   installs the platform binary anyway.
# - @parcel/watcher and @swc/core belong to next-intl's optional message
#   extractor, which we don't use.
# - style-dictionary and @bundled-es-modules/glob (packages/design-tokens) run
#   patch-package, but ship no patches, so there is nothing to apply.
# - @sentry/cli (packages/observability) only downloads its binary when the platform
#   package (@sentry/cli-<platform>, an optional dependency) is missing; pnpm installs it.
# - core-js (via posthog-js, packages/observability) only prints a funding message.
allowBuilds:
  '@bundled-es-modules/glob': false
  '@parcel/watcher': false
  '@sentry/cli': false
  '@swc/core': false
  core-js: false
  esbuild: false
  style-dictionary: false

