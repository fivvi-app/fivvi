# Codex project config (docs/agents/codex-model-tiers.md). It loads only when the developer trusts this repository
# in ~/.codex/config.toml: [projects."<path of the main checkout>"] trust_level = "trusted".
#
# The main conversation (shaping and orchestration) and /review run on the high tier. The model is the high tier of
# .agents/agents/tiers.json; scripts/agents.sh check fails when they differ.
model = "gpt-6.1-sol"
model_reasoning_effort = "high"
review_model = "gpt-6.1-sol"

[agents]
# Codex runs at most three agent threads at once: a limit of the tool, not of the tickets in progress (ADR-021).
max_threads = 3
# No default_subagent_model: a subagent without a role (the reviewer's code-review axes) inherits its parent's tier.
# The roles builder, reviewer and mechanic are .codex/agents/*.toml, generated by scripts/agents.sh.
